<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Holo AI · Interface Demo</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #06080e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #e2e8f0;
  }

  /* Soft, non-aggressive ambient lighting centered behind the Orb */
  #glow {
    position: fixed;
    left: 50%;
    top: 26%;
    width: 72vmin;
    height: 72vmin;
    margin: -36vmin 0 0 -36vmin;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, rgba(99, 102, 241, 0.035) 42%, rgba(6, 8, 14, 0) 70%);
    pointer-events: none;
    will-change: transform, opacity;
    transition: transform 0.2s ease-out, opacity 0.25s ease-out;
    z-index: 1;
  }

  /* 3D WebGL Particle Canvas */
  canvas#c {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    outline: none;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    z-index: 2;
  }
  canvas#c:active {
    cursor: grabbing;
  }

  /* Top Minimalist Navigation Bar */
  .top-hud {
    position: fixed;
    top: 14px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
    z-index: 10;
    pointer-events: none;
  }
  .hud-brand {
    display: flex;
    align-items: center;
    gap: 9px;
    background: rgba(13, 17, 25, 0.82);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 9999px;
    padding: 6px 14px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
    pointer-events: auto;
  }
  .hud-dot {
    width: 6.5px;
    height: 6.5px;
    border-radius: 50%;
    background: #38bdf8;
    opacity: 0.9;
  }
  .hud-title {
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #f1f5f9;
  }
  .hud-mode-pill {
    font-size: 10.5px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.05);
    color: #94a3b8;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
  .hud-actions {
    display: flex;
    gap: 8px;
    pointer-events: auto;
  }
  .hud-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(13, 17, 25, 0.82);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #cbd5e1;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 13px;
    border-radius: 9999px;
    text-decoration: none;
    transition: all 0.2s ease;
    cursor: pointer;
  }
  .hud-btn:hover {
    background: rgba(26, 32, 46, 0.9);
    border-color: rgba(255, 255, 255, 0.16);
    color: #f8fafc;
  }

  /* Refined, Minimal Console BELOW the Orb */
  .console-wrapper {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: min(92vw, 740px);
    max-height: 46vh;
    display: flex;
    flex-direction: column;
    background: rgba(12, 16, 24, 0.88);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px;
    box-shadow: 0 24px 50px -10px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.03);
    z-index: 20;
    overflow: hidden;
    transition: border-color 0.25s ease;
  }
  .console-wrapper.active-stream {
    border-color: rgba(56, 189, 248, 0.35);
  }

  /* Console Header */
  .console-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    background: rgba(18, 24, 36, 0.55);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .console-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    font-weight: 500;
    color: #94a3b8;
  }
  .status-light {
    width: 6.5px;
    height: 6.5px;
    border-radius: 50%;
    background: #10b981;
    transition: background 0.25s;
  }
  .status-light.streaming {
    background: #38bdf8;
    animation: pulseDot 1s infinite alternate ease-in-out;
  }
  .console-tools {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tool-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #94a3b8;
    font-size: 11.5px;
    padding: 4px 9px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tool-btn:hover {
    color: #f1f5f9;
    border-color: rgba(255, 255, 255, 0.18);
    background: rgba(255, 255, 255, 0.08);
  }

  /* Scrollable Text Body */
  .console-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 14px 18px;
    font-size: 13.5px;
    line-height: 1.62;
    color: #e2e8f0;
    max-height: 230px;
  }
  .console-body::-webkit-scrollbar {
    width: 4px;
  }
  .console-body::-webkit-scrollbar-track {
    background: transparent;
  }
  .console-body::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.12);
    border-radius: 4px;
  }
  .console-body::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.22);
  }

  /* User Query Pill */
  .user-query-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 500;
    color: #cbd5e1;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 3px 9px;
    border-radius: 6px;
    margin-bottom: 12px;
    animation: queryAppear 0.22s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes queryAppear {
    0% { opacity: 0; transform: translateY(-4px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* Typography */
  .stream-text {
    word-break: break-word;
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
  }
  .stream-text strong {
    color: #f1f5f9;
    font-weight: 600;
  }
  .stream-text code {
    background: rgba(255, 255, 255, 0.06);
    color: #e2e8f0;
    padding: 2px 5px;
    border-radius: 4px;
    font-size: 12.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .stream-text pre {
    background: rgba(6, 9, 15, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    padding: 10px 14px;
    overflow-x: auto;
    margin: 8px 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px;
    color: #e2e8f0;
  }
  .para-gap {
    height: 12px;
  }

  /* ================= BUTTERY SMOOTH TOKEN ANIMATIONS ================= */
  @keyframes streamWordFade {
    0% {
      opacity: 0;
      transform: translateY(4px);
      filter: blur(2.5px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }
  }

  .stream-word {
    display: inline-block;
    white-space: pre-wrap;
    animation: streamWordFade 0.24s cubic-bezier(0.16, 1, 0.3, 1) both;
    will-change: transform, opacity, filter;
  }

  @keyframes blockFadeIn {
    0% {
      opacity: 0;
      transform: translateY(6px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .block-appear {
    animation: blockFadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* Smooth breathing vertical caret */
  .lively-cursor {
    display: inline-block;
    width: 2px;
    height: 14px;
    background: #38bdf8;
    margin-left: 2px;
    vertical-align: -2px;
    border-radius: 1px;
    animation: smoothCaretPulse 0.8s ease-in-out infinite alternate;
  }
  @keyframes smoothCaretPulse {
    0% { opacity: 0.25; transform: scaleY(0.85); }
    100% { opacity: 1; transform: scaleY(1); }
  }

  /* Quick Chips Row */
  .chips-row {
    display: flex;
    gap: 6px;
    padding: 8px 14px;
    overflow-x: auto;
    white-space: nowrap;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
  }
  .chips-row::-webkit-scrollbar {
    height: 0;
  }
  .chip {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #94a3b8;
    font-size: 11.5px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }
  .chip svg {
    opacity: 0.7;
    transition: opacity 0.15s ease;
  }
  .chip:hover {
    background: rgba(255, 255, 255, 0.07);
    border-color: rgba(255, 255, 255, 0.16);
    color: #f1f5f9;
  }
  .chip:hover svg {
    opacity: 1;
  }

  /* Input Bar */
  .console-input-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px 10px 12px;
    background: rgba(12, 16, 24, 0.95);
  }
  .input-field {
    flex: 1;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    padding: 9px 13px;
    font-size: 13px;
    color: #f8fafc;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-field::placeholder {
    color: #64748b;
  }
  .input-field:focus {
    border-color: rgba(56, 189, 248, 0.45);
  }
  .send-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #0284c7;
    border: none;
    color: #ffffff;
    font-size: 12.5px;
    font-weight: 500;
    padding: 9px 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  .send-btn:hover {
    background: #0369a1;
  }
  .send-btn:active {
    opacity: 0.9;
  }

  .orb-hint {
    position: fixed;
    top: 58px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: rgba(148, 163, 184, 0.45);
    letter-spacing: 0.06em;
    pointer-events: none;
    z-index: 5;
    text-align: center;
  }

  @keyframes pulseDot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  @media (max-width: 640px) {
    .console-wrapper {
      width: 95vw;
      bottom: 10px;
      max-height: 52vh;
    }
    .console-body {
      max-height: 180px;
      padding: 10px 14px;
      font-size: 12.8px;
    }
    .hud-title {
      font-size: 12px;
    }
    .hud-mode-pill {
      display: none;
    }
  }
</style>
</head>
<body>

<div id="glow"></div>
<canvas id="c"></canvas>

<!-- Top Navigation Bar -->
<div class="top-hud">
  <div class="hud-brand">
    <div class="hud-dot"></div>
    <span class="hud-title">Holo AI</span>
    <span class="hud-mode-pill">Text Demo</span>
  </div>
  <div class="hud-actions">
    <a href="../" class="hud-btn" title="Open Full Voice Companion">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>

      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

  <!-- Console Header -->
  <div class="console-header">
    <div class="console-status">
      <span class="status-light" id="statusLight"></span>
      <span id="statusText">System Ready</span>
    </div>
    <div class="console-tools">
      <button type="button" class="tool-btn" id="btnCopy" title="Copy text">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

        <circle cx="12" cy="12" r="3"></circle>

      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"></polyline>

    <div class="chip" data-prompt="Switch orb shape to a 3D geometric heart.">

  <!-- Input Bar with Clean SVG Arrow -->

    <button type="submit" class="send-btn">

<script>
// ================= 3D WEBGL PARTICLE ORB ENGINE =================
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', { antialias: false, alpha: true, premultipliedAlpha: true });
const glowEl = document.getElementById('glow');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W = 1, H = 1;

function resize() {
  W = cv.width = Math.floor(innerWidth * DPR);
  H = cv.height = Math.floor(innerHeight * DPR);
  gl.viewport(0, 0, W, H);
}
window.addEventListener('resize', resize);

const VS = `
precision highp float;
attribute vec3 aFrom;
attribute vec3 aTo;
attribute float aSeed;
attribute vec4 aCol;
uniform float uTime, uLevel, uBass, uMid, uHigh, uRotY, uRotX, uDPR, uMorph;
uniform vec2 uScale;
uniform vec2 uOffset;
uniform vec3 uTouch;
varying vec3 vColor;
varying float vA;

vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}

float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;
  vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}

void main(){
  float t=uTime;
  float m=clamp((uMorph-aSeed*0.45)/0.55, 0.0, 1.0);

function rndDir() {
  const u = R() * 2 - 1, t = R() * 6.2832, r = Math.sqrt(1 - u * u);
  return [Math.cos(t) * r, u, Math.sin(t) * r];
}

function genSphere() {
  const out = new Float32Array(N * 3), NS = Math.floor(N * 0.75), GA = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    let x, y, z;
    if (i < NS) {
      y = 1 - (i / (NS - 1)) * 2;
      const r = Math.sqrt(1 - y * y), t = GA * i;
      x = Math.cos(t) * r;
      z = Math.sin(t) * r;
    } else {
      const d = rndDir(), rad = 0.2 + 0.55 * Math.pow(R(), 0.7);
      x = d[0] * rad;
      y = d[1] * rad;
      z = d[2] * rad;
    }
    out[i * 3] = x;
    out[i * 3 + 1] = y;
    out[i * 3 + 2] = z;
  }
  return out;
}

function genHeart() {
  const out = new Float32Array(N * 3);
  let i = 0;
  while (i < N) {
    const X = (R() * 2 - 1) * 1.3, Y = (R() * 2 - 1) * 0.8, Z = (R() * 2 - 1) * 1.3 - 0.05;
    const a = X * X + 2.25 * Y * Y + Z * Z - 1;
    const v = a * a * a - X * X * Z * Z * Z - 0.1125 * Y * Y * Z * Z * Z;
    if (v <= 0) {
      out[i * 3] = X * 0.85;
      out[i * 3 + 1] = Z * 0.85;
      out[i * 3 + 2] = Y * 0.85;
      i++;

}

// Markdown to Streamable Action Tokens Parser
function parseMarkdownToStreamTokens(md) {
  const tokens = [];
  const lines = md.split('\n');
  let inCode = false;

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];

    // Fenced code blocks
    if (line.trim().startsWith('```')) {
      if (!inCode) {
        inCode = true;
        tokens.push({ type: 'open_block', tag: 'pre' });
        tokens.push({ type: 'open_inline', tag: 'code' });
      } else {
        inCode = false;
        tokens.push({ type: 'close_inline' });
        tokens.push({ type: 'close_block' });
      }
      continue;
    }

    if (inCode) {
      tokens.push({ type: 'code_line', text: line + '\n' });
      continue;
    }

    if (line.trim() === '') {
      tokens.push({ type: 'break' });
      continue;
    }

    const isList = /^\s*[-•]\s+/.test(line);
    if (isList) {
      line = line.replace(/^\s*[-•]\s+/, '• ');
    }

    // Split line into formatting units and regular words
    const parts = line.split(/(\*\*[^*]+\*\*|`[^`]+`|\*[^*]+\*)/g);
    for (const part of parts) {
      if (!part) continue;
      if (part.startsWith('**') && part.endsWith('**')) {
        tokens.push({ type: 'open_inline', tag: 'strong' });
        const inner = part.slice(2, -2);
        const words = inner.match(/\S+|\s+/g) || [inner];
        for (const w of words) tokens.push({ type: 'word', text: w });
        tokens.push({ type: 'close_inline' });
      } else if (part.startsWith('`') && part.endsWith('`')) {
        tokens.push({ type: 'open_inline', tag: 'code' });
        tokens.push({ type: 'word', text: part.slice(1, -1) });
        tokens.push({ type: 'close_inline' });
      } else if (part.startsWith('*') && part.endsWith('*')) {
        tokens.push({ type: 'open_inline', tag: 'em' });
        const inner = part.slice(1, -1);
        const words = inner.match(/\S+|\s+/g) || [inner];
        for (const w of words) tokens.push({ type: 'word', text: w });
        tokens.push({ type: 'close_inline' });
      } else {
        const words = part.match(/\S+|\s+/g) || [part];
        for (const w of words) tokens.push({ type: 'word', text: w });
      }
    }

    tokens.push({ type: 'line_end' });
  }

  return tokens;
}

// Buttery-smooth, V-Sync synchronized streaming engine
function streamLivelyResponse(fullText, userQuery) {
  if (activeAnimationId) {
    cancelAnimationFrame(activeAnimationId);
    activeAnimationId = null;
  }

  isAgentGenerating = true;
  currentRawReply = fullText;
  consoleWrapper.classList.add('active-stream');
  statusLight.className = 'status-light streaming';
  statusText.textContent = 'Transmitting stream...';

  // Display user query tag
  if (userQuery) {
    queryTagWrap.innerHTML = `<div class="user-query-tag"><span>Inquiry</span><span>&rsaquo;</span><span>${escapeHtml(userQuery)}</span></div>`;
  } else {
    queryTagWrap.innerHTML = '';
  }

  // Clear output target and initialize caret
  streamTarget.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'lively-cursor';
  cursor.id = 'streamCursor';
  streamTarget.appendChild(cursor);

  const tokens = parseMarkdownToStreamTokens(fullText);
  let tokenIndex = 0;
  const elementStack = [streamTarget];

  let lastFrameTime = performance.now();
  let tokenAccumulator = 0;
  // ~38-42 tokens/sec cadence creates an organic, silky reading flow
  const tokensPerMs = 0.038;

  function processSingleToken(tok) {
    const currentParent = elementStack[elementStack.length - 1];

    if (tok.type === 'open_block') {
      const el = document.createElement(tok.tag);
      el.className = 'block-appear';
      currentParent.insertBefore(el, cursor);
      elementStack.push(el);
    } else if (tok.type === 'open_inline') {
      const el = document.createElement(tok.tag);
      currentParent.insertBefore(el, cursor);
      elementStack.push(el);
    } else if (tok.type === 'close_block' || tok.type === 'close_inline') {
      if (elementStack.length > 1) {
        elementStack.pop();
      }
    } else if (tok.type === 'word') {
      if (/^\s+$/.test(tok.text)) {
        const spaceNode = document.createTextNode(tok.text);
        currentParent.insertBefore(spaceNode, cursor);
      } else {
        const span = document.createElement('span');
        span.className = 'stream-word';
        span.textContent = tok.text;
        currentParent.insertBefore(span, cursor);
      }
    } else if (tok.type === 'code_line') {
      const span = document.createElement('span');
      span.className = 'stream-word';
      span.textContent = tok.text;
      currentParent.insertBefore(span, cursor);
    } else if (tok.type === 'break') {
      const gap = document.createElement('div');
      gap.className = 'para-gap';
      currentParent.insertBefore(gap, cursor);
    } else if (tok.type === 'line_end') {
      if (!currentParent.closest('pre')) {
        const br = document.createElement('br');
        currentParent.insertBefore(br, cursor);
      }
    }
  }

  function frameStep(now) {
    const delta = Math.min(now - lastFrameTime, 100);
    lastFrameTime = now;
    tokenAccumulator += delta * tokensPerMs;

    // Process tokens accumulated up to this frame
    while (tokenAccumulator >= 1.0 && tokenIndex < tokens.length) {
      processSingleToken(tokens[tokenIndex]);
      tokenIndex++;
      tokenAccumulator -= 1.0;
    }

    // Smooth exponential scroll glide (LERP)
    const targetScroll = consoleBody.scrollHeight - consoleBody.clientHeight;
    if (targetScroll > consoleBody.scrollTop + 0.5) {
      consoleBody.scrollTop += (targetScroll - consoleBody.scrollTop) * 0.16;
    }

    if (tokenIndex < tokens.length) {
      activeAnimationId = requestAnimationFrame(frameStep);
    } else {
      activeAnimationId = null;
      isAgentGenerating = false;
      consoleWrapper.classList.remove('active-stream');
      statusLight.className = 'status-light';
      statusText.textContent = 'Completed';

      // Settle scroll naturally to bottom
      function settleScroll() {
        const remaining = consoleBody.scrollHeight - consoleBody.clientHeight - consoleBody.scrollTop;
        if (remaining > 0.5) {
          consoleBody.scrollTop += remaining * 0.2;
          requestAnimationFrame(settleScroll);
        } else {
          consoleBody.scrollTop = consoleBody.scrollHeight - consoleBody.clientHeight;
        }
      }
      requestAnimationFrame(settleScroll);

      // Smoothly fade out the caret
      setTimeout(() => {
        cursor.style.transition = 'opacity 0.4s ease';
        cursor.style.opacity = '0';
        setTimeout(() => cursor.remove(), 400);
      }, 800);
    }
  }

  activeAnimationId = requestAnimationFrame(frameStep);
}

        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <span>Copied</span>
    `;
    setTimeout(() => { btnCopy.innerHTML = origHTML; }, 1500);
  });
});

btnClear.addEventListener('click', () => {
  if (activeAnimationId) cancelAnimationFrame(activeAnimationId);
  activeAnimationId = null;
  isAgentGenerating = false;
  queryTagWrap.innerHTML = '';
  streamTarget.innerHTML = '<span style="color:#64748b; font-style:italic;">Console cleared. Select a chip or enter a query above to initiate output stream.</span>';
  statusLight.className = 'status-light';
  statusText.textContent = 'System Ready';
});

window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    streamLivelyResponse(
      `**Holo AI // Test Interface Ready**\n\n` +
      `• **3D Particle Orb:** Active above. Touch or drag to rotate.\n` +
      `• **Silent Architecture:** Audio voice output is disabled for pure visual and textual evaluation.\n` +
      `• **Interaction:** Select an option from the chips below or type a query in the input bar.`,
      null
    );
  }, 350);
});
</script>
