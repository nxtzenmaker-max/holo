<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
<title>RJN · 3D Living Hologram AI</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    width: 100%;
    background: #03040a;
    overflow: hidden;
    touch-action: none;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  #glow {
    position: fixed;
    left: 50%;
    top: 46%;
    width: 105vmin;
    height: 105vmin;
    margin: -52.5vmin 0 0 -52.5vmin;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(70, 150, 255, 0.38) 0%, rgba(120, 70, 255, 0.15) 40%, rgba(0, 0, 0, 0) 68%);
    pointer-events: none;
    will-change: transform, opacity;
    transition: transform 0.15s ease-out, opacity 0.2s ease-out;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
  }
  canvas:active {
    cursor: grabbing;
  }
  #callPill {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(10, 15, 30, 0.72);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(100, 160, 255, 0.25);
    border-radius: 999px;
    padding: 10px 22px;
    color: #dbe8ff;
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 16px rgba(50, 120, 255, 0.15);
    z-index: 20;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    -webkit-user-select: none;
    user-select: none;
    white-space: nowrap;
  }
  #callPill:hover {
    background: rgba(16, 25, 48, 0.85);
    border-color: rgba(120, 180, 255, 0.5);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 24px rgba(70, 150, 255, 0.35);
  }
  #callPill.active {
    background: rgba(15, 30, 60, 0.85);
    border-color: rgba(0, 240, 255, 0.6);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 28px rgba(0, 240, 255, 0.4);
  }
  #callDot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3b82f6;
    box-shadow: 0 0 10px #3b82f6;
    transition: all 0.3s;
    flex-shrink: 0;
  }
  #callPill.active #callDot {
    background: #00f0ff;
    box-shadow: 0 0 12px #00f0ff;
    animation: pulseDot 1.4s infinite;
  }
  #callPill.speaking #callDot {
    background: #f43f5e;
    box-shadow: 0 0 12px #f43f5e;
    animation: pulseDot 0.8s infinite;
  }
  #callPill.thinking #callDot {
    background: #a855f7;
    box-shadow: 0 0 12px #a855f7;
    animation: pulseDot 1s infinite;
  }
  @keyframes pulseDot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(0.6); opacity: 0.5; }
  }
</style>
</head>
<body>
<div id="glow"></div>
<canvas id="c"></canvas>

<div id="callPill">
  <div id="callDot"></div>
  <span id="callText">📞 Tap Orb or Here to Call RJN</span>
</div>

<script>
// ================= INITIALIZE WEBGL =================
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', { antialias: false, alpha: true, premultipliedAlpha: true });
const glowEl = document.getElementById('glow');
const callPill = document.getElementById('callPill');
const callText = document.getElementById('callText');

const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W = 1, H = 1;

function resize(){
  W = cv.width = Math.floor(innerWidth * DPR);
  H = cv.height = Math.floor(innerHeight * DPR);
  gl.viewport(0, 0, W, H);
}
addEventListener('resize', resize);

// ================= SHADERS (EXACT FROM ORIGINAL FILE) =================
const VS = `
precision highp float;
attribute vec3 aFrom;
attribute vec3 aTo;
attribute float aSeed;
attribute vec4 aCol;
uniform float uTime,uLevel,uBass,uMid,uHigh,uRotY,uRotX,uDPR,uMorph,uImg,uPx;
uniform vec2 uScale;
uniform vec3 uTouch;
uniform float uChar;
uniform vec2 uMouth;
varying vec3 vColor;
varying float vA;
varying float vImg;

vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;
  vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}

void main(){
  float t=uTime;
  float k0=1.0-uImg;
  float m=clamp((uMorph-aSeed*0.45)/0.55,0.0,1.0);
  m=m*m*(3.0-2.0*m);
  vec3 pos=mix(aFrom,aTo,m);
  float mid=sin(3.14159265*m);

  float ang=mid*(1.2+aSeed*2.5);
  float ca=cos(ang),sa=sin(ang);
  pos=vec3(pos.x*ca+pos.z*sa,pos.y,-pos.x*sa+pos.z*ca);
  pos+=vec3(sin(aSeed*127.1),sin(aSeed*311.7),sin(aSeed*74.7))*0.45*mid;

  vec3 dir=normalize(pos+vec3(0.0001));
  float n=snoise(pos*1.5+vec3(0.0,t*0.15,t*0.10));
  float n2=snoise(pos*4.5+vec3(t*0.3,0.0,-t*0.2));
  float d=(n*(0.012+uLevel*0.05+uBass*0.03)+n2*(0.004+uMid*0.015+uHigh*0.008))*k0;
  pos+=dir*d;
  pos*=1.0+uBass*0.05*k0;

  // Touch force
  vec2 dv=pos.xy-uTouch.xy;
  float dd=length(dv);
  float fall=exp(-dd*dd*24.0)*uTouch.z;
  pos.xy+=normalize(dv+vec2(0.0001))*fall*0.16+vec2(-dv.y,dv.x)/(dd+0.06)*fall*0.04;
  pos.z+=fall*0.12;

  float cy=cos(uRotY),sy=sin(uRotY),cx=cos(uRotX),sx=sin(uRotX);
  vec3 r1=vec3(pos.x*cy+pos.z*sy,pos.y,-pos.x*sy+pos.z*cy);
  vec3 r2=vec3(r1.x,r1.y*cx-r1.z*sx,r1.y*sx+r1.z*cx);
  float f=1.0/(2.6-r2.z*0.8);
  gl_Position=vec4(r2.x*f*uScale.x*2.6,r2.y*f*uScale.y*2.6,0.0,1.0);

  float depth=clamp((r2.z/1.6)*0.5+0.5,0.0,1.0);
  float sizeTheme=(0.9+depth*2.0+aSeed*0.6)*uDPR*(1.0+uLevel*0.5);
  gl_PointSize=mix(sizeTheme,uPx,uImg);

  float cmix=n*0.5+0.5+mid*0.4;
  vec3 c1=vec3(0.10,0.65,1.00); // Electric Cyan
  vec3 c2=vec3(0.55,0.35,1.00); // Celestial Violet
  vec3 c3=vec3(1.00,0.35,0.75); // Radiant Magenta
  vec3 col=mix(c1,c2,clamp(cmix+depth*0.3-0.2,0.0,1.0));
  col=mix(col,c3,clamp(uLevel*1.2*cmix,0.0,0.7));
  vec3 themeCol=col*(0.4+depth*0.6);
  float themeA=(0.26+mid*0.14)*(0.2+depth*0.7);
  vColor=mix(themeCol,aCol.rgb,uImg);
  vA=mix(themeA,aCol.a,uImg);
  vImg=uImg;
}`;

const FS = `
precision mediump float;
varying vec3 vColor;
varying float vA;
varying float vImg;
void main(){
  float circ=1.0-smoothstep(0.05,0.5,length(gl_PointCoord-0.5));
  float s=mix(circ,1.0,vImg);
  float al=s*vA;
  gl_FragColor=vec4(vColor*al,al*mix(0.5,1.0,vImg));
}`;

function sh(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);

// ================= 3D PROCEDURAL SHAPES =================
const N = 90000;
const R = Math.random;

function rndDir(){
  const u = R() * 2 - 1, t = R() * 6.2832, r = Math.sqrt(1 - u * u);
  return [Math.cos(t) * r, u, Math.sin(t) * r];
}

function normalize(a){
  const mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
  for (let i = 0; i < N; i++) for (let c = 0; c < 3; c++){
    const v = a[i * 3 + c]; if (v < mn[c]) mn[c] = v; if (v > mx[c]) mx[c] = v;
  }
  const ct = [(mn[0] + mx[0]) / 2, (mn[1] + mx[1]) / 2, (mn[2] + mx[2]) / 2];
  let m2 = 0;
  for (let i = 0; i < N; i++){
    const x = a[i * 3] -= ct[0], y = a[i * 3 + 1] -= ct[1], z = a[i * 3 + 2] -= ct[2];
    const d = x * x + y * y + z * z; if (d > m2) m2 = d;
  }
  const s = 1 / Math.sqrt(m2 || 1);
  for (let i = 0; i < N * 3; i++) a[i] *= s;
  return a;
}

function build(list){
  const tot = list.reduce((a, b) => a + b[0], 0), cum = []; let acc = 0;
  for (const it of list){ acc += it[0] / tot; cum.push(acc); }
  const out = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    const r = R(); let k = 0; while (k < cum.length - 1 && r > cum[k]) k++;
    const p = list[k][1]();
    out[i * 3] = p[0]; out[i * 3 + 1] = p[1]; out[i * 3 + 2] = p[2];
  }
  return normalize(out);
}

const mapAxis = (ax, a, p, q) => ax === 'x' ? [a, p, q] : ax === 'y' ? [p, a, q] : [p, q, a];
const ell = (c, r) => () => { const d = rndDir(); return [c[0] + d[0] * r[0], c[1] + d[1] * r[1], c[2] + d[2] * r[2]]; };

function box(c, s, ry = 0){
  const ax = s[1] * s[2], ay = s[0] * s[2], az = s[0] * s[1], tot = ax + ay + az, cs = Math.cos(ry), sn = Math.sin(ry);
  return () => {
    const r = R() * tot, u = R() - .5, v = R() - .5, sg = R() < .5 ? -.5 : .5; let x, y, z;
    if (r < ax){ x = sg * s[0]; y = u * s[1]; z = v * s[2]; }
    else if (r < ax + ay){ x = u * s[0]; y = sg * s[1]; z = v * s[2]; }
    else { x = u * s[0]; y = v * s[1]; z = sg * s[2]; }
    return [c[0] + x * cs + z * sn, c[1] + y, c[2] - x * sn + z * cs];
  };
}

function cyl(c, axis, r, len){
  const side = 2 * Math.PI * r * len, cap = 2 * Math.PI * r * r;
  return () => {
    let a, p, q; const th = R() * 6.2832;
    if (R() * (side + cap) < side){ a = (R() - .5) * len; p = r * Math.cos(th); q = r * Math.sin(th); }
    else { a = (R() < .5 ? -.5 : .5) * len; const rr = r * Math.sqrt(R()); p = rr * Math.cos(th); q = rr * Math.sin(th); }
    const m = mapAxis(axis, a, p, q); return [c[0] + m[0], c[1] + m[1], c[2] + m[2]];
  };
}

function torus(c, axis, Rm, r){
  return () => {
    const u = R() * 6.2832, v = R() * 6.2832, rad = Rm + r * Math.cos(v);
    const m = mapAxis(axis, r * Math.sin(v), rad * Math.cos(u), rad * Math.sin(u));
    return [c[0] + m[0], c[1] + m[1], c[2] + m[2]];
  };
}

// 1. Orb / Celestial Sphere
function genSphere(){
  const out = new Float32Array(N * 3), NS = Math.floor(N * 0.75), GA = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++){
    let x, y, z;
    if (i < NS){
      y = 1 - (i / (NS - 1)) * 2;
      const r = Math.sqrt(1 - y * y), t = GA * i;
      x = Math.cos(t) * r; z = Math.sin(t) * r;
    } else {
      const d = rndDir(), rad = 0.2 + 0.55 * Math.pow(R(), 0.7);
      x = d[0] * rad; y = d[1] * rad; z = d[2] * rad;
    }
    out[i * 3] = x; out[i * 3 + 1] = y; out[i * 3 + 2] = z;
  }
  return out;
}

// 2. Sports Car
function genCar(){
  const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const top = x => { let h = .2; if (x > .5) h -= .13 * sm(.5, 1, x); if (x < -.6) h -= .03 * sm(-.6, -1, x); return h; };
  const bot = x => .02 * sm(.7, 1, x);
  const hw = x => {
    let w = .47;
    if (x > .65) w *= 1 - .45 * Math.pow((x - .65) / .35, 2);
    if (x < -.7) w *= 1 - .2 * Math.pow((-x - .7) / .3, 2);
    const q = (Math.abs(x) - .62) / .17;
    return w * (1 + .08 * Math.exp(-q * q));
  };
  const e = 2 / 3.2;
  const body = () => {
    const x = R() * 2 - 1, th = R() * 6.2832, c = Math.cos(th), s = Math.sin(th);
    const px = Math.sign(c) * Math.pow(Math.abs(c), e), py = Math.sign(s) * Math.pow(Math.abs(s), e);
    const t = top(x), b = bot(x);
    return [x, (t + b) / 2 + py * (t - b) / 2, px * hw(x)];
  };
  const canopy = ell([-.08, .2, 0], [.5, .19, .33]);
  const L = [
    [12, body],
    [2.5, () => { let p; do { p = canopy(); } while (p[1] < .2); return p; }],
    [.8, box([-.9, .42, 0], [.16, .025, 1.0])],
    [.2, box([-.9, .44, .5], [.16, .09, .02])],
    [.2, box([-.9, .44, -.5], [.16, .09, .02])],
    [.15, box([-.88, .3, .25], [.03, .2, .03])],
    [.15, box([-.88, .3, -.25], [.03, .2, .03])],
    [.5, box([1.0, -.01, 0], [.12, .015, .9])],
    [.3, box([-1.0, .0, 0], [.1, .03, .7])],
    [.3, box([-.99, .15, 0], [.02, .03, .7])],
    [.3, ell([.93, .12, .28], [.06, .015, .1])],
    [.3, ell([.93, .12, -.28], [.06, .015, .1])],
    [.1, cyl([-1.02, .06, .15], 'x', .035, .1)],
    [.1, cyl([-1.02, .06, -.15], 'x', .035, .1)],
    [.3, box([-.3, .12, .49], [.3, .07, .015])],
    [.3, box([-.3, .12, -.49], [.3, .07, .015])],
    [.35, box([0, .0, .5], [1.4, .04, .02])],
    [.35, box([0, .0, -.5], [1.4, .04, .02])],
    [.2, box([.55, .205, .15], [.25, .01, .1])],
    [.2, box([.55, .205, -.15], [.25, .01, .1])],
    [.15, ell([.28, .28, .4], [.04, .03, .05])],
    [.15, ell([.28, .28, -.4], [.04, .03, .05])],
  ];
  for (const sx of [.62, -.62]) for (const sz of [.47, -.47]){
    const sg = Math.sign(sz), cy = -.02;
    L.push([1.25, torus([sx, cy, sz], 'z', .17, .075)]);
    L.push([.3, torus([sx, cy, sz + sg * .03], 'z', .115, .012)]);
    L.push([.35, () => { const a = ((R() * 5) | 0) * 1.2566 + .3, r = R() * .115; return [sx + r * Math.cos(a), cy + r * Math.sin(a), sz + sg * .03]; }]);
    L.push([.1, cyl([sx, cy, sz + sg * .03], 'z', .03, .02)]);
    L.push([.1, cyl([sx, cy, sz - sg * .03], 'z', .095, .015)]);
  }
  return build(L);
}

// 3. Jet Plane
function genPlane(){
  const wing = (span, c0, taper, xRoot, sweep, y) => () => {
    const side = R() < .5 ? -1 : 1, t = R(), z = side * t * span;
    const chord = c0 * (1 - taper * t) + .03, xl = xRoot - t * sweep;
    return [xl - R() * chord, y + (R() - .5) * .012, z];
  };
  const L = [
    [6, cyl([0, 0, 0], 'x', .13, 1.7)],
    [1, ell([.85, 0, 0], [.25, .13, .13])],
    [1, ell([-.95, .03, 0], [.3, .1, .1])],
    [7, wing(1.0, .45, .65, .15, .5, -.03)],
    [1.5, wing(.38, .2, .5, -.78, .2, .03)],
    [1.5, () => { const t = R(), y = t * .32 + .05, ch = .28 * (1 - .6 * t) + .04, xl = -.7 - t * .25; return [xl - R() * ch, y, (R() - .5) * .02]; }],
    [.8, cyl([0, -.1, .4], 'x', .07, .35)],
    [.8, cyl([0, -.1, -.4], 'x', .07, .35)],
  ];
  return build(L);
}

// 4. Rocket
function genRocket(){
  const nose = ell([0, .8, 0], [.25, .45, .25]);
  const L = [
    [6, cyl([0, 0, 0], 'y', .25, 1.3)],
    [2, () => { let p; do { p = nose(); } while (p[1] < .65); return p; }],
    [3, () => {
      const a = ((R() * 3) | 0) * 2.0944, r = .25 + R() * .35, y = -.65 + R() * .45 * (1 - (r - .25) / .35), z = (R() - .5) * .03;
      return [r * Math.cos(a) + z * Math.sin(a), y, -r * Math.sin(a) + z * Math.cos(a)];
    }],
    [.6, torus([0, .3, .25], 'z', .09, .025)],
    [1.5, () => { const t = R(), rr = .14 * (1 - t) * Math.sqrt(R()), th = R() * 6.2832; return [rr * Math.cos(th), -.7 - t * .5, rr * Math.sin(th)]; }],
  ];
  return build(L);
}

// 5. Beating Heart
function genHeart(){
  const out = new Float32Array(N * 3); let i = 0;
  while (i < N){
    const X = (R() * 2 - 1) * 1.3, Y = (R() * 2 - 1) * .8, Z = (R() * 2 - 1) * 1.3 - .05;
    const a = X * X + 2.25 * Y * Y + Z * Z - 1, v = a * a * a - X * X * Z * Z * Z - .1125 * Y * Y * Z * Z * Z;
    if (v < 0 && v > -.25){ out[i * 3] = X; out[i * 3 + 1] = Z; out[i * 3 + 2] = Y; i++; }
  }
  return normalize(out);
}

// 6. DNA Double Helix
function genDNA(){
  const P = 18.85, r = .4;
  return build([
    [7, () => { const t = R() * 2 - 1, a = t * P + (R() < .5 ? 0 : Math.PI); return [r * Math.cos(a) + (R() - .5) * .05, t * 1.2 + (R() - .5) * .05, r * Math.sin(a) + (R() - .5) * .05]; }],
    [3, () => { const t = ((R() * 28) | 0) / 28 * 2 - 1, a = t * P, u = R() * 2 - 1; return [r * Math.cos(a) * u, t * 1.2, r * Math.sin(a) * u]; }],
  ]);
}

// 8. 3D Star
function genStar(){
  const out = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    const angle = R() * Math.PI * 2;
    const rBase = 0.52 + 0.45 * Math.cos(5 * angle);
    const r = Math.pow(R(), 0.5) * rBase;
    const z = (R() - 0.5) * 0.28 * (1.0 - r / 1.0);
    out[i * 3] = r * Math.sin(angle);
    out[i * 3 + 1] = r * Math.cos(angle);
    out[i * 3 + 2] = z;
  }
  return normalize(out);
}

// 9. Diamond / Crystal
function genDiamond(){
  const out = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    const th = R() * 6.2832;
    const y = R() * 2 - 1;
    const maxR = (1 - Math.abs(y)) * (0.8 + 0.2 * Math.cos(8 * th));
    const r = Math.pow(R(), 0.5) * maxR;
    out[i * 3] = r * Math.cos(th);
    out[i * 3 + 1] = y * 1.1;
    out[i * 3 + 2] = r * Math.sin(th);
  }
  return normalize(out);
}

// 10. Flower / Lotus Petals
function genFlower(){
  const out = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    const u = R(), th = R() * 6.2832 * 3;
    const r = Math.pow(u, 0.6) * 0.9;
    const petal = 0.7 + 0.3 * Math.cos(6 * th);
    const y = (1.0 - Math.pow(r / 0.9, 1.5)) * 0.4 + Math.sin(th * 3) * 0.08;
    out[i * 3] = r * petal * Math.cos(th);
    out[i * 3 + 1] = y - 0.2;
    out[i * 3 + 2] = r * petal * Math.sin(th);
  }
  return normalize(out);
}

// 11. Spiral Galaxy
function genGalaxy(){
  const out = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    const arm = ((R() * 2) | 0) * Math.PI;
    const dist = Math.pow(R(), 0.7) * 1.2;
    const angle = dist * 3.5 + arm + (R() - 0.5) * 0.35;
    const spread = Math.exp(-dist * 1.5) * 0.18 + 0.03;
    out[i * 3] = dist * Math.cos(angle) + (R() - 0.5) * spread;
    out[i * 3 + 1] = (R() - 0.5) * spread * 0.7;
    out[i * 3 + 2] = dist * Math.sin(angle) + (R() - 0.5) * spread;
  }
  return normalize(out);
}

// 12. Warrior Sword
function genSword(){
  return build([
    [7, () => {
      const y = -0.2 + R() * 1.5;
      const taper = Math.max(0.05, 1.0 - Math.max(0, (y - 1.0) / 0.3));
      const w = (R() - 0.5) * 0.12 * taper;
      const th = (R() - 0.5) * 0.03 * taper;
      return [w, y, th];
    }],
    [2, box([0, -0.25, 0], [0.65, 0.06, 0.08])],
    [1.5, cyl([0, -0.55, 0], 'y', 0.045, 0.55)],
    [0.8, ell([0, -0.85, 0], [0.08, 0.08, 0.08])]
  ]);
}

// 13. Shield
function genShield(){
  const out = new Float32Array(N * 3);
  let i = 0;
  while (i < N){
    const x = (R() * 2 - 1) * 0.7;
    const y = (R() * 2 - 1) * 0.9;
    let bound = 0.7;
    if (y < 0) bound = 0.7 * (1 - Math.pow(-y / 0.9, 1.8));
    if (Math.abs(x) < bound){
      const curv = (1 - (x * x) / (bound * bound + 0.01)) * 0.15;
      out[i * 3] = x;
      out[i * 3 + 1] = y;
      out[i * 3 + 2] = curv + (R() - 0.5) * 0.04;
      i++;
    }
  }
  return normalize(out);
}

// 14. Extruded Particle Text / Emoji
function fromCoords(list, w, h, depth){
  const n = list.length / 2; if (n < 50) return null;
  const sc = Math.max(w, h) / 2, out = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    const k = ((R() * n) | 0) * 2;
    out[i * 3] = (list[k] + R() - .5 - w / 2) / sc;
    out[i * 3 + 1] = -(list[k + 1] + R() - .5 - h / 2) / sc;
    out[i * 3 + 2] = (R() - .5) * depth;
  }
  return normalize(out);
}

function genText(str){
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = 'bold 100px sans-serif';
  const w = g.measureText(str).width || 100;
  g.font = 'bold ' + Math.min(380, 100 * (S * .85) / w) + 'px sans-serif';
  g.fillText(str, S / 2, S / 2 + 6);
  const d = g.getImageData(0, 0, S, S).data, list = [];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) if (d[(y * S + x) * 4 + 3] > 128) list.push(x, y);
  return fromCoords(list, S, S, .22);
}

  const loc = gl.getAttribLocation(prog, name);

}

    for (let c = 0; c < 3; c++){ const k = i * 3 + c; curFrom[k] = curFrom[k] * (1 - m) + curTo[k] * m; }
  }
  curTo.set(arr); morph = 0; mode = md;
  gl.bindBuffer(gl.ARRAY_BUFFER, bFrom); gl.bufferData(gl.ARRAY_BUFFER, curFrom, gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, bTo);   gl.bufferData(gl.ARRAY_BUFFER, curTo, gl.DYNAMIC_DRAW);

  if (e.touches && e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    initialPinchDist = Math.hypot(dx, dy);
    initialPinchZoom = userZoom;
  }
}, { passive: true });

  if (e.touches && e.touches.length === 2 && initialPinchDist) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    userZoom = Math.min(2.5, Math.max(0.4, initialPinchZoom * (dist / initialPinchDist)));
  }
}, { passive: true });

window.addEventListener('touchend', e => {
  if (!e.touches || e.touches.length < 2) initialPinchDist = null;
}, { passive: true });

window.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY < 0 ? 0.08 : -0.08;

}, { passive: false });

        }, delay);
      }
    } catch(err) {
      console.warn('DG msg parse err', err);
    }
  };

  dgSocket.onerror = e => {
    console.warn('Deepgram WS error', e);
  };

  dgSocket.onclose = () => {
    if (isCallActive && !activeAudioSource) {
      setTimeout(connectDeepgramSTT, 1200);
    }
  };
}

async function processVoiceQuery(userSpeech){
  if (!userSpeech || activeAudioSource) return;
  updateCallStatus('thinking', '✨ RJN सोच रही है...');

  try {
    const res = await callGroqAI(userSpeech);
    console.log('RJN response:', res);

    // Autonomous shape morphing on command!
    if (res.shape && res.shape !== 'none') {
      morphShape(res.shape);
    }

    // Speak response through phone speaker
    if (res.reply) {
      await speakRJN(res.reply);
    } else {
      updateCallStatus('listening', '🎙️ RJN सुन रही है... (Boliye)');
    }
  } catch(err) {
    console.error('Query processing error:', err);
    updateCallStatus('listening', '🎙️ RJN सुन रही है... (Boliye)');
  }
}

// ================= RENDER LOOP (RAW WEBGL GLOW & PARTICLES) =================
let lastT = performance.now();
let audioLevel = 0, bassLevel = 0, midLevel = 0, highLevel = 0;

function render(now){
  requestAnimationFrame(render);
  const dt = Math.min((now - lastT) * 0.001, 0.1);
  lastT = now;
  const t = now * 0.001;

  // Damped 3D rotation
  rotX += (targetRotX - rotX) * 0.08;
  rotY += (targetRotY - rotY) * 0.08;
  if (!isDragging) {
    targetRotY += 0.0035;
  }

  // Frequency analysis for voice reactivity
  if (analyser && audioDataArr) {
    analyser.getByteFrequencyData(audioDataArr);
    let bSum = 0, mSum = 0, hSum = 0, tot = 0;
    const n = audioDataArr.length;
    for (let i = 0; i < n; i++){
      const v = audioDataArr[i] / 255.0;
      tot += v;
      if (i < n * 0.15) bSum += v;
      else if (i < n * 0.55) mSum += v;
      else hSum += v;
    }
    const bAvg = bSum / (n * 0.15);
    const mAvg = mSum / (n * 0.40);
    const hAvg = hSum / (n * 0.45);
    const totAvg = tot / n;

    audioLevel += (totAvg - audioLevel) * 0.25;
    bassLevel += (bAvg - bassLevel) * 0.25;
    midLevel += (mAvg - midLevel) * 0.25;
    highLevel += (hAvg - highLevel) * 0.25;
  } else {
    audioLevel *= 0.95;
    bassLevel *= 0.95;
    midLevel *= 0.95;
    highLevel *= 0.95;
  }

  if (morph < 1) morph = Math.min(1, morph + dt * 0.9);

  // Background radial glow reacts organically
  const glowScale = 1.0 + bassLevel * 0.16;
  const glowOpacity = 0.55 + audioLevel * 0.45;
  glowEl.style.transform = `scale(${glowScale})`;
  glowEl.style.opacity = glowOpacity;

  // Responsive scale fitting
  const aspect = W / H;
  let scX = 1.0, scY = 1.0;
  if (aspect < 1.0) {
    const mobileFit = 0.76;
    scX = mobileFit;
    scY = mobileFit * aspect;
  } else {
    const desktopFit = 0.88;
    scX = desktopFit / aspect;
    scY = desktopFit;
  }
  const curShapeZoom = shapeZoom || 1.0;
  scX *= curShapeZoom * userZoom;
  scY *= curShapeZoom * userZoom;

  // Set uniforms
  gl.uniform1f(U.uTime, t);
  gl.uniform1f(U.uLevel, audioLevel);
  gl.uniform1f(U.uBass, bassLevel);
  gl.uniform1f(U.uMid, midLevel);
  gl.uniform1f(U.uHigh, highLevel);
  gl.uniform1f(U.uRotX, rotX);
  gl.uniform1f(U.uRotY, rotY);
  gl.uniform1f(U.uMorph, morph);
  gl.uniform2f(U.uScale, scX, scY);
  gl.uniform1f(U.uImg, 0.0);
  gl.uniform1f(U.uChar, 0.0);
  gl.uniform1f(U.uPx, 1.4 * DPR);
  gl.uniform3f(U.uTouch, touchPos[0], touchPos[1], touchPos[2]);
  gl.uniform2f(U.uMouth, 0.0, 1.0);

  // Raw WebGL additive glow
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.POINTS, 0, N);
}

requestAnimationFrame(render);
</script>
