<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>NEXUS // Living 3D AI Hologram</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: #020308; overflow: hidden;
  font-family: system-ui, -apple-system, 'SF Pro Display', Roboto, sans-serif;
  color: #fff; user-select: none; touch-action: none;
}

#glow {
  position: fixed; left: 50%; top: 50%;
  width: 120vmin; height: 120vmin; margin: -60vmin 0 0 -60vmin;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0, 229, 255, 0.18) 0%, rgba(138, 43, 226, 0.12) 40%, rgba(0, 0, 0, 0) 70%);
  pointer-events: none; transition: transform 0.2s ease-out, opacity 0.3s ease-out;
  will-change: transform, opacity; z-index: 1;
}

canvas {
  position: fixed; inset: 0; width: 100%; height: 100%;
  display: block; cursor: grab; z-index: 2;
}
canvas:active { cursor: grabbing; }

/* Minimalist Voice Control Bar */
#voiceBar {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 12px;
  background: rgba(10, 14, 28, 0.72);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(0, 229, 255, 0.25);
  border-radius: 999px; padding: 10px 24px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 24px rgba(0, 229, 255, 0.15);
  cursor: pointer; z-index: 10;
  transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
}
#voiceBar:hover {
  background: rgba(18, 24, 48, 0.85);
  border-color: rgba(0, 240, 255, 0.6);
  transform: translateX(-50%) scale(1.03);
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7), 0 0 32px rgba(0, 240, 255, 0.3);
}
#voiceBar:active { transform: translateX(-50%) scale(0.97); }

#micIcon {
  width: 36px; height: 36px; border-radius: 50%;
  background: radial-gradient(circle, #00f0ff 0%, #0077ff 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: #fff; box-shadow: 0 0 16px rgba(0, 240, 255, 0.5);
  position: relative; transition: all 0.3s ease;
}
#voiceBar.listening #micIcon {
  background: radial-gradient(circle, #ff2d55 0%, #ff5e3a 100%);
  box-shadow: 0 0 24px rgba(255, 45, 85, 0.8);
  animation: pulseMic 1.2s infinite;
}
#voiceBar.speaking #micIcon {
  background: radial-gradient(circle, #00ff88 0%, #00aa55 100%);
  box-shadow: 0 0 24px rgba(0, 255, 136, 0.8);
  animation: pulseMic 1.0s infinite;
}

@keyframes pulseMic {
  0% { transform: scale(1); box-shadow: 0 0 16px rgba(255, 45, 85, 0.5); }
  50% { transform: scale(1.15); box-shadow: 0 0 28px rgba(255, 45, 85, 0.9); }
  100% { transform: scale(1); box-shadow: 0 0 16px rgba(255, 45, 85, 0.5); }
}

#statusText {
  font-size: 14px; font-weight: 500; letter-spacing: 0.5px;
  color: #e2f1ff; white-space: nowrap;
}

/* Subtle Transcription Toast */
#toast {
  position: fixed; top: 32px; left: 50%; transform: translateX(-50%);
  max-width: min(90vw, 480px); padding: 10px 20px;
  background: rgba(8, 12, 24, 0.78);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 999px; font-size: 13px; font-weight: 500;
  color: #a8d5ff; text-align: center; pointer-events: none;
  opacity: 0; transition: opacity 0.4s ease, transform 0.4s ease;
  z-index: 10; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }

/* Settings gear */
#settingsBtn {
  position: fixed; top: 18px; right: 18px; width: 36px; height: 36px;
  border-radius: 50%; background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.15);
  display: flex; align-items: center; justify-content: center;
  color: #9ab4d6; font-size: 16px; cursor: pointer; z-index: 15;
  transition: all 0.2s;
}
#settingsBtn:hover { background: rgba(255, 255, 255, 0.16); color: #00f0ff; }

/* Settings Modal */
#modal {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: none; align-items: center; justify-content: center; z-index: 30;
}
#modal.open { display: flex; }
#modalCard {
  width: min(90vw, 420px); background: #0c111e;
  border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 20px;
  padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.8);
}
#modalCard h3 { margin: 0 0 16px; font-size: 18px; color: #00f0ff; }
.inputGroup { margin-bottom: 16px; }
.inputGroup label { display: block; font-size: 12px; color: #8fa5c4; margin-bottom: 6px; }
.inputGroup input {
  width: 100%; background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px;
  padding: 10px 14px; color: #fff; font-size: 13px; outline: none;
}
.inputGroup input:focus { border-color: #00f0ff; }
.modalBtns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
.modalBtns button {
  padding: 9px 18px; border-radius: 10px; font-size: 13px; font-weight: 500;
  cursor: pointer; border: none;
}
#saveBtn { background: #00f0ff; color: #020308; }
#closeBtn { background: rgba(255, 255, 255, 0.1); color: #fff; }
</style>
</head>
<body>
<div id="glow"></div>
<canvas id="c"></canvas>

<div id="toast">✨ Living 3D Hologram AI Active</div>

<div id="voiceBar">
  <div id="micIcon">🎙️</div>
  <span id="statusText">Tap to Talk</span>
</div>

<div id="settingsBtn" title="AI Settings">⚙️</div>

<div id="modal">
  <div id="modalCard">
    <h3>⚙️ AI & Voice Settings</h3>
    <div class="inputGroup">
      <label>Deepgram API Key (TTS Voice):</label>
      <input id="deepgramKeyInput" type="password" placeholder="Deepgram Key">
    </div>
    <div class="inputGroup">
      <label>Groq / OpenRouter API Key (Optional LLM Brain):</label>
      <input id="llmKeyInput" type="password" placeholder="gsk_... or sk-or-...">
    </div>
    <div class="modalBtns">
      <button id="closeBtn" type="button">Cancel</button>
      <button id="saveBtn" type="button">Save Settings</button>
    </div>
  </div>
</div>

<script>
// ================= CONSTANTS & CONFIG =================
const DEEPGRAM_TOKEN_DEFAULT = 'a02c970507d8f909f3bc0478573b3b6ac240bfc5';
let DEEPGRAM_KEY = localStorage.getItem('deepgram_key') || DEEPGRAM_TOKEN_DEFAULT;
let LLM_KEY = localStorage.getItem('llm_key') || '';

const N = 90000;
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', { antialias: false, alpha: false, preserveDrawingBuffer: false });
const glowEl = document.getElementById('glow');
const voiceBar = document.getElementById('voiceBar');
const statusText = document.getElementById('statusText');
const toastEl = document.getElementById('toast');
const settingsBtn = document.getElementById('settingsBtn');
const modal = document.getElementById('modal');
const deepgramKeyInput = document.getElementById('deepgramKeyInput');
const llmKeyInput = document.getElementById('llmKeyInput');
const saveBtn = document.getElementById('saveBtn');
const closeBtn = document.getElementById('closeBtn');

deepgramKeyInput.value = DEEPGRAM_KEY;
llmKeyInput.value = LLM_KEY;

settingsBtn.onclick = () => modal.classList.add('open');
closeBtn.onclick = () => modal.classList.remove('open');
saveBtn.onclick = () => {
  DEEPGRAM_KEY = deepgramKeyInput.value.trim() || DEEPGRAM_TOKEN_DEFAULT;
  LLM_KEY = llmKeyInput.value.trim();
  localStorage.setItem('deepgram_key', DEEPGRAM_KEY);
  localStorage.setItem('llm_key', LLM_KEY);
  modal.classList.remove('open');
  showToast('Settings Saved!');
};

function showToast(text, duration = 3000){
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastEl._timer);
  toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), duration);
}

// ================= VIEWPORT RESIZE =================
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W = 1, H = 1;
function resize(){
  W = cv.width = Math.floor(innerWidth * DPR);
  H = cv.height = Math.floor(innerHeight * DPR);
  gl.viewport(0, 0, W, H);
}
addEventListener('resize', resize);

// ================= GL SHADERS =================
const VS = `
precision highp float;
attribute vec3 aFrom;
attribute vec3 aTo;
attribute float aSeed;
attribute vec4 aCol;
uniform float uTime, uLevel, uBass, uMid, uHigh, uRotY, uRotX, uDPR, uMorph;
uniform vec2 uScale;
uniform vec3 uTouch;
varying vec3 vColor;
varying float vA;

void main(){
  float m = clamp((uMorph - aSeed * 0.35) / 0.65, 0.0, 1.0);
  m = m * m * (3.0 - 2.0 * m); // cubic smoothstep
  vec3 pos = mix(aFrom, aTo, m);

  // Audio frequency dynamic displacement
  float bassPulse = sin(uTime * 3.0 + aSeed * 12.0) * uBass * 0.12;
  float midFlutter = cos(uTime * 5.0 + aSeed * 24.0) * uMid * 0.08;
  pos += normalize(pos + vec3(0.001)) * (bassPulse + midFlutter);

  // Interactive touch ripple
  vec2 dv = pos.xy - uTouch.xy;
  float dd = dot(dv, dv);
  float ripple = exp(-dd * 20.0) * uTouch.z * 0.15;
  pos.z += sin(dd * 40.0 - uTime * 6.0) * ripple;

  // 3D Camera Rotation
  float cy = cos(uRotY), sy = sin(uRotY);
  float cx = cos(uRotX), sx = sin(uRotX);
  vec3 r1 = vec3(pos.x * cy + pos.z * sy, pos.y, -pos.x * sy + pos.z * cy);
  vec3 r2 = vec3(r1.x, r1.y * cx - r1.z * sx, r1.y * sx + r1.z * cx);

  // Perspective Projection
  float f = 1.0 / (2.5 - r2.z * 0.7);
  gl_Position = vec4(r2.x * f * uScale.x * 2.5, r2.y * f * uScale.y * 2.5, 0.0, 1.0);

  float depth = clamp((r2.z / 1.5) * 0.5 + 0.5, 0.0, 1.0);
  gl_PointSize = (1.2 + depth * 2.4 + aSeed * 0.6) * uDPR * (1.0 + uLevel * 0.6);

  // Hologram Chromatic Palettes
  vec3 cCyan = vec3(0.05, 0.85, 1.00);
  vec3 cPurple = vec3(0.65, 0.25, 1.00);
  vec3 cMagenta = vec3(1.00, 0.20, 0.70);
  vec3 cEmerald = vec3(0.10, 1.00, 0.60);

  float tint = sin(uTime * 0.8 + aSeed * 6.28) * 0.5 + 0.5;
  vec3 baseCol = mix(cCyan, cPurple, depth);
  baseCol = mix(baseCol, cMagenta, tint * 0.4);
  baseCol = mix(baseCol, cEmerald, uHigh * 0.5);

  vColor = baseCol * (0.6 + depth * 0.5 + uLevel * 0.4);
  vA = (0.35 + depth * 0.65) * (0.8 + uLevel * 0.4);
}
`;

const FS = `
precision mediump float;
varying vec3 vColor;
varying float vA;

void main(){
  float d = length(gl_PointCoord - 0.5);
  if (d > 0.5) discard;
  float circ = 1.0 - smoothstep(0.05, 0.50, d);
  float al = circ * vA;
  gl_FragColor = vec4(vColor * al, al * 0.5);
}
`;

function sh(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);

// ================= PROCEDURAL 3D SHAPE GENERATORS =================
const R = Math.random;

function normalizeShape(a){
  const mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
  for (let i = 0; i < N; i++) for (let c = 0; c < 3; c++){
    const v = a[i * 3 + c]; if (v < mn[c]) mn[c] = v; if (v > mx[c]) mx[c] = v;
  }
  const ct = [(mn[0] + mx[0]) / 2, (mn[1] + mx[1]) / 2, (mn[2] + mx[2]) / 2];
  let m2 = 0;
  for (let i = 0; i < N; i++){
    const x = a[i * 3] -= ct[0], y = a[i * 3 + 1] -= ct[1], z = a[i * 3 + 2] -= ct[2];
    const d = x * x + y * y + z * z; if (d > m2) m2 = d;
  }
  const s = 0.85 / Math.sqrt(m2 || 1);
  for (let i = 0; i < N * 3; i++) a[i] *= s;
  return a;
}

const SHAPES = {
  // 1. Living AI Neural Orb
  orb(){
    const a = new Float32Array(N * 3), ga = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < N; i++){
      const y = 1 - (i / (N - 1)) * 2;
      const rad = Math.sqrt(Math.max(0, 1 - y * y));
      const phi = i * ga;
      // Multi-layer plasma depth
      const r = (i % 3 === 0) ? 0.45 + R() * 0.15 : (0.75 + R() * 0.1);
      a[i * 3] = Math.cos(phi) * rad * r;
      a[i * 3 + 1] = y * r;
      a[i * 3 + 2] = Math.sin(phi) * rad * r;
    }
    return normalizeShape(a);
  },

  // 2. Cyber Sports Car
  car(){
    const a = new Float32Array(N * 3);
    for (let i = 0; i < N; i++){
      let x, y, z;
      const part = R();
      if (part < 0.35){ // Chassis / Body
        x = R() * 2.2 - 1.1;
        y = -0.22 + R() * 0.22;
        z = (R() * 2 - 1) * 0.52 * (1.0 - Math.abs(x) * 0.25);
      } else if (part < 0.65){ // Cabin / Windshield
        x = R() * 1.1 - 0.45;
        const profile = Math.sin((x + 0.45) / 1.1 * Math.PI);
        y = 0.0 + profile * 0.42 * R();
        z = (R() * 2 - 1) * 0.38 * (1.0 - y * 0.6);
      } else if (part < 0.85){ // 4 Wheels
        const sideX = (i % 2 === 0) ? 0.65 : -0.65;
        const sideZ = (Math.floor(i / 2) % 2 === 0) ? 0.52 : -0.52;
        const ang = R() * 6.28, r = 0.22 * Math.sqrt(R());
        x = sideX + Math.cos(ang) * r;
        y = -0.24 + Math.sin(ang) * r;
        z = sideZ + (R() - 0.5) * 0.12;
      } else { // Spoiler & Headlights
        x = -0.98 + R() * 0.15;
        y = 0.28 + R() * 0.08;
        z = (R() * 2 - 1) * 0.48;
      }
      a[i * 3] = x; a[i * 3 + 1] = y; a[i * 3 + 2] = z;
    }
    return normalizeShape(a);
  },

  // 3. Supersonic Fighter Jet
  plane(){
    const a = new Float32Array(N * 3);
    for (let i = 0; i < N; i++){
      let x, y, z;
      const part = R();
      if (part < 0.45){ // Delta Wings
        const t = R();
        x = -0.6 + t * 1.2;
        const span = (1.0 - t) * 1.25;
        z = (R() * 2 - 1) * span;
        y = (R() - 0.5) * 0.06;
      } else if (part < 0.80){ // Sleek Fuselage
        x = R() * 2.2 - 1.0;
        const taper = Math.max(0.08, 1.0 - Math.abs(x) * 0.45);
        const ang = R() * 6.28, r = 0.16 * taper * Math.sqrt(R());
        y = Math.cos(ang) * r;
        z = Math.sin(ang) * r * 0.7;
      } else { // Twin Vertical Tail Fins
        x = -0.7 - R() * 0.3;
        y = R() * 0.45;
        z = ((R() < 0.5 ? 0.28 : -0.28) + (R() - 0.5) * 0.06);
      }
      a[i * 3] = x; a[i * 3 + 1] = y; a[i * 3 + 2] = z;
    }
    return normalizeShape(a);
  },

  // 4. Space Exploration Rocket
  rocket(){
    const a = new Float32Array(N * 3);
    for (let i = 0; i < N; i++){
      let x, y, z;
      const part = R();
      if (part < 0.60){ // Rocket Body & Nosecone
        y = R() * 2.0 - 0.8;
        let r = 0.24;
        if (y > 0.4) r *= Math.max(0, 1.0 - (y - 0.4) / 0.8); // Conical nose
        const ang = R() * 6.28, rad = r * Math.sqrt(R());
        x = Math.cos(ang) * rad;
        z = Math.sin(ang) * rad;
      } else if (part < 0.82){ // 4 Aerodynamic Fins
        const finIdx = Math.floor(R() * 4);
        const finAngle = finIdx * (Math.PI / 2);
        const h = R() * 0.55;
        y = -0.8 + h;
        const d = 0.22 + (0.55 - h) * 0.45 * R();
        x = Math.cos(finAngle) * d;
        z = Math.sin(finAngle) * d;
      } else { // Fiery Thruster Exhaust
        y = -0.8 - R() * 0.7;
        const spread = (Math.abs(y) - 0.8) * 0.45;
        const ang = R() * 6.28, rad = spread * Math.sqrt(R());
        x = Math.cos(ang) * rad;
        z = Math.sin(ang) * rad;
      }
      a[i * 3] = x; a[i * 3 + 1] = y; a[i * 3 + 2] = z;
    }
    return normalizeShape(a);
  },

  // 5. 3D Cardioid Pulsating Heart
  heart(){
    const a = new Float32Array(N * 3);
    for (let i = 0; i < N; i++){
      const t = R() * Math.PI * 2;
      const u = (R() - 0.5) * 2;
      const r = Math.cbrt(R());
      const x = 16 * Math.pow(Math.sin(t), 3) * r;
      const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * r;
      const z = u * Math.sqrt(Math.max(0, 1 - (x*x + y*y)/256)) * 8 * r;
      a[i * 3] = x * 0.055;
      a[i * 3 + 1] = y * 0.055;
      a[i * 3 + 2] = z * 0.055;
    }
    return normalizeShape(a);
  },

  // 6. 3D Double Helix DNA
  dna(){
    const a = new Float32Array(N * 3);
    for (let i = 0; i < N; i++){
      const t = (i / N) * 24.0;
      const y = (i / N) * 2.0 - 1.0;
      let x, z;
      if (i % 6 === 0){ // Base-pair rungs
        const rungT = (R() * 2 - 1);
        const ang = t;
        x = Math.cos(ang) * 0.42 * rungT;
        z = Math.sin(ang) * 0.42 * rungT;
      } else { // Outer strands
        const strand = (i % 2 === 0) ? 0 : Math.PI;
        const ang = t + strand;
        x = Math.cos(ang) * 0.44 + (R() - 0.5) * 0.08;
        z = Math.sin(ang) * 0.44 + (R() - 0.5) * 0.08;
      }
      a[i * 3] = x; a[i * 3 + 1] = y; a[i * 3 + 2] = z;
    }
    return normalizeShape(a);
  },

  // 7. Cosmic Spiral Galaxy
  galaxy(){
    const a = new Float32Array(N * 3);
    for (let i = 0; i < N; i++){
      const arm = Math.floor(R() * 4);
      const armAngle = arm * (Math.PI / 2);
      const dist = Math.pow(R(), 0.7) * 1.2;
      const theta = armAngle + dist * 3.2 + (R() - 0.5) * 0.35;
      const x = Math.cos(theta) * dist;
      const z = Math.sin(theta) * dist;
      const y = (R() - 0.5) * (0.35 * Math.exp(-dist * 2.5) + 0.04);
      a[i * 3] = x; a[i * 3 + 1] = y; a[i * 3 + 2] = z;
    }
    return normalizeShape(a);
  },

  // 8. 3D Stellated Star
  star(){
    const a = new Float32Array(N * 3);
    for (let i = 0; i < N; i++){
      const theta = R() * Math.PI * 2;
      const phi = (R() - 0.5) * Math.PI;
      // 5-point harmonic modulation
      const mod = 0.4 + 0.6 * Math.pow(Math.abs(Math.sin(theta * 2.5) * Math.cos(phi * 2.5)), 3.0);
      const r = mod * Math.cbrt(R()) * 1.1;
      a[i * 3] = r * Math.cos(phi) * Math.cos(theta);
      a[i * 3 + 1] = r * Math.sin(phi);
      a[i * 3 + 2] = r * Math.cos(phi) * Math.sin(theta);
    }
    return normalizeShape(a);
  },

  // 9. Torus / Donut
  donut(){
    const a = new Float32Array(N * 3);
    const R_maj = 0.65, r_min = 0.28;
    for (let i = 0; i < N; i++){
      const u = R() * Math.PI * 2, v = R() * Math.PI * 2;
      const rad = r_min * Math.sqrt(R());
      a[i * 3] = (R_maj + rad * Math.cos(v)) * Math.cos(u);
      a[i * 3 + 1] = rad * Math.sin(v);
      a[i * 3 + 2] = (R_maj + rad * Math.cos(v)) * Math.sin(u);
    }
    return normalizeShape(a);
  },

  // 10. Hypercube / Tesseract
  cube(){
    const a = new Float32Array(N * 3);
    for (let i = 0; i < N; i++){
      const edge = Math.floor(R() * 12);
      const t = R() * 2 - 1;
      const s = 0.7;
      let x = 0, y = 0, z = 0;
      const v = [[-s,-s],[-s,s],[s,-s],[s,s]];
      if (edge < 4){ x = t * s; y = v[edge][0]; z = v[edge][1]; }
      else if (edge < 8){ y = t * s; x = v[edge-4][0]; z = v[edge-4][1]; }
      else { z = t * s; x = v[edge-8][0]; y = v[edge-8][1]; }
      if (i % 4 === 0) { x *= 0.5; y *= 0.5; z *= 0.5; } // Inner core
      a[i * 3] = x + (R() - 0.5) * 0.05;
      a[i * 3 + 1] = y + (R() - 0.5) * 0.05;
      a[i * 3 + 2] = z + (R() - 0.5) * 0.05;
    }
    return normalizeShape(a);
  },

  // 11. Stargate Quantum Portal
  portal(){
    const a = new Float32Array(N * 3);
    for (let i = 0; i < N; i++){
      const isRing = R() < 0.65;
      const ang = R() * Math.PI * 2;
      let r, z;
      if (isRing){
        r = 0.78 + (R() - 0.5) * 0.12;
        z = (R() - 0.5) * 0.18;
      } else { // Inward event horizon vortex
        r = Math.pow(R(), 0.5) * 0.76;
        z = (R() - 0.5) * 0.45 * (1.0 - r / 0.76);
      }
      a[i * 3] = Math.cos(ang) * r;
      a[i * 3 + 1] = Math.sin(ang) * r;
      a[i * 3 + 2] = z;
    }
    return normalizeShape(a);
  },

  // 12. Sacred Lotus Flower
  flower(){
    const a = new Float32Array(N * 3);
    for (let i = 0; i < N; i++){
      const theta = R() * Math.PI * 2;
      const petal = Math.abs(Math.sin(theta * 3.5));
      const rad = (0.2 + petal * 0.65) * Math.sqrt(R());
      const x = Math.cos(theta) * rad;
      const z = Math.sin(theta) * rad;
      const y = Math.pow(rad, 1.4) * 0.5 - 0.25;
      a[i * 3] = x; a[i * 3 + 1] = y; a[i * 3 + 2] = z;
    }
    return normalizeShape(a);
  },

  // 13. Sacred Tree of Life
  tree(){
    const a = new Float32Array(N * 3);
    for (let i = 0; i < N; i++){
      let x, y, z;
      if (R() < 0.35){ // Trunk & Roots
        y = R() * 0.9 - 0.8;
        const r = 0.14 * (1.0 - y * 0.5) * Math.sqrt(R());
        const ang = R() * 6.28;
        x = Math.cos(ang) * r;
        z = Math.sin(ang) * r;
      } else { // Foliage Canopy Cloud
        const u = R() * 6.28, v = (R() - 0.5) * 3.14;
        const rad = 0.55 * Math.cbrt(R());
        x = Math.cos(v) * Math.cos(u) * rad * 1.2;
        y = 0.25 + Math.sin(v) * rad * 0.8;
        z = Math.cos(v) * Math.sin(u) * rad * 1.2;
      }
      a[i * 3] = x; a[i * 3 + 1] = y; a[i * 3 + 2] = z;
    }
    return normalizeShape(a);
  },

  // 14. Pyramid
  pyramid(){
    const a = new Float32Array(N * 3);
    for (let i = 0; i < N; i++){
      const h = R(); // 0 (base) to 1 (apex)
      const y = h * 1.4 - 0.7;
      const w = (1.0 - h) * 0.8;
      const side = Math.floor(R() * 4);
      let x, z;
      const t = (R() * 2 - 1) * w;
      if (side === 0){ x = t; z = w; }
      else if (side === 1){ x = t; z = -w; }
      else if (side === 2){ x = w; z = t; }
      else { x = -w; z = t; }
      a[i * 3] = x + (R() - 0.5) * 0.04;
      a[i * 3 + 1] = y;
      a[i * 3 + 2] = z + (R() - 0.5) * 0.04;
    }
    return normalizeShape(a);
  }
};

// ================= DYNAMIC 3D TEXT / EMOJI RASTERIZER =================
function genText(str){
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 512, 256);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const fontSize = str.length <= 4 ? 120 : (str.length <= 8 ? 84 : 54);
  ctx.font = `bold ${fontSize}px system-ui, sans-serif`;
  ctx.fillText(str, 256, 128);
  const data = ctx.getImageData(0, 0, 512, 256).data;
  const valid = [];
  for (let y = 0; y < 256; y += 2){
    for (let x = 0; x < 512; x += 2){
      const idx = (y * 512 + x) * 4;
      if (data[idx] > 40) valid.push((x / 512 - 0.5) * 2.2, -(y / 256 - 0.5) * 1.1);
    }
  }
  const a = new Float32Array(N * 3);
  const nVal = valid.length / 2;
  for (let i = 0; i < N; i++){
    if (nVal > 0){
      const vi = (i % nVal) * 2;
      a[i * 3] = valid[vi] + (R() - 0.5) * 0.02;
      a[i * 3 + 1] = valid[vi + 1] + (R() - 0.5) * 0.02;
      a[i * 3 + 2] = (R() - 0.5) * 0.18;
    } else {
      a[i * 3] = (R() - 0.5) * 1.5;
      a[i * 3 + 1] = (R() - 0.5) * 1.5;
      a[i * 3 + 2] = (R() - 0.5) * 1.5;
    }
  }
  return normalizeShape(a);
}

// ================= GL BUFFERS & STATE =================
const seeds = new Float32Array(N);
for (let i = 0; i < N; i++) seeds[i] = R();

const curFrom = new Float32Array(N * 3);
const curTo = new Float32Array(N * 3);
curFrom.set(SHAPES.orb());
curTo.set(curFrom);

function mkBuf(name, size, data){
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
  const loc = gl.getAttribLocation(prog, name);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
  return b;
}

const bFrom = mkBuf('aFrom', 3, curFrom);
const bTo = mkBuf('aTo', 3, curTo);
mkBuf('aSeed', 1, seeds);

const U = {};
['uTime','uLevel','uBass','uMid','uHigh','uRotY','uRotX','uDPR','uMorph','uScale','uTouch'].forEach(n => U[n] = gl.getUniformLocation(prog, n));
gl.uniform1f(U.uDPR, DPR);

gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE, gl.ONE);
gl.clearColor(0.008, 0.012, 0.03, 1.0);
resize();

let morph = 1.0;
let currentShape = 'orb';

function morphTo(shapeKey, textQuery = ''){
  let targetArr;
  if (shapeKey && SHAPES[shapeKey]){
    targetArr = SHAPES[shapeKey]();
    currentShape = shapeKey;
  } else if (textQuery) {
    targetArr = genText(textQuery);
    currentShape = 'text';
  } else {
    targetArr = SHAPES.orb();
    currentShape = 'orb';
  }
  for (let i = 0; i < N * 3; i++){
    curFrom[i] = curFrom[i] * (1 - morph) + curTo[i] * morph;
  }
  curTo.set(targetArr);
  morph = 0.0;
  gl.bindBuffer(gl.ARRAY_BUFFER, bFrom); gl.bufferData(gl.ARRAY_BUFFER, curFrom, gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, bTo);   gl.bufferData(gl.ARRAY_BUFFER, curTo, gl.DYNAMIC_DRAW);
}

// ================= AUDIO CONTEXT & DEEPGRAM TTS =================
let audioCtx = null;
let analyser = null;
let audioDataArr = null;
let currentAudio = null;

function initAudio(){
  if (!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.82;
    audioDataArr = new Uint8Array(analyser.frequencyBinCount);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

async function speakDeepgram(text){
  if (!text) return;
  initAudio();
  voiceBar.className = 'speaking';
  statusText.textContent = 'Speaking...';
  showToast(text);

  try {
    const res = await fetch('https://api.deepgram.com/v2/speak?model=flux-prachi-hi&expressivity=1', {
      method: 'POST',
      headers: {
        'Authorization': 'Token ' + DEEPGRAM_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ text })
    });
    if (!res.ok) throw new Error('Deepgram HTTP ' + res.status);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    currentAudio = new Audio(url);
    const srcNode = audioCtx.createMediaElementSource(currentAudio);
    srcNode.connect(analyser);
    analyser.connect(audioCtx.destination);

    currentAudio.onended = () => {
      voiceBar.className = '';
      statusText.textContent = 'Tap to Talk';
    };
    await currentAudio.play();
  } catch(err) {
    console.warn('Deepgram TTS Error, falling back to browser synthesis:', err);
    fallbackBrowserSpeech(text);
  }
}

function fallbackBrowserSpeech(text){
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'hi-IN';
  u.rate = 1.05;
  u.onstart = () => { voiceBar.className = 'speaking'; statusText.textContent = 'Speaking...'; };
  u.onend = () => { voiceBar.className = ''; statusText.textContent = 'Tap to Talk'; };
  window.speechSynthesis.speak(u);
}

// ================= AI INTENT & SHAPE EXTRACTOR =================
const SHAPE_KEYWORDS = {
  car: ['car', 'gaadi', 'gadi', 'speed', 'ferrari', 'lamborghini', 'sports car', 'drive'],
  plane: ['plane', 'airplane', 'aeroplane', 'jahaz', 'jet', 'fighter', 'fly', 'flight'],
  rocket: ['rocket', 'space', 'missile', 'nasa', 'launch', 'chandrayaan', 'apollo', 'mars'],
  heart: ['heart', 'dil', 'love', 'pyar', 'pyaar', 'mohabbat', 'romantic', 'valentine'],
  dna: ['dna', 'helix', 'gene', 'biology', 'life', 'science', 'genetic'],
  galaxy: ['galaxy', 'space', 'stars', 'universe', 'milky way', 'brahmand', 'cosmic', 'nebula'],
  star: ['star', 'sitara', 'taara', 'tara', 'supernova', 'twinkle'],
  donut: ['donut', 'torus', 'ring', 'doughnut'],
  cube: ['cube', 'box', 'tesseract', 'square'],
  portal: ['portal', 'stargate', 'wormhole', 'gate'],
  flower: ['flower', 'phool', 'lotus', 'petal', 'gulab', 'rose'],
  tree: ['tree', 'ped', 'tree of life', 'nature', 'wood'],
  pyramid: ['pyramid', 'egypt', 'pharaoh', 'triangle'],
  orb: ['orb', 'sphere', 'core', 'ai', 'normal', 'default', 'reset']
};

function extractShapeAndIntent(prompt){
  const lower = prompt.toLowerCase();
  for (const [shape, words] of Object.entries(SHAPE_KEYWORDS)){
    for (const w of words){
      if (lower.includes(w)) return shape;
    }
  }
  return null;
}

async function processUserPrompt(prompt){
  if (!prompt || !prompt.trim()) return;
  const p = prompt.trim();
  voiceBar.className = 'thinking';
  statusText.textContent = 'Thinking...';
  showToast(`"${p}"`);

  // Detect shape intent
  const detectedShape = extractShapeAndIntent(p);
  if (detectedShape){
    morphTo(detectedShape);
  }

  // If user configured an LLM Key (Groq or OpenRouter)
  if (LLM_KEY){
    try {
      const isGroq = LLM_KEY.startsWith('gsk_');
      const ep = isGroq ? 'https://api.groq.com/openai/v1/chat/completions' : 'https://openrouter.ai/api/v1/chat/completions';
      const model = isGroq ? 'llama-3.1-8b-instant' : 'meta-llama/llama-3.1-8b-instruct:free';
      const res = await fetch(ep, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${LLM_KEY}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model,
          messages: [
            {
              role: 'system',
              content: 'You are NEXUS, an intelligent living 3D Hologram AI. Answer in expressive, friendly Hindi/Hinglish in 1-2 concise sentences. If the user asks to form a shape, acknowledge it.'
            },
            { role: 'user', content: p }
          ],
          max_tokens: 150
        })
      });
      if (res.ok){
        const json = await res.json();
        const reply = json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content;
        if (reply){
          speakDeepgram(reply);
          return;
        }
      }
    } catch(e) {
      console.warn('Cloud LLM failed, using built-in conversational AI:', e);
    }
  }

  // Fast Built-in Conversational AI Brain (Zero latency, warm conversational Hindi)
  const lower = p.toLowerCase();
  let reply = '';

  if (detectedShape === 'car'){
    reply = 'ये देखिए, आपके लिए एक सुपर-फास्ट स्पोर्ट्स कार का थ्री-डी होलोग्राम!';
  } else if (detectedShape === 'plane'){
    reply = 'सुपरसोनिक फाइटर जेट तैयार है, हवा से बातें करने के लिए!';
  } else if (detectedShape === 'rocket'){
    reply = 'रॉकेट लॉन्च के लिए तैयार है, अंतरिक्ष की यात्रा पर!';
  } else if (detectedShape === 'heart'){
    reply = 'आपके लिए यह धड़कता हुआ थ्री-डी दिल हाज़िर है!';
  } else if (detectedShape === 'dna'){
    reply = 'यह है जीवन का रहस्य, घूमता हुआ डीएनए डबल हेलिक्स!';
  } else if (detectedShape === 'galaxy'){
    reply = 'ब्रह्मांड की एक खूबसूरत स्पाइरल गैलेक्सी आपके सामने है!';
  } else if (detectedShape === 'star'){
    reply = 'चमकता हुआ तारा, आपके आसमान का सितारा!';
  } else if (detectedShape === 'flower'){
    reply = 'खूबसूरत खिलता हुआ कमल का फूल आपके लिए!';
  } else if (detectedShape === 'portal'){
    reply = 'क्वांटम पोर्टल एक्टिवेट हो चुका है!';
  } else if (detectedShape === 'tree'){
    reply = 'प्रकृति का पवित्र ट्री ऑफ लाइफ आपके सामने है।';
  } else if (detectedShape === 'pyramid'){
    reply = 'गीज़ा का रहस्यमयी थ्री-डी पिरामिड तैयार है।';
  } else if (lower.includes('kaise ho') || lower.includes('kaisa hai') || lower.includes('how are you')){
    reply = 'मैं बहुत बढ़िया हूँ! आप बताइए, आज मैं आपके लिए कौन सा रूप या होलोग्राम बनाऊँ?';
  } else if (lower.includes('naam') || lower.includes('who are you') || lower.includes('kaun ho')){
    reply = 'मेरा नाम नेक्सस है, मैं आपकी थ्री-डी लिविंग होलोग्राम एआई हूँ।';
  } else if (lower.includes('namaste') || lower.includes('hello') || lower.includes('hi') || lower.includes('hey')){
    reply = 'नमस्ते! कहिए, आज आप होलोग्राम में क्या देखना चाहते हैं?';
  } else {
    // Morph into 3D text of the keyword or orb
    morphTo(null, p);
    reply = `मैंने आपकी बात समझ ली है। यह देखिए!`;
  }

  speakDeepgram(reply);
}

// ================= SPEECH RECOGNITION (LISTENING) =================
let recognition = null;
let isListening = false;

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRec();
  recognition.lang = 'hi-IN';
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.onstart = () => {
    isListening = true;
    voiceBar.className = 'listening';
    statusText.textContent = 'Listening...';
    showToast('🎙️ Boliyee, main sun rahi hoon...');
  };

  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript;
    processUserPrompt(text);
  };

  recognition.onerror = (e) => {
    console.warn('Speech Rec error:', e);
    isListening = false;
    voiceBar.className = '';
    statusText.textContent = 'Tap to Talk';
    showToast('Mic permission allow karein');
  };

  recognition.onend = () => {

    }

}

voiceBar.onclick = () => {
  initAudio();
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (window.speechSynthesis) window.speechSynthesis.cancel();

  if (recognition){
    try {
      if (isListening) recognition.stop();
      else recognition.start();
    } catch(e) {
      recognition.stop();
      setTimeout(() => recognition.start(), 200);
    }
  } else {
    const promptText = prompt('Apna command ya sawal likhein:');

  }
};

// ================= 3D TOUCH & DRAG INTERACTION =================
let rotX = 0.2, rotY = 0.0;
let targetRotX = 0.2, targetRotY = 0.0;
let isDragging = false;
let lastMouseX = 0, lastMouseY = 0;
let touchPos = [0, 0, 0];
let userZoom = 1.0;

window.addEventListener('pointerdown', e => {
  if (e.target.closest('#voiceBar') || e.target.closest('#settingsBtn') || e.target.closest('#modal')) return;
  isDragging = true;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  const nx = (e.clientX / innerWidth) * 2 - 1;
  const ny = -(e.clientY / innerHeight) * 2 + 1;
  touchPos = [nx, ny, 1.0];
});

window.addEventListener('pointermove', e => {
  const nx = (e.clientX / innerWidth) * 2 - 1;
  const ny = -(e.clientY / innerHeight) * 2 + 1;
  if (isDragging){
    const dx = e.clientX - lastMouseX;
    const dy = e.clientY - lastMouseY;
    targetRotY += dx * 0.006;
    targetRotX += dy * 0.006;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    touchPos = [nx, ny, 1.0];
  } else {
    touchPos[0] = nx;
    touchPos[1] = ny;
    touchPos[2] = Math.max(0.0, touchPos[2] - 0.03);
  }
});

window.addEventListener('pointerup', () => { isDragging = false; });
window.addEventListener('pointercancel', () => { isDragging = false; });

// Multi-touch pinch zoom
let initialPinch = null, initialZoom = 1.0;
window.addEventListener('touchstart', e => {
  if (e.touches && e.touches.length === 2){
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    initialPinch = Math.hypot(dx, dy);
    initialZoom = userZoom;
  }
}, { passive: true });

window.addEventListener('touchmove', e => {
  if (e.touches && e.touches.length === 2 && initialPinch){
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    userZoom = Math.min(2.5, Math.max(0.4, initialZoom * (dist / initialPinch)));
  }
}, { passive: true });

window.addEventListener('wheel', e => {
  e.preventDefault();
  userZoom = Math.min(2.5, Math.max(0.4, userZoom + (e.deltaY < 0 ? 0.08 : -0.08)));
}, { passive: false });

// ================= RENDER LOOP =================
let lastT = performance.now();
let audioLevel = 0, bassLevel = 0, midLevel = 0, highLevel = 0;

function render(now){
  requestAnimationFrame(render);
  const dt = Math.min((now - lastT) * 0.001, 0.1);
  lastT = now;
  const t = now * 0.001;

  rotX += (targetRotX - rotX) * 0.08;
  rotY += (targetRotY - rotY) * 0.08;
  if (!isDragging) targetRotY += 0.003; // Gentle celestial rotation

  if (morph < 1.0) morph = Math.min(1.0, morph + dt * 0.85);

  // Audio frequency sampling
  if (analyser && audioDataArr){
    analyser.getByteFrequencyData(audioDataArr);
    let bSum = 0, mSum = 0, hSum = 0, tot = 0;
    const n = audioDataArr.length;
    for (let i = 0; i < n; i++){
      const v = audioDataArr[i] / 255.0;
      tot += v;
      if (i < n * 0.15) bSum += v;
      else if (i < n * 0.55) mSum += v;
      else hSum += v;
    }
    const bAvg = bSum / (n * 0.15);
    const mAvg = mSum / (n * 0.40);
    const hAvg = hSum / (n * 0.45);
    const avg = tot / n;

    audioLevel += (avg - audioLevel) * 0.25;
    bassLevel += (bAvg - bassLevel) * 0.25;
    midLevel += (mAvg - midLevel) * 0.25;
    highLevel += (hAvg - highLevel) * 0.25;
  } else {
    audioLevel *= 0.95;
    bassLevel *= 0.95;
    midLevel *= 0.95;
    highLevel *= 0.95;
  }

  // Glow reactivity
  const glowScale = 1.0 + bassLevel * 0.35;
  const glowOpacity = 0.45 + audioLevel * 0.55;
  glowEl.style.transform = `scale(${glowScale})`;
  glowEl.style.opacity = glowOpacity;

  // Viewport aspect scale
  const aspect = W / H;
  let scX = 1.0, scY = 1.0;
  if (aspect < 1.0){
    scX = 0.85;
    scY = 0.85 * aspect;
  } else {
    scX = 0.85 / aspect;
    scY = 0.85;
  }
  scX *= userZoom;
  scY *= userZoom;

  gl.uniform1f(U.uTime, t);
  gl.uniform1f(U.uLevel, audioLevel);
  gl.uniform1f(U.uBass, bassLevel);
  gl.uniform1f(U.uMid, midLevel);
  gl.uniform1f(U.uHigh, highLevel);
  gl.uniform1f(U.uRotX, rotX);
  gl.uniform1f(U.uRotY, rotY);
  gl.uniform1f(U.uMorph, morph);
  gl.uniform2f(U.uScale, scX, scY);
  gl.uniform3f(U.uTouch, touchPos[0], touchPos[1], touchPos[2]);

  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.POINTS, 0, N);
}

requestAnimationFrame(render);

// Initial greeting
setTimeout(() => {
  speakDeepgram('नमस्ते! मैं आपकी थ्री-डी होलोग्राम एआई हूँ। आप जो भी बोलेंगे, मैं वह रूप ले लूँगी!');
}, 800);
