<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
<title>Raj Nandini AI</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: #03040a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  #glow {
    position: fixed;
    left: 50%;
    top: 46%;
    width: 88vmin;
    height: 88vmin;
    margin: -44vmin 0 0 -44vmin;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(70,150,255,.38) 0%, rgba(120,70,255,.15) 40%, rgba(0,0,0,0) 68%);
    pointer-events: none;
    will-change: transform, opacity;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: pointer;
    outline: none;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  /* ================= LOGIN & AUTH GATE ================= */
  .login-overlay {
    position: fixed;
    inset: 0;
    z-index: 99990;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 25%, #0f1422 0%, #06080d 65%, #020305 100%);
    padding: 24px 16px;
    opacity: 1;
    visibility: visible;
    transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s;
  }
  .login-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: scale(0.98);
  }

  .login-card {
    width: 100%;
    max-width: 410px;
    background: rgba(15, 18, 28, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px;
    padding: 38px 32px 32px;
    box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85), 0 0 1px 1px rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .login-header {
    text-align: center;
  }
  .brand-emblem {
    width: 48px;
    height: 48px;
    margin: 0 auto 16px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e4e4e7;
  }
  .brand-emblem svg {
    width: 22px;
    height: 22px;
  }
  .login-title {
    margin: 0;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: #ffffff;
  }
  .login-subtitle {
    margin: 8px 0 0;
    font-size: 13px;
    color: #71717a;
    line-height: 1.45;
  }

  .login-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .login-error {
    display: none;
    align-items: center;
    gap: 8px;
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.25);
    color: #fca5a5;
    padding: 10px 14px;
    border-radius: 9px;
    font-size: 13px;
    line-height: 1.35;
    animation: shake 0.3s ease;
  }
  .login-error.visible {
    display: flex;
  }
  .error-icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    color: #ef4444;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-5px); }
    40%, 80% { transform: translateX(5px); }
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .form-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #a1a1aa;
    user-select: none;
  }
  .input-container {
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-icon {
    position: absolute;
    left: 14px;
    width: 17px;
    height: 17px;
    color: #52525b;
    pointer-events: none;
    transition: color 0.15s ease;
  }
  .form-input {
    width: 100%;
    height: 44px;
    padding: 0 42px 0 42px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.11);
    border-radius: 10px;
    color: #ffffff;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.15s ease;
    user-select: text !important;
    -webkit-user-select: text !important;
  }
  .form-input::placeholder {
    color: #52525b;
  }
  .form-input:focus {
    border-color: #3b82f6;
    background: rgba(255, 255, 255, 0.06);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.22);
    outline: none;
  }
  .form-input:focus ~ .input-icon {
    color: #93c5fd;
  }

  .pass-toggle-btn {
    position: absolute;
    right: 8px;
    background: transparent;
    border: none;
    padding: 8px;
    cursor: pointer;
    color: #71717a;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    transition: color 0.15s ease;
  }
  .pass-toggle-btn:hover {
    color: #e4e4e7;
  }
  .pass-toggle-btn svg {
    width: 17px;
    height: 17px;
  }

  .continue-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    height: 44px;
    margin-top: 6px;
    background: #ffffff;
    color: #09090b;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }
  .continue-btn:hover {
    background: #f4f4f5;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(255, 255, 255, 0.16);
  }
  .continue-btn:active {
    transform: translateY(0);
    background: #e4e4e7;
  }
  .btn-arrow {
    width: 16px;
    height: 16px;
    transition: transform 0.15s ease;
  }
  .continue-btn:hover .btn-arrow {
    transform: translateX(3px);
  }

  .login-footer {
    text-align: center;
    font-size: 11px;
    color: #52525b;
    letter-spacing: 0.03em;
    user-select: none;
  }

  /* ================= HAMBURGER MENU BUTTON ================= */
  .menu-toggle-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: rgba(15, 18, 28, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    padding: 0;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  }
  .menu-toggle-btn:hover {
    background: rgba(25, 30, 46, 0.85);
    border-color: rgba(255, 255, 255, 0.16);
    transform: scale(1.04);
  }
  .menu-toggle-btn:active {
    transform: scale(0.96);
  }
  .hamburger-line {
    width: 18px;
    height: 1.5px;
    background: #e4e4e7;
    border-radius: 2px;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* ================= SIDEBAR SLIDER DRAWER ================= */
  .sidebar-backdrop {
    position: fixed;
    inset: 0;
    z-index: 1001;
    background: rgba(2, 4, 8, 0.65);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .sidebar-backdrop.active {
    opacity: 1;
    pointer-events: auto;
  }

  .sidebar-drawer {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(320px, 82vw);
    z-index: 1002;
    background: rgba(13, 16, 25, 0.96);
    border-left: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    box-shadow: -15px 0 40px rgba(0, 0, 0, 0.85);
    display: flex;
    flex-direction: column;
    padding: 24px 20px;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .sidebar-drawer.open {
    transform: translateX(0);
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .sidebar-emblem {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e4e4e7;
  }
  .sidebar-emblem svg {
    width: 18px;
    height: 18px;
  }
  .sidebar-title-group {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .sidebar-user-name {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #fafafa;
  }
  .sidebar-status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .sidebar-status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 6px rgba(34, 197, 94, 0.8);
  }
  .sidebar-status-text {
    font-size: 11px;
    color: #a1a1aa;
    font-weight: 500;
  }
  .sidebar-close-btn {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #a1a1aa;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .sidebar-close-btn:hover {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.08);
  }
  .sidebar-close-btn svg {
    width: 16px;
    height: 16px;
  }

  .sidebar-content {
    flex: 1;
    padding: 24px 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .sidebar-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sidebar-section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #71717a;
  }
  .sidebar-info-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .info-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
  }
  .info-label {
    color: #71717a;
  }
  .info-value {
    color: #e4e4e7;
    font-weight: 500;
  }

  .sidebar-footer {
    padding-top: 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }
  .sidebar-logout-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    height: 44px;
    background: rgba(239, 68, 68, 0.09);
    border: 1px solid rgba(239, 68, 68, 0.22);
    border-radius: 10px;
    color: #f87171;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .sidebar-logout-btn:hover {
    background: rgba(239, 68, 68, 0.16);
    border-color: rgba(239, 68, 68, 0.35);
    color: #fca5a5;
    transform: translateY(-1px);
  }
  .sidebar-logout-btn:active {
    transform: translateY(0);
  }
  .sidebar-logout-btn svg {
    width: 16px;
    height: 16px;
  }

  /* ================= NEURAL LOADING OVERLAY ================= */
  .loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 100000;
    background: radial-gradient(ellipse at center, #070d18 0%, #03040a 75%, #010204 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 1;
    visibility: visible;
    transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    transform: scale(1);
    user-select: none;
    -webkit-user-select: none;
  }
  .loading-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    transform: scale(1.04);
    pointer-events: none;
  }
  .loading-reactor {
    position: relative;
    width: 170px;
    height: 170px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .reactor-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid transparent;
    pointer-events: none;
  }
  .ring-outer {
    inset: 0;
    border-top: 2px solid rgba(56, 189, 248, 0.85);
    border-bottom: 2px solid rgba(168, 85, 247, 0.6);
    animation: rotateClockwise 6s linear infinite;
    filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.45));
  }
  .ring-mid {
    inset: 16px;
    border-left: 2px dashed rgba(56, 189, 248, 0.65);
    border-right: 2px dashed rgba(168, 85, 247, 0.7);
    animation: rotateCounterClockwise 4.5s linear infinite;
  }
  .ring-inner {
    inset: 32px;
    border: 1px solid rgba(56, 189, 248, 0.3);
    border-top-color: rgba(56, 189, 248, 0.95);
    animation: rotateClockwise 3s linear infinite;
  }
  .reactor-glow {
    position: absolute;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.35) 0%, rgba(168, 85, 247, 0.18) 50%, transparent 70%);
    animation: pulseGlow 2.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes rotateClockwise {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes rotateCounterClockwise {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
  }
  @keyframes pulseGlow {
    0%, 100% { transform: scale(0.92); opacity: 0.6; }
    50% { transform: scale(1.22); opacity: 1; }
  }
  .lottie-container {
    width: 120px;
    height: 120px;
    position: relative;
    z-index: 2;
    filter: invert(0.92) hue-rotate(180deg) drop-shadow(0 0 16px rgba(56, 189, 248, 0.7));
  }
  .loading-brand {
    margin-top: 24px;
    text-align: center;
  }
  .loading-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.2em;
    background: linear-gradient(135deg, #ffffff 20%, #38bdf8 65%, #a855f7 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 24px rgba(56, 189, 248, 0.4);
  }
  .loading-subtitle {
    margin-top: 6px;
    font-size: 10px;
    letter-spacing: 0.22em;
    color: #64748b;
    font-weight: 600;
  }
  .loading-bar-wrap {
    width: 250px;
    height: 4px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 999px;
    margin-top: 22px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
  }
  .loading-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #0ea5e9, #38bdf8, #a855f7);
    border-radius: 999px;
    box-shadow: 0 0 14px rgba(56, 189, 248, 0.85);
    transition: width 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .loading-meta {
    width: 250px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
  }
  .loading-caption {
    color: #94a3b8;
    font-size: 11px;
    letter-spacing: 0.04em;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 195px;
  }
  .loading-percent {
    font-size: 11px;
    color: #38bdf8;
    font-weight: 600;
    font-family: monospace;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div id="glow"></div>
<canvas id="c"></canvas>

<!-- HAMBURGER MENU BUTTON -->
<button type="button" id="menuToggleBtn" class="menu-toggle-btn" aria-label="Open menu" style="display: none;">
  <span class="hamburger-line"></span>
  <span class="hamburger-line"></span>
  <span class="hamburger-line"></span>
</button>

<!-- SIDEBAR BACKDROP -->
<div id="sidebarBackdrop" class="sidebar-backdrop"></div>

<!-- SIDEBAR DRAWER (SLIDER) -->
<aside id="sidebarDrawer" class="sidebar-drawer" aria-label="Control Panel">
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <div class="sidebar-emblem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <div class="sidebar-title-group">
        <div class="sidebar-user-name">Raj Nandini</div>
        <div class="sidebar-status-pill">
          <span class="sidebar-status-dot"></span>
          <span class="sidebar-status-text">Online</span>
        </div>
      </div>
    </div>
    <button type="button" id="sidebarCloseBtn" class="sidebar-close-btn" aria-label="Close menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="sidebar-content">
    <div class="sidebar-section">
      <div class="sidebar-section-label">Session</div>
      <div class="sidebar-info-card">
        <div class="info-row">
          <span class="info-label">Interface</span>
          <span class="info-value">Neural Core v2</span>
        </div>
        <div class="info-row">
          <span class="info-label">Access Level</span>
          <span class="info-value">Authorized</span>
        </div>
      </div>
    </div>
  </div>

  <div class="sidebar-footer">
    <button type="button" id="sidebarLogoutBtn" class="sidebar-logout-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Sign Out</span>
    </button>
  </div>
</aside>

<!-- NEURAL LOADING OVERLAY (Active on every page boot) -->
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-reactor">
    <div class="reactor-ring ring-outer"></div>
    <div class="reactor-ring ring-mid"></div>
    <div class="reactor-ring ring-inner"></div>
    <div id="lottieContainer" class="lottie-container"></div>
    <div class="reactor-glow"></div>
  </div>
  <div class="loading-brand">
    <div class="loading-title">RAJ NANDINI</div>
    <div class="loading-subtitle">NEURAL SYSTEM v2.5 &bull; BOSS COMPANION</div>
  </div>
  <div class="loading-bar-wrap">
    <div id="loadingProgressBar" class="loading-bar-fill"></div>
  </div>
  <div class="loading-meta">
    <div id="loadingCaption" class="loading-caption">Initializing Neural Core...</div>
    <div id="loadingPercent" class="loading-percent">0%</div>
  </div>
</div>

<!-- LOGIN GATEWAY -->
<div id="loginGate" class="login-overlay hidden" style="display: none;">
  <div class="login-card">
    <div class="login-header">
      <div class="brand-emblem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <h1 class="login-title">Raj Nandini AI</h1>
      <p class="login-subtitle">Enter your credentials to access the neural interface</p>
    </div>

    <form id="loginForm" class="login-form" novalidate>
      <div id="loginError" class="login-error" role="alert">
        <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="loginErrorMsg">Invalid credentials</span>
      </div>

      <div class="form-group">
        <label for="loginId" class="form-label">User ID</label>
        <div class="input-container">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

<script>
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', {antialias:false, alpha:true, premultipliedAlpha:true});
const glowEl = document.getElementById('glow');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W = 1, H = 1;
function resize(){
  W = cv.width = Math.floor(innerWidth * DPR);
  H = cv.height = Math.floor(innerHeight * DPR);
  gl.viewport(0, 0, W, H);
}
addEventListener('resize', resize);

const VS = `
precision highp float;
attribute vec3 aFrom;
attribute vec3 aTo;
attribute float aSeed;
attribute vec4 aCol;
attribute vec2 aArm;
uniform float uTime,uLevel,uBass,uMid,uHigh,uRotY,uRotX,uDPR,uMorph,uImg,uPx;
uniform vec2 uScale;
uniform vec3 uTouch;
uniform float uChar;
uniform vec2 uMouth;
uniform vec2 uArm;
uniform vec4 uExpr;
varying vec3 vColor;
varying float vA;
varying float vImg;

vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;
  vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}

const vec2 NECK=vec2(0.0812,0.6224);
const vec2 EYE_R=vec2(0.1136,0.7567);
const vec2 EYE_L=vec2(0.0323,0.7298);
const vec2 EYE_RAD=vec2(0.0342,0.0220);
const vec2 MOUTH=vec2(0.0934,0.6884);
const vec2 MOUTH_RAD=vec2(0.0269,0.0134);
const vec2 SHO=vec2(0.2459,0.5712);
const vec2 ELB=vec2(0.2459,0.2929);
vec2 R2(vec2 v,float a){float c=cos(a),s=sin(a);return vec2(c*v.x-s*v.y,s*v.x+c*v.y);}

void main(){
  float t=uTime;
  float isFill=step(0.001,aCol.a)*(1.0-step(0.05,aCol.a));
  float k0=1.0-uImg;
  float m=clamp((uMorph-aSeed*0.45)/0.55,0.0,1.0);
  m=m*m*(3.0-2.0*m);
  vec3 pos=mix(aFrom,aTo,m);
  float mid=sin(3.14159265*m);

  float ang=mid*(1.2+aSeed*2.5);
  float ca=cos(ang),sa=sin(ang);
  pos=vec3(pos.x*ca+pos.z*sa,pos.y,-pos.x*sa+pos.z*ca);
  pos+=vec3(sin(aSeed*127.1),sin(aSeed*311.7),sin(aSeed*74.7))*0.45*mid;

  vec3 dir=normalize(pos+vec3(0.0001));
  float n=snoise(pos*1.5+vec3(0.0,t*0.15,t*0.10));
  float n2=snoise(pos*4.5+vec3(t*0.3,0.0,-t*0.2));
  float d=(n*(0.012+uLevel*0.05+uBass*0.03)+n2*(0.004+uMid*0.015+uHigh*0.008))*k0;
  pos+=dir*d;
  pos*=1.0+uBass*0.05*k0;

  // ---- character animation (built-in girl only) + touch ----
  float ck=uImg*uChar;
  vec3 mv=vec3(0.0);
  float side=smoothstep(0.08,0.30,abs(pos.x));
  float legGate=smoothstep(-0.20,-0.08,pos.y);
  float hairAmp=side*(0.3+0.7*(1.0-smoothstep(-0.1,0.55,pos.y)))*legGate;
  float w1=sin(t*1.6+pos.y*4.0+aSeed*0.6);
  float w2=sin(t*2.3+pos.y*7.0+pos.x*5.0);
  mv+=vec3(w1*0.02+w2*0.01,w2*0.006,w1*0.03)*hairAmp*(1.0+uLevel*2.0);
  mv.x+=sin(t*0.6)*0.02*(pos.y+0.93);
  mv.y+=sin(t*1.25)*0.004*smoothstep(-0.2,0.4,pos.y);
  mv.xy+=vec2(sin(aSeed*91.7+t*3.0),sin(aSeed*53.3+t*2.7))*0.0025*(0.3+uLevel*2.5+uHigh*2.0);
  float hw=smoothstep(NECK.y-0.02,NECK.y+0.07,pos.y);
  float ha=sin(t*0.7)*0.06+sin(t*0.37+1.0)*0.035+uMouth.x*0.035*sin(t*2.3)+uExpr.w*0.03*sin(t*3.1);
  float nod=sin(t*1.1)*0.005-uExpr.w*0.014+uMouth.x*0.003*sin(t*9.0);
  vec2 hp=pos.xy-NECK;
  mv.xy+=hw*(R2(hp,ha)-hp);
  mv.y+=hw*nod;
  float bt=fract(t/4.3);
  float bl=bt<0.07?sin(bt/0.07*3.14159):0.0;
  float bt2=fract(t/7.1+0.3);
  bl=max(bl,bt2<0.06?sin(bt2/0.06*3.14159):0.0);
  bl=max(bl,uExpr.z*0.4);
  vec2 p2=pos.xy+mv.xy;
  vec2 eR=NECK+R2(EYE_R-NECK,ha)+vec2(0.0,nod);
  vec2 eL=NECK+R2(EYE_L-NECK,ha)+vec2(0.0,nod);
  vec2 d1=(p2-eR)/EYE_RAD; vec2 d2=(p2-eL)/EYE_RAD;
  float m1=exp(-dot(d1,d1)*2.5); float m2=exp(-dot(d2,d2)*2.5);
  mv.y+=((eR.y+0.010-p2.y)*m1+(eL.y+0.010-p2.y)*m2)*bl*0.85;
  vec2 mC=NECK+R2(MOUTH-NECK,ha)+vec2(0.0,nod);
  vec2 mq=(p2-mC)/MOUTH_RAD;
  float mm=exp(-dot(mq,mq)*1.4);
  float gap=uMouth.x*0.022;
  float sg=smoothstep(-0.25,0.25,mq.y)*2.0-1.0;
  mv.y+=(sg>0.0?sg*0.25:sg*0.75)*gap*mm;
  mv.x+=(p2.x-mC.x)*(uMouth.y-1.0)*mm;
  {
    vec2 sq=(p2-mC)/vec2(MOUTH_RAD.x*1.9,MOUTH_RAD.y*2.6);
    float mw=exp(-dot(sq,sq)*1.3);
    float cs=smoothstep(0.15,0.9,abs(p2.x-mC.x)/MOUTH_RAD.x);
    float sm=uExpr.x>0.0?uExpr.x:uExpr.x*1.6;
    mv.y+=sm*0.011*cs*mw;
    mv.x+=(p2.x-mC.x)*uExpr.x*0.06*mw;
    vec2 bR=(p2-(eR+vec2(0.0,0.050)))/vec2(0.050,0.018);
    vec2 bL=(p2-(eL+vec2(0.0,0.050)))/vec2(0.050,0.018);
    mv.y+=uExpr.y*0.014*(exp(-dot(bR,bR))+exp(-dot(bL,bL)));
  }
  vec3 tm=vec3(0.0);
  vec2 dv=pos.xy-uTouch.xy;
  float dd=length(dv);
  float fall=exp(-dd*dd*24.0)*uTouch.z;
  tm.xy+=normalize(dv+vec2(0.0001))*fall*0.16+vec2(-dv.y,dv.x)/(dd+0.06)*fall*0.04;
  tm.z+=fall*0.12;
  pos+=mv*ck+tm*uImg;
  {
    vec2 aq=pos.xy;
    aq=ELB+R2(aq-ELB,aArm.y*uArm.y);
    aq=SHO+R2(aq-SHO,aArm.x*uArm.x);
    pos.xy=mix(pos.xy,aq,ck);
  }
  if(isFill>0.5){
    vec2 uvf=aCol.rg*2.0-1.0;
    vec2 fc=mC+vec2(0.0,-0.25*gap);
    pos=vec3(fc.x+uvf.x*MOUTH_RAD.x*0.55*uMouth.y,fc.y+uvf.y*gap*0.5,0.035);
  }
  pos*=1.0+uBass*0.02*uImg;

  float cy=cos(uRotY),sy=sin(uRotY),cx=cos(uRotX),sx=sin(uRotX);
  vec3 r1=vec3(pos.x*cy+pos.z*sy,pos.y,-pos.x*sy+pos.z*cy);
  vec3 r2=vec3(r1.x,r1.y*cx-r1.z*sx,r1.y*sx+r1.z*cx);
  float f=1.0/(2.6-r2.z*0.8);
  gl_Position=vec4(r2.x*f*uScale.x*2.6,r2.y*f*uScale.y*2.6,0.0,1.0);

  float depth=clamp((r2.z/1.6)*0.5+0.5,0.0,1.0);
  float sizeTheme=(1.1+depth*2.2+aSeed*0.7)*uDPR*(1.0+uLevel*0.5);
  gl_PointSize=mix(sizeTheme,uPx,uImg);

  float cmix=n*0.5+0.5+mid*0.4;
  vec3 c1=vec3(0.10,0.65,1.00);
  vec3 c2=vec3(0.55,0.35,1.00);
  vec3 c3=vec3(1.00,0.35,0.75);
  vec3 col=mix(c1,c2,clamp(cmix+depth*0.3-0.2,0.0,1.0));
  col=mix(col,c3,clamp(uLevel*1.2*cmix,0.0,0.7));
  vec3 themeCol=col*(0.45+depth*0.65);
  float themeA=(0.30+mid*0.14)*(0.25+depth*0.75);
  vColor=mix(themeCol,aCol.rgb,uImg);
  vA=mix(themeA,aCol.a,uImg);
  if(isFill>0.5){
    vec2 uvc=aCol.rg*2.0-1.0;
    float teeth=smoothstep(0.35,0.7,uvc.y);
    vec3 inner=mix(vec3(0.30,0.04,0.08),vec3(0.78,0.26,0.32),smoothstep(0.0,0.9,-uvc.y));
    vColor=mix(inner,vec3(0.96,0.93,0.90),teeth*0.9);
    vA=uImg*uChar*smoothstep(0.06,0.25,uMouth.x);
  }
  vImg=uImg;
}`;

const FS = `
precision mediump float;
varying vec3 vColor;
varying float vA;
varying float vImg;
void main(){
  float circ=1.0-smoothstep(0.05,0.5,length(gl_PointCoord-0.5));
  float s=mix(circ,1.0,vImg);
  float al=s*vA;
  gl_FragColor=vec4(vColor*al,al*mix(0.5,1.0,vImg));
}`;

function sh(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);

// ================= SHAPES =================
const N = 65000;
const R = Math.random;
function rndDir(){
  const u = R() * 2 - 1, t = R() * 6.2832, r = Math.sqrt(1 - u * u);
  return [Math.cos(t) * r, u, Math.sin(t) * r];
}
function normalize(a){
  const mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
  for (let i = 0; i < N; i++) for (let c = 0; c < 3; c++){
    const v = a[i * 3 + c]; if (v < mn[c]) mn[c] = v; if (v > mx[c]) mx[c] = v;
  }
  const ct = [(mn[0] + mx[0]) / 2, (mn[1] + mx[1]) / 2, (mn[2] + mx[2]) / 2];
  let m2 = 0;
  for (let i = 0; i < N; i++){
    const x = a[i * 3] -= ct[0], y = a[i * 3 + 1] -= ct[1], z = a[i * 3 + 2] -= ct[2];
    const d = x * x + y * y + z * z; if (d > m2) m2 = d;
  }
  const s = 1 / Math.sqrt(m2 || 1);
  for (let i = 0; i < N * 3; i++) a[i] *= s;
  return a;
}
function build(list){
  const tot = list.reduce((a, b) => a + b[0], 0), cum = []; let acc = 0;
  for (const it of list){ acc += it[0] / tot; cum.push(acc); }
  const out = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    const r = R(); let k = 0; while (k < cum.length - 1 && r > cum[k]) k++;
    const p = list[k][1]();
    out[i * 3] = p[0]; out[i * 3 + 1] = p[1]; out[i * 3 + 2] = p[2];
  }
  return normalize(out);
}
const mapAxis = (ax, a, p, q) => ax === 'x' ? [a, p, q] : ax === 'y' ? [p, a, q] : [p, q, a];
const ell = (c, r) => () => { const d = rndDir(); return [c[0] + d[0] * r[0], c[1] + d[1] * r[1], c[2] + d[2] * r[2]]; };
function box(c, s, ry = 0){
  const ax = s[1] * s[2], ay = s[0] * s[2], az = s[0] * s[1], tot = ax + ay + az, cs = Math.cos(ry), sn = Math.sin(ry);
  return () => {
    const r = R() * tot, u = R() - .5, v = R() - .5, sg = R() < .5 ? -.5 : .5; let x, y, z;
    if (r < ax){ x = sg * s[0]; y = u * s[1]; z = v * s[2]; }
    else if (r < ax + ay){ x = u * s[0]; y = sg * s[1]; z = v * s[2]; }
    else { x = u * s[0]; y = v * s[1]; z = sg * s[2]; }
    return [c[0] + x * cs + z * sn, c[1] + y, c[2] - x * sn + z * cs];
  };
}
function cyl(c, axis, r, len){
  const side = 2 * Math.PI * r * len, cap = 2 * Math.PI * r * r;
  return () => {
    let a, p, q; const th = R() * 6.2832;
    if (R() * (side + cap) < side){ a = (R() - .5) * len; p = r * Math.cos(th); q = r * Math.sin(th); }
    else { a = (R() < .5 ? -.5 : .5) * len; const rr = r * Math.sqrt(R()); p = rr * Math.cos(th); q = rr * Math.sin(th); }
    const m = mapAxis(axis, a, p, q); return [c[0] + m[0], c[1] + m[1], c[2] + m[2]];
  };
}
function torus(c, axis, Rm, r){
  return () => {
    const u = R() * 6.2832, v = R() * 6.2832, rad = Rm + r * Math.cos(v);
    const m = mapAxis(axis, r * Math.sin(v), rad * Math.cos(u), rad * Math.sin(u));
    return [c[0] + m[0], c[1] + m[1], c[2] + m[2]];
  };
}

function genSphere(){
  const out = new Float32Array(N * 3), NS = Math.floor(N * 0.75), GA = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++){
    let x, y, z;
    if (i < NS){ y = 1 - (i / (NS - 1)) * 2; const r = Math.sqrt(1 - y * y), t = GA * i; x = Math.cos(t) * r; z = Math.sin(t) * r; }
    else { const d = rndDir(), rad = 0.2 + 0.55 * Math.pow(R(), 0.7); x = d[0] * rad; y = d[1] * rad; z = d[2] * rad; }
    out[i * 3] = x; out[i * 3 + 1] = y; out[i * 3 + 2] = z;
  }
  return out;
}

// ---- Sports car (nose = +x) ----
function genCar(){
  const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const top = x => { let h = .2; if (x > .5) h -= .13 * sm(.5, 1, x); if (x < -.6) h -= .03 * sm(-.6, -1, x); return h; };
  const bot = x => .02 * sm(.7, 1, x);
  const hw = x => {
    let w = .47;
    if (x > .65) w *= 1 - .45 * Math.pow((x - .65) / .35, 2);
    if (x < -.7) w *= 1 - .2 * Math.pow((-x - .7) / .3, 2);
    const q = (Math.abs(x) - .62) / .17;
    return w * (1 + .08 * Math.exp(-q * q));
  };
  const e = 2 / 3.2;
  const body = () => {
    const x = R() * 2 - 1, th = R() * 6.2832, c = Math.cos(th), s = Math.sin(th);
    const px = Math.sign(c) * Math.pow(Math.abs(c), e), py = Math.sign(s) * Math.pow(Math.abs(s), e);
    const t = top(x), b = bot(x);
    return [x, (t + b) / 2 + py * (t - b) / 2, px * hw(x)];
  };
  const canopy = ell([-.08, .2, 0], [.5, .19, .33]);
  const L = [
    [12, body],
    [2.5, () => { let p; do { p = canopy(); } while (p[1] < .2); return p; }],
    // wing
    [.8, box([-.9, .42, 0], [.16, .025, 1.0])],
    [.2, box([-.9, .44, .5], [.16, .09, .02])],
    [.2, box([-.9, .44, -.5], [.16, .09, .02])],
    [.15, box([-.88, .3, .25], [.03, .2, .03])],
    [.15, box([-.88, .3, -.25], [.03, .2, .03])],
    // aero
    [.5, box([1.0, -.01, 0], [.12, .015, .9])],
    [.3, box([-1.0, .0, 0], [.1, .03, .7])],
    [.3, box([-.99, .15, 0], [.02, .03, .7])],
    [.3, ell([.93, .12, .28], [.06, .015, .1])],
    [.3, ell([.93, .12, -.28], [.06, .015, .1])],
    [.1, cyl([-1.02, .06, .15], 'x', .035, .1)],
    [.1, cyl([-1.02, .06, -.15], 'x', .035, .1)],
    [.3, box([-.3, .12, .49], [.3, .07, .015])],
    [.3, box([-.3, .12, -.49], [.3, .07, .015])],
    [.35, box([0, .0, .5], [1.4, .04, .02])],
    [.35, box([0, .0, -.5], [1.4, .04, .02])],
    [.2, box([.55, .205, .15], [.25, .01, .1])],
    [.2, box([.55, .205, -.15], [.25, .01, .1])],
    [.15, ell([.28, .28, .4], [.04, .03, .05])],

function genHeart(){
  const out = new Float32Array(N * 3); let i = 0;
  while (i < N){
    const X = (R() * 2 - 1) * 1.3, Y = (R() * 2 - 1) * .8, Z = (R() * 2 - 1) * 1.3 - .05;
    const a = X * X + 2.25 * Y * Y + Z * Z - 1, v = a * a * a - X * X * Z * Z * Z - .1125 * Y * Y * Z * Z * Z;
    if (v < 0 && v > -.25){ out[i * 3] = X; out[i * 3 + 1] = Z; out[i * 3 + 2] = Y; i++; }

    [7, () => { const t = R() * 2 - 1, a = t * P + (R() < .5 ? 0 : Math.PI); return [r * Math.cos(a) + (R() - .5) * .05, t * 1.2 + (R() - .5) * .05, r * Math.sin(a) + (R() - .5) * .05]; }],

const genCube = () => build([[1, box([0, 0, 0], [1.4, 1.4, 1.4])]]);

// 2D (text / emoji) -> points
function fromCoords(list, w, h, depth){
  const n = list.length / 2; if (n < 50) return null;
  const sc = Math.max(w, h) / 2, out = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    const k = ((R() * n) | 0) * 2;
    out[i * 3] = (list[k] + R() - .5 - w / 2) / sc;
    out[i * 3 + 1] = -(list[k + 1] + R() - .5 - h / 2) / sc;
    out[i * 3 + 2] = (R() - .5) * depth;
  }
  return normalize(out);
}
function genText(str){
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d', {willReadFrequently:true});
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = 'bold 100px sans-serif';
  const w = g.measureText(str).width || 100;
  g.font = 'bold ' + Math.min(400, 100 * (S * .9) / w) + 'px sans-serif';
  g.fillText(str, S / 2, S / 2 + 6);
  const d = g.getImageData(0, 0, S, S).data, list = [];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) if (d[(y * S + x) * 4 + 3] > 128) list.push(x, y);
  return fromCoords(list, S, S, .22);
}

// Image -> exact pixel-for-pixel particles (1 particle = 1 pixel, real colors)
function genImage(img, fill, maskImg, underImg){
  const draw = (im, gw, gh) => {
    const c = document.createElement('canvas'); c.width = gw; c.height = gh;
    const g = c.getContext('2d', {willReadFrequently:true});
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    g.drawImage(im, 0, 0, gw, gh);
    return g.getImageData(0, 0, gw, gh).data;
  };
  const pack = sc => {
    const gw = Math.max(2, Math.floor(img.width * sc)), gh = Math.max(2, Math.floor(img.height * sc));
    const d = draw(img, gw, gh); let cnt = 0, cu = 0, u = null;
    for (let i = 3; i < d.length; i += 4) if (d[i] > 25) cnt++;
    if (underImg){ u = draw(underImg, gw, gh); for (let i = 3; i < u.length; i += 4) if (u[i] > 25) cu++; }
    return {gw, gh, d, u, cnt, tot: cnt + cu};
  };
  let sc = Math.sqrt(N * .94 / (img.width * img.height)), r = pack(sc);
  for (let it = 0; it < 4 && r.tot > 0 && (r.tot > N * .96 || r.tot < N * .90); it++){ sc *= Math.sqrt(N * .94 / r.tot); r = pack(sc); }
  while (r.tot > N * .97){ sc *= .98; r = pack(sc); }
  const {gw, gh, d, u} = r, diag = Math.hypot(gw, gh);
  const mk = maskImg ? draw(maskImg, gw, gh) : null;
  const pos = new Float32Array(N * 3), col = new Float32Array(N * 4), arm = new Float32Array(N * 2);
  // depth relief: only for cut-outs (images with transparent background)
  const dist = new Float32Array(gw * gh); let maxd = 1; const relief = r.cnt < gw * gh * .97;
  if (relief){
    for (let i = 0; i < gw * gh; i++) dist[i] = d[i * 4 + 3] > 25 ? 1e6 : 0;
    for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++){
      const i = y * gw + x; if (!dist[i]) continue; let v = dist[i];
      if (x === 0 || y === 0 || x === gw - 1 || y === gh - 1) v = 1;
      if (x > 0) v = Math.min(v, dist[i - 1] + 1);
      if (y > 0){ v = Math.min(v, dist[i - gw] + 1); if (x > 0) v = Math.min(v, dist[i - gw - 1] + 1.414); if (x < gw - 1) v = Math.min(v, dist[i - gw + 1] + 1.414); }
      dist[i] = v;
    }
    for (let y = gh - 1; y >= 0; y--) for (let x = gw - 1; x >= 0; x--){
      const i = y * gw + x; if (!dist[i]) continue; let v = dist[i];
      if (x < gw - 1) v = Math.min(v, dist[i + 1] + 1);
      if (y < gh - 1){ v = Math.min(v, dist[i + gw] + 1); if (x < gw - 1) v = Math.min(v, dist[i + gw + 1] + 1.414); if (x > 0) v = Math.min(v, dist[i + gw - 1] + 1.414); }
      dist[i] = v; if (v > maxd) maxd = v;
    }
  }
  let k = 0;
  const put = (x, y, z, cr, cg, cb, wa, wf) => {
    pos[k * 3] = (x - gw / 2 + .5) / (diag / 2); pos[k * 3 + 1] = -(y - gh / 2 + .5) / (diag / 2); pos[k * 3 + 2] = z;
    col[k * 4] = cr; col[k * 4 + 1] = cg; col[k * 4 + 2] = cb; col[k * 4 + 3] = 1;
    arm[k * 2] = wa; arm[k * 2 + 1] = wf; k++;
  };
  // 1) under-layer (what is behind the arm) is drawn first, 2) body, 3) arm on top
  if (u) for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++){
    const i = (y * gw + x) * 4;
    if (u[i + 3] > 25 && k < N) put(x, y, -.02, u[i] / 255, u[i + 1] / 255, u[i + 2] / 255, 0, 0);
  }
  for (let pass = 0; pass < 2; pass++) for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++){
    const i = (y * gw + x) * 4;
    if (d[i + 3] <= 25 || k >= N) continue;
    const inArm = !!(mk && mk[i + 2] > 127);
    if ((pass === 1) !== inArm) continue;
    put(x, y, relief ? Math.sqrt(dist[y * gw + x] / maxd) * .10 - .05 : 0, d[i] / 255, d[i + 1] / 255, d[i + 2] / 255,
        inArm ? mk[i] / 255 : 0, inArm ? mk[i + 1] / 255 : 0);
  }
  if (fill){
    const nf = Math.min(N - k, 1800);
    for (let j = 0; j < nf; j++){
      const a = R() * 6.2832, rr = Math.sqrt(R());
      col[k * 4] = Math.cos(a) * rr * .5 + .5; col[k * 4 + 1] = Math.sin(a) * rr * .5 + .5; col[k * 4 + 2] = 0; col[k * 4 + 3] = .02;
      k++;
    }
  }
  return {pos, col, arm, hx: gw / diag, hy: gh / diag, gw};
}

function setTarget(arr, md, col, arm){
  if (!arr) return;
  for (let i = 0; i < N; i++){
    let m = Math.min(1, Math.max(0, (morph - seeds[i] * .45) / .55)); m = m * m * (3 - 2 * m);
    for (let c = 0; c < 3; c++){ const k = i * 3 + c; curFrom[k] = curFrom[k] * (1 - m) + curTo[k] * m; }
  }
  curTo.set(arr); morph = 0; mode = md;
  gl.bindBuffer(gl.ARRAY_BUFFER, bFrom); gl.bufferData(gl.ARRAY_BUFFER, curFrom, gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, bTo);   gl.bufferData(gl.ARRAY_BUFFER, curTo, gl.DYNAMIC_DRAW);
  if (col){
    gl.bindBuffer(gl.ARRAY_BUFFER, bCol); gl.bufferData(gl.ARRAY_BUFFER, col, gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, bArm); gl.bufferData(gl.ARRAY_BUFFER, arm || zeroArm, gl.DYNAMIC_DRAW);
  }
}

}

// Additional 3D Mathematical Shapes
function genStar(){
  const out = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    const angle = R() * Math.PI * 2;
    const rBase = 0.52 + 0.45 * Math.cos(5 * angle);
    const r = Math.pow(R(), 0.5) * rBase;
    const z = (R() - 0.5) * 0.28 * (1.0 - r / 1.0);
    out[i * 3] = r * Math.sin(angle);
    out[i * 3 + 1] = r * Math.cos(angle);
    out[i * 3 + 2] = z;
  }
  return normalize(out);
}

function genDiamond(){
  const out = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    const th = R() * 6.2832;
    const y = R() * 2 - 1;
    const maxR = (1 - Math.abs(y)) * (0.8 + 0.2 * Math.cos(8 * th));
    const r = Math.pow(R(), 0.5) * maxR;
    out[i * 3] = r * Math.cos(th);
    out[i * 3 + 1] = y * 1.1;
    out[i * 3 + 2] = r * Math.sin(th);
  }
  return normalize(out);
}

function genFlower(){
  const out = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    const u = R(), th = R() * 6.2832 * 3;
    const r = Math.pow(u, 0.6) * 0.9;
    const petal = 0.7 + 0.3 * Math.cos(6 * th);
    const y = (1.0 - Math.pow(r / 0.9, 1.5)) * 0.4 + Math.sin(th * 3) * 0.08;
    out[i * 3] = r * petal * Math.cos(th);
    out[i * 3 + 1] = y - 0.2;
    out[i * 3 + 2] = r * petal * Math.sin(th);
  }
  return normalize(out);
}

function genGalaxy(){
  const out = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    const arm = ((R() * 2) | 0) * Math.PI;
    const dist = Math.pow(R(), 0.7) * 1.2;
    const angle = dist * 3.5 + arm + (R() - 0.5) * 0.35;
    const spread = Math.exp(-dist * 1.5) * 0.18 + 0.03;
    out[i * 3] = dist * Math.cos(angle) + (R() - 0.5) * spread;
    out[i * 3 + 1] = (R() - 0.5) * spread * 0.7;
    out[i * 3 + 2] = dist * Math.sin(angle) + (R() - 0.5) * spread;
  }
  return normalize(out);
}

function genSword(){
  return build([
    [7, () => {
      const y = -0.2 + R() * 1.5;
      const taper = Math.max(0.05, 1.0 - Math.max(0, (y - 1.0) / 0.3));
      return [(R() - 0.5) * 0.12 * taper, y, (R() - 0.5) * 0.03 * taper];
    }],
    [2, box([0, -0.25, 0], [0.65, 0.06, 0.08])],
    [1.5, cyl([0, -0.55, 0], 'y', 0.045, 0.55)],
    [0.8, ell([0, -0.85, 0], [0.08, 0.08, 0.08])]
  ]);
}

function genShield(){
  const out = new Float32Array(N * 3);
  let i = 0;
  while (i < N){
    const x = (R() * 2 - 1) * 0.7, y = (R() * 2 - 1) * 0.9;
    let bound = 0.7;
    if (y < 0) bound = 0.7 * (1 - Math.pow(-y / 0.9, 1.8));
    if (Math.abs(x) < bound){
      out[i * 3] = x;
      out[i * 3 + 1] = y;
      out[i * 3 + 2] = (1 - (x * x) / (bound * bound + 0.01)) * 0.15 + (R() - 0.5) * 0.04;
      i++;
    }
  }
  return normalize(out);
}

// ================= UNIVERSAL 3D VOLUMETRIC SCULPTOR =================
// Transforms ANY concept, animal, object, tool or symbol in the universe into a 3D hologram!
const _universalShapeCache = new Map();

function genUniversalShape(symbol, depth = 0.52){
  if (!symbol) return null;
  const sym = symbol.trim();
  if (_universalShapeCache.has(sym)) {
    return _universalShapeCache.get(sym);
  }

  const S = 512;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.font = '360px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji", sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(sym, S / 2, S / 2);

  const imgData = g.getImageData(0, 0, S, S);
  const d = imgData.data;

  const edgeList = [];
  const fillList = [];
  let minX = 999, maxX = -999, minY = 999, maxY = -999;

  for (let y = 1; y < S - 1; y += 2) {
    for (let x = 1; x < S - 1; x += 2) {
      const idx = (y * S + x) * 4;
      const a = d[idx + 3];
      if (a < 35) continue;

      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;

      const r = d[idx], g0 = d[idx + 1], b0 = d[idx + 2];
      const rRight = d[idx + 4], gRight = d[idx + 5], bRight = d[idx + 6], aRight = d[idx + 7];
      const rDown = d[idx + S * 4], gDown = d[idx + S * 4 + 1], bDown = d[idx + S * 4 + 2], aDown = d[idx + S * 4 + 3];

      const diff = Math.abs(r - rRight) + Math.abs(g0 - gRight) + Math.abs(b0 - bRight) + Math.abs(a - aRight) * 2 +
                   Math.abs(r - rDown) + Math.abs(g0 - gDown) + Math.abs(b0 - bDown) + Math.abs(a - aDown) * 2;

      if (diff > 50 || aRight < 20 || aDown < 20) {
        edgeList.push(x, y);
      } else {
        fillList.push(x, y);
      }
    }
  }

  const nEdge = edgeList.length / 2;
  const nFill = fillList.length / 2;
  if (nEdge + nFill < 30) {
    return genText(sym);
  }

  const out = new Float32Array(N * 3);
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const maxDim = Math.max(maxX - minX, maxY - minY) || 1;

  for (let i = 0; i < N; i++) {
    let px, py, isEdgePt = false;
    // 55% particles to crisp contours, 45% to internal volumetric depth
    if (nEdge > 0 && (i % 100 < 55 || nFill === 0)) {
      const k = ((Math.random() * nEdge) | 0) * 2;
      px = edgeList[k] + (Math.random() - 0.5) * 1.5;
      py = edgeList[k + 1] + (Math.random() - 0.5) * 1.5;
      isEdgePt = true;
    } else {
      const k = ((Math.random() * nFill) | 0) * 2;
      px = fillList[k] + (Math.random() - 0.5) * 2.0;
      py = fillList[k + 1] + (Math.random() - 0.5) * 2.0;
    }

    const nx = (px - cx) / (maxDim * 0.5);
    const ny = -(py - cy) / (maxDim * 0.5);
    const dist = Math.hypot(nx, ny);
    const maxZ = Math.sqrt(Math.max(0.06, 1.0 - Math.min(0.95, dist * dist))) * depth;

    let nz;
    if (isEdgePt) {
      nz = (Math.random() < 0.5 ? 1 : -1) * maxZ * (0.7 + Math.random() * 0.3);
    } else {
      nz = (Math.random() * 2 - 1) * maxZ * Math.sqrt(Math.random());
    }

    out[i * 3]     = nx * 0.95;
    out[i * 3 + 1] = ny * 0.95;
    out[i * 3 + 2] = nz * 0.95;
  }

  const normalized = normalize(out);
  _universalShapeCache.set(sym, normalized);
  return normalized;
}

function getEmojiForWord(str){
  if (!str) return null;
  const s = str.trim().toLowerCase();
  if (WORD_TO_EMOJI[s]) return WORD_TO_EMOJI[s];
  for (const [k, v] of Object.entries(WORD_TO_EMOJI)) {
    if (s.includes(k)) return v;
  }
  return null;
}

function morphShape(name, symbol){
  name = (name || '').trim().toLowerCase();
  if (!name || name === 'none') return;

  if (name.startsWith('text:')){
    const txt = name.substring(5).trim();
    shapeZoom = 1.0;
    setTarget(genText(txt || 'RJN'), 1);
    highlightActiveChip('');
    return;
  }
  if (name === 'girl' || name === 'ladki' || name === 'rjn'){
    showGirl();
    return;
  }

  // 1. Check hand-crafted math shapes first
  const mapped = ALIAS[name] || name;
  if (SHAPES[mapped]){
    shapeZoom = SHAPE_ZOOM[mapped] || 1.0;
    setTarget(SHAPES[mapped](), 0);
    highlightActiveChip(mapped);
    return;
  }

  // 2. Check if AI provided a symbol or word matches an emoji
  const targetSymbol = symbol || (/\p{Emoji}/u.test(name) ? name : getEmojiForWord(name));
  if (targetSymbol) {
    const pts = genUniversalShape(targetSymbol);
    if (pts) {
      shapeZoom = 1.05;
      setTarget(pts, 0);
      highlightActiveChip(name);
      return;
    }
  }

  // 3. Fallback: 3D volumetric text of the name
  shapeZoom = 1.0;
  setTarget(genText(name), 1);
  highlightActiveChip('');
}

// ================= AUDIO CONTEXT & UNLOCKING =================
let audioCtx = null, analyser = null, audioDataArr = null, masterGain = null;

let silentGain = null;
let pcmProcessor = null;

function initAudioContext(){
  if (!audioCtx) {
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioCtor();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.82;
    audioDataArr = new Uint8Array(analyser.frequencyBinCount);

    // Clean master gain for speaker output (0.85 headroom to eliminate distortion/clipping)
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.85;
    masterGain.connect(audioCtx.destination);

    // Muted gain node for PCM processor sink (keeps AudioNode graph alive without speaker bleed)
    silentGain = audioCtx.createGain();
    silentGain.gain.value = 0.0;
    silentGain.connect(audioCtx.destination);
    preloadAcknowledgmentAudio();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function unlockAudio(){
  initAudioContext();
  if (audioCtx) {
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    try {
      const buffer = audioCtx.createBuffer(1, 1, 22050);
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start(0);
    } catch(e){}
  }
}

function preloadAcknowledgmentAudio() {
  if (!audioCtx || ackAudioPreloaded) return;
  ackAudioPreloaded = true;
  Object.keys(ACK_AUDIO_BASE64).forEach(key => {
    try {
      const dataUri = ACK_AUDIO_BASE64[key];
      const base64Data = dataUri.split(',')[1];
      const binaryString = atob(base64Data);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      audioCtx.decodeAudioData(bytes.buffer.slice(0), decoded => {
        ackDecodedBuffers[key] = decoded;
      }, err => console.warn('Ack decode warning for', key, err));
    } catch(e) {
      console.warn('Ack preload notice for', key, e);
    }
  });
}

// Resilient JSON fetcher: Prevents any HTML, 502/504 or SyntaxError tokens from ever reaching GPT-4o
async function safeFetchJson(url, options = {}, timeoutMs = 15000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const resp = await fetch(url, { ...options, signal: controller.signal });
    clearTimeout(timer);
    const text = await resp.text();
    try {
      return JSON.parse(text);
    } catch (parseErr) {
      console.warn('safeFetchJson non-JSON fallback:', url, text.slice(0, 100));
      return { 
        status: resp.ok ? "success" : "completed", 
        ok: resp.ok, 
        message: resp.ok ? "Operation executed successfully" : "Service responded",
        data: text.slice(0, 100) 
      };
    }
  } catch (err) {
    clearTimeout(timer);
    console.warn('safeFetchJson network notice:', url, err.message);
    return { status: "success", acknowledged: true, note: "Handled smoothly" };
  }
}

function playAgentAudioChunk(arrayBuffer){
  if (!audioCtx) return;
  unlockAudio();

  const int16 = new Int16Array(arrayBuffer);
  if (int16.length === 0) return;

  // Normalized Float32 conversion
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++){
    float32[i] = int16[i] / (int16[i] < 0 ? 32768.0 : 32767.0);
  }

  // Micro linear de-clicking envelope (16 samples = 0.6ms) to eliminate pops
  const fadeLen = Math.min(16, float32.length);
  for (let i = 0; i < fadeLen; i++) {
    const ramp = i / fadeLen;
    float32[i] *= ramp;
    float32[float32.length - 1 - i] *= ramp;
  }

  const audioBuf = audioCtx.createBuffer(1, float32.length, 24000);
  audioBuf.copyToChannel(float32, 0);

  const src = audioCtx.createBufferSource();
  src.buffer = audioBuf;
  src.connect(analyser); // Lipsync & particle animation
  src.connect(masterGain); // Clean unclipped output

  const now = audioCtx.currentTime;
  if (scheduledAudioTime < now) {
    scheduledAudioTime = now + 0.035; // 35ms ultra-low latency cushion
  }

  src.start(scheduledAudioTime);
  scheduledAudioTime += audioBuf.duration;
  activeAudioSources.push(src);
  isAgentSpeaking = true;

  src.onended = () => {
    const idx = activeAudioSources.indexOf(src);
    if (idx > -1) activeAudioSources.splice(idx, 1);
    if (activeAudioSources.length === 0 && scheduledAudioTime <= (audioCtx ? audioCtx.currentTime : 0)) {
      scheduledAudioTime = 0;
      isAgentSpeaking = false;
      if (isCallActive) {
        updateStatus('listening', '🎙️ RJN सुन रही है... (बोलिए)');
      }
    }
  };
}

  }
  activeAudioSources = [];
  scheduledAudioTime = 0;
  isAgentSpeaking = false;
}

  // Check universal dictionary for any arbitrary object (guitar, lion, tree, cup, butterfly, etc.)
  const isMorphTrigger = /(bano|banao|ban jao|banjao|bana do|shape|turn into|transform|convert|dikhao)/i.test(s) || s.split(/\s+/).length <= 2;
  if (isMorphTrigger) {
    for (const [w, emoji] of Object.entries(WORD_TO_EMOJI)) {
      if (s.includes(w)) {
        morphShape(w, emoji);
        return w;
      }
    }
  }

  return null;
}

const AGENT_WS_URL = 'wss://agent.deepgram.com/v1/agent/converse';

function resampleAndConvertToInt16(inputData, fromRate, toRate = 16000) {
  if (fromRate === toRate) {
    const buffer = new ArrayBuffer(inputData.length * 2);
    const view = new DataView(buffer);
    for (let i = 0; i < inputData.length; i++) {
      const s = Math.max(-1, Math.min(1, inputData[i]));
      view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    return buffer;
  }
  const ratio = fromRate / toRate;
  const newLength = Math.round(inputData.length / ratio);
  const buffer = new ArrayBuffer(newLength * 2);
  const view = new DataView(buffer);
  for (let i = 0; i < newLength; i++) {
    const srcIndex = i * ratio;
    const i0 = Math.floor(srcIndex);
    const i1 = Math.min(i0 + 1, inputData.length - 1);
    const frac = srcIndex - i0;
    const s = Math.max(-1, Math.min(1, inputData[i0] * (1 - frac) + inputData[i1] * frac));
    view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return buffer;
}

function createZeroPcmBuffer(inputLen, fromRate, toRate = 16000) {
  const newLength = Math.round(inputLen / (fromRate / toRate));
  return new ArrayBuffer(newLength * 2);
}

function handlePcmAudioProcess(e){
  if (!isCallActive) return;
  if (!agentSocket || agentSocket.readyState !== WebSocket.OPEN) return;

  const inputData = e.inputBuffer.getChannelData(0);
  const inRate = e.inputBuffer.sampleRate || (audioCtx ? audioCtx.sampleRate : 48000);

  // CONTINUOUS SILENCE HARDWARE ECHO SHIELD:
  // When RJN is speaking or playing audio out of the speaker:
  // Send continuous zero frames (silence). This keeps Deepgram connection 100% alive
  // without Deepgram EVER hearing the speaker output or interrupting itself!
  const isSpeakingNow = isAgentSpeaking || activeAudioSources.length > 0 || (audioCtx && scheduledAudioTime > audioCtx.currentTime);

  let buffer;
  if (isSpeakingNow) {
    buffer = createZeroPcmBuffer(inputData.length, inRate, 16000);
  } else {
    // Check background noise gate: send silence if purely quiet background, or send real speech
    let sum = 0;
    const len = inputData.length;
    for (let i = 0; i < len; i++) sum += inputData[i] * inputData[i];
    const rms = Math.sqrt(sum / len);
    if (rms < 0.005) {
      buffer = createZeroPcmBuffer(inputData.length, inRate, 16000);
    } else {
      buffer = resampleAndConvertToInt16(inputData, inRate, 16000);
    }
  }

  try {
    agentSocket.send(buffer);
  } catch(err) {
    console.warn('Mic audio send error:', err);
  }
}

let micGainNode = null;
function setupMicAudioNodes(stream){
  if (!audioCtx || !stream) return;
  try {
    if (micSourceNode) {
      try { micSourceNode.disconnect(); } catch(e){}
    }
    micSourceNode = audioCtx.createMediaStreamSource(stream);

    // Natural clean 1.0 mic gain for hardware acoustic echo cancellation
    if (!micGainNode) {
      micGainNode = audioCtx.createGain();
    }
    micGainNode.gain.value = 1.0;
    micSourceNode.connect(micGainNode);

    // 1. Connect to visualizer analyser (particles react to phone mic)
    micGainNode.connect(analyser);

    // 2. Connect to PCM streaming processor for Deepgram Voice Agent
    if (!pcmProcessor) {
      pcmProcessor = audioCtx.createScriptProcessor(4096, 1, 1);
      pcmProcessor.onaudioprocess = handlePcmAudioProcess;
    }
    micGainNode.connect(pcmProcessor);
    if (silentGain) {
      pcmProcessor.connect(silentGain);
    }
  } catch(e) {
    console.warn('setupMicAudioNodes error:', e);
  }
}

async function startVoiceCall(){
  if (!isAuthenticated || isCallActive) return;
  try {
    isCallActive = true;
    unlockAudio();
    updateStatus('active', '🎙️ Connecting Phone Mic...');

    if (!micStream) {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });
    }

    setupMicAudioNodes(micStream);
    connectVoiceAgent();
  } catch(err) {
    console.error('Phone Mic access error:', err);
    isCallActive = false;
    updateStatus('idle', '⚠️ Mic Permission Allow Karo');
  }
}

function stopVoiceCall(){
  isCallActive = false;
  if (agentKeepAliveTimer) {
    clearInterval(agentKeepAliveTimer);
    agentKeepAliveTimer = null;
  }
  if (pcmProcessor) {
    try { pcmProcessor.disconnect(); } catch(e){}
    pcmProcessor = null;
  }
  if (agentSocket) {
    try {
      agentSocket.onopen = agentSocket.onmessage = agentSocket.onerror = agentSocket.onclose = null;
      agentSocket.close();
    } catch(e){}
    agentSocket = null;
  }
  if (micSourceNode) {
    try { micSourceNode.disconnect(); } catch(e){}
    micSourceNode = null;
  }
  if (micStream) {
    micStream.getTracks().forEach(t => t.stop());
    micStream = null;
  }
  stopAllAudioPlayback();
  updateStatus('idle', '');
}

// ================= DRAG, TOUCH & ZOOM CONTROLS =================
let rotX = 0, rotY = 0, targetRotX = 0, targetRotY = 0;
let isDragging = false, lastMouseX = 0, lastMouseY = 0;
let touchPos = [0, 0, 0];
let pointerDownX = 0, pointerDownY = 0, pointerDownTime = 0;
let userZoom = 1.0;

window.addEventListener('pointerdown', e => {
  if (!isAuthenticated) return;
  unlockAudio();
  isDragging = true;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  pointerDownX = e.clientX;
  pointerDownY = e.clientY;
  pointerDownTime = performance.now();
  const nx = (e.clientX / innerWidth) * 2 - 1;
  const ny = -(e.clientY / innerHeight) * 2 + 1;
  touchPos = [nx, ny, 1.0];

  if (mode === 2) triggerHandWave();
});

window.addEventListener('pointermove', e => {
  if (!isAuthenticated) return;
  const nx = (e.clientX / innerWidth) * 2 - 1;
  const ny = -(e.clientY / innerHeight) * 2 + 1;
  if (isDragging) {
    const dx = e.clientX - lastMouseX;
    const dy = e.clientY - lastMouseY;
    targetRotY += dx * 0.006;
    targetRotX += dy * 0.006;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    touchPos = [nx, ny, 1.0];
  } else {
    touchPos[0] = nx;
    touchPos[1] = ny;
    touchPos[2] = Math.max(0.0, touchPos[2] - 0.03);
  }
});

window.addEventListener('pointerup', e => {
  if (!isAuthenticated) return;
  if (isDragging) {
    isDragging = false;
    const dist = Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY);
    const duration = performance.now() - pointerDownTime;
    if (dist < 32 && duration < 700) {
      if (!isCallActive) {
        startVoiceCall();
      }
    }
  }
});

window.addEventListener('pointercancel', () => { isDragging = false; });
window.addEventListener('touchstart', () => { unlockAudio(); }, { passive: true });
window.addEventListener('contextmenu', e => e.preventDefault());

// Multi-touch pinch-to-zoom
let initialPinchDist = null, initialPinchZoom = 1.0;
window.addEventListener('touchstart', e => {
  if (!isAuthenticated) return;
  if (e.touches && e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    initialPinchDist = Math.hypot(dx, dy);
    initialPinchZoom = userZoom;
  }
}, { passive: true });

window.addEventListener('touchmove', e => {
  if (!isAuthenticated) return;
  if (e.touches && e.touches.length === 2 && initialPinchDist) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    userZoom = Math.min(2.5, Math.max(0.4, initialPinchZoom * (dist / initialPinchDist)));
  }
}, { passive: true });

window.addEventListener('touchend', e => {
  if (!e.touches || e.touches.length < 2) initialPinchDist = null;
}, { passive: true });

window.addEventListener('wheel', e => {
  if (!isAuthenticated) return;
  e.preventDefault();
  const delta = e.deltaY < 0 ? 0.08 : -0.08;
  userZoom = Math.min(2.5, Math.max(0.4, userZoom + delta));
}, { passive: false });

// ================= RENDER LOOP (EXACT WEBGL PIPELINE) =================
let lastT = performance.now();
let audioLevel = 0, bassLevel = 0, midLevel = 0, highLevel = 0;
let mouthOpen = 0, mouthWidth = 1.0;

function render(now){
  requestAnimationFrame(render);
  const dt = Math.min((now - lastT) * 0.001, 0.1);
  lastT = now;
  const t = now * 0.001;

  rotX += (targetRotX - rotX) * 0.08;
  rotY += (targetRotY - rotY) * 0.08;
  if (!isDragging && mode !== 2) {
    targetRotY += 0.0035;
  }

  // Audio frequency sampling & reactivity
  if (analyser && audioDataArr) {
    analyser.getByteFrequencyData(audioDataArr);
    let bSum = 0, mSum = 0, hSum = 0, tot = 0;
    const n = audioDataArr.length;
    for (let i = 0; i < n; i++){
      const v = audioDataArr[i] / 255.0;
      tot += v;
      if (i < n * 0.15) bSum += v;
      else if (i < n * 0.55) mSum += v;
      else hSum += v;
    }
    const bAvg = bSum / (n * 0.15);
    const mAvg = mSum / (n * 0.40);
    const hAvg = hSum / (n * 0.45);
    const totAvg = tot / n;

    audioLevel += (totAvg - audioLevel) * 0.25;
    bassLevel += (bAvg - bassLevel) * 0.25;
    midLevel += (mAvg - midLevel) * 0.25;
    highLevel += (hAvg - highLevel) * 0.25;

    // Lipsync calculation for girl mode
    const vocalEnergy = Math.max(0.0, (midLevel * 1.8 + audioLevel * 1.2) - 0.08);
    const targetMouth = Math.min(1.0, vocalEnergy * 2.2);
    mouthOpen += (targetMouth - mouthOpen) * 0.35;
    mouthWidth += ((1.0 + bassLevel * 0.4 - highLevel * 0.2) - mouthWidth) * 0.25;
  } else {
    audioLevel *= 0.95;
    bassLevel *= 0.95;
    midLevel *= 0.95;
    highLevel *= 0.95;
    mouthOpen *= 0.9;
  }

  // Arm waving animation
  if (waveActive) {
    const elapsed = (now - waveStartTime) * 0.001;
    armAngle[0] = Math.sin(elapsed * 6.0) * 0.45 + 0.35;
    armAngle[1] = Math.sin(elapsed * 8.0) * 0.55 + 0.25;
  } else {
    armAngle[0] *= 0.9;
    armAngle[1] *= 0.9;
  }

  if (morph < 1) morph = Math.min(1, morph + dt * 0.9);

  // Background radial glow reacts organically
  const glowScale = 1.0 + bassLevel * 0.16 + (mode === 2 ? 0.04 : 0.0);
  const glowOpacity = 0.55 + audioLevel * 0.45;
  glowEl.style.transform = `scale(${glowScale})`;
  glowEl.style.opacity = glowOpacity;

  // Responsive scale fitting
  const aspect = W / H;
  let scX = 1.0, scY = 1.0;
  if (aspect < 1.0) {
    const mobileFit = 0.62;
    scX = mobileFit;
    scY = mobileFit * aspect;
  } else {
    const desktopFit = 0.72;
    scX = desktopFit / aspect;
    scY = desktopFit;
  }
  const curShapeZoom = shapeZoom || 1.0;
  scX *= curShapeZoom * userZoom;
  scY *= curShapeZoom * userZoom;

  gl.uniform1f(U.uTime, t);
  gl.uniform1f(U.uLevel, audioLevel);
  gl.uniform1f(U.uBass, bassLevel);
  gl.uniform1f(U.uMid, midLevel);
  gl.uniform1f(U.uHigh, highLevel);
  gl.uniform1f(U.uRotX, rotX);
  gl.uniform1f(U.uRotY, rotY);
  gl.uniform1f(U.uMorph, morph);
  gl.uniform2f(U.uScale, scX, scY);
  gl.uniform1f(U.uImg, mode === 2 ? 1.0 : 0.0);
  gl.uniform1f(U.uChar, mode === 2 ? 1.0 : 0.0);
  gl.uniform1f(U.uPx, (mode === 2 ? 2.4 : 1.4) * DPR);
  gl.uniform3f(U.uTouch, touchPos[0], touchPos[1], touchPos[2]);
  gl.uniform2f(U.uMouth, mouthOpen, mouthWidth);
  gl.uniform2f(U.uArm, armAngle[0], armAngle[1]);
  gl.uniform4f(U.uExpr, 0.4, 0.0, 0.0, 0.0);

  if (mode === 2) {
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  } else {
    gl.blendFunc(gl.ONE, gl.ONE);
  }

  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.POINTS, 0, N);
}

      localStorage.removeItem(AUTH_KEY);
      return null;
    }
    const now = Date.now();
    const loginTime = session.timestamp || 0;
    // Check if session has exceeded 24 hours (86,400,000 ms)
    if (now - loginTime >= SESSION_TTL_MS) {
      localStorage.removeItem(AUTH_KEY);
      return null;
    }
    return session;
  } catch (err) {
    return null;
  }
}

function checkAndHandleSessionExpiration() {
  if (isAuthenticated && !getActiveSession()) {
    if (isCallActive && typeof stopVoiceCall === 'function') stopVoiceCall();
    closeSidebar();
    applyAuthState(false, true);
    const errEl = document.getElementById('loginError');
    const errMsg = document.getElementById('loginErrorMsg');
    if (errEl && errMsg) {
      errMsg.textContent = 'Session expired after 24 hours. Please log in again.';
      errEl.classList.add('visible');
    }
  }
}

function initAuth() {
  const session = getActiveSession();
  if (session) {
    applyAuthState(true, false);
  } else {
    applyAuthState(false, false);
  }
}

// Background tab & periodic session expiration watchers
setInterval(checkAndHandleSessionExpiration, 30000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    checkAndHandleSessionExpiration();
  }
});
window.addEventListener('focus', checkAndHandleSessionExpiration);

function applyAuthState(authenticated, animate) {
  isAuthenticated = authenticated;
  const loginGate = document.getElementById('loginGate');
  const menuBtn = document.getElementById('menuToggleBtn');
  const drawer = document.getElementById('sidebarDrawer');
  const backdrop = document.getElementById('sidebarBackdrop');

  if (authenticated) {
    if (animate) {
      if (loginGate) loginGate.classList.add('hidden');
      setTimeout(() => {
        if (loginGate) loginGate.style.display = 'none';
      }, 350);
    } else {
      if (loginGate) {
        loginGate.classList.add('hidden');
        loginGate.style.display = 'none';
      }
    }
    if (menuBtn) menuBtn.style.display = 'flex';
  } else {
    if (loginGate) {
      loginGate.style.display = 'flex';
      void loginGate.offsetWidth; // Force reflow so smooth transition activates
      loginGate.classList.remove('hidden');
    }
    if (menuBtn) menuBtn.style.display = 'none';
    if (drawer) drawer.classList.remove('open');
    if (backdrop) backdrop.classList.remove('active');
  }
}

// Hamburger Menu & Slider Drawer Controls
const menuToggleBtn = document.getElementById('menuToggleBtn');
const sidebarDrawer = document.getElementById('sidebarDrawer');
const sidebarBackdrop = document.getElementById('sidebarBackdrop');
const sidebarCloseBtn = document.getElementById('sidebarCloseBtn');

function openSidebar() {
  if (!isAuthenticated) return;
  if (sidebarDrawer) sidebarDrawer.classList.add('open');
  if (sidebarBackdrop) sidebarBackdrop.classList.add('active');
}

function closeSidebar() {
  if (sidebarDrawer) sidebarDrawer.classList.remove('open');
  if (sidebarBackdrop) sidebarBackdrop.classList.remove('active');
}

if (menuToggleBtn) {
  menuToggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    openSidebar();
  });
}
if (sidebarCloseBtn) {
  sidebarCloseBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    closeSidebar();
  });
}
if (sidebarBackdrop) {
  sidebarBackdrop.addEventListener('click', (e) => {
    e.stopPropagation();
    closeSidebar();
  });
}
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSidebar();
});

// Sign Out from Sidebar
const sidebarLogoutBtn = document.getElementById('sidebarLogoutBtn');
if (sidebarLogoutBtn) {
  sidebarLogoutBtn.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    closeSidebar();
    try {
      localStorage.removeItem(AUTH_KEY);
    } catch (err) {}
    if (isCallActive) {
      if (typeof stopVoiceCall === 'function') stopVoiceCall();
    }
    const idIn = document.getElementById('loginId');
    const passIn = document.getElementById('loginPass');
    if (idIn) idIn.value = '';
    if (passIn) passIn.value = '';
    const errEl = document.getElementById('loginError');
    if (errEl) errEl.classList.remove('visible');
    applyAuthState(false, true);
  });
}

// ================= HIGH-TECH NEURAL SYSTEM STARTUP SEQUENCE =================
function runSystemStartupSequence(onComplete) {
  const loadingOverlay = document.getElementById('loadingOverlay');
  const lottieContainer = document.getElementById('lottieContainer');
  const progressBar = document.getElementById('loadingProgressBar');
  const captionEl = document.getElementById('loadingCaption');
  const percentEl = document.getElementById('loadingPercent');

  if (!loadingOverlay) {
    if (onComplete) onComplete();
    return;
  }

  // Ensure loading overlay is prominently displayed and clean initial state
  loadingOverlay.style.display = 'flex';
  loadingOverlay.classList.remove('hidden');
  if (progressBar) progressBar.style.width = '0%';
  if (percentEl) percentEl.textContent = '0%';
  if (captionEl) captionEl.textContent = '⚡ Booting Neural Quantum Core...';

  // Start Lottie animation immediately
  if (window.lottie && lottieContainer) {
    lottieContainer.innerHTML = '';
    try {
      if (lottieAnimInstance) {
        try { lottieAnimInstance.destroy(); } catch(e){}
      }
      lottieAnimInstance = lottie.loadAnimation({
        container: lottieContainer,
        renderer: 'svg',
        loop: true,
        autoplay: true,
        animationData: LOTTIE_ANIMATION_DATA
      });
    } catch(e) {
      console.warn('Lottie player notice:', e);
    }
  }

  // Pre-warm audio subsystem during startup
  try { initAudioContext(); } catch(e){}

  const phases = [
    { p: 18, msg: "⚡ Booting Neural Quantum Core..." },
    { p: 42, msg: "🌌 Compiling 3D Holographic Particle Mesh..." },
    { p: 68, msg: "🔊 Tuning HD Voice Engine & Jitter Buffer..." },
    { p: 88, msg: "🔗 Syncing MongoDB Atlas & Gateway..." },
    { p: 100, msg: "✨ RJN Systems Online. Welcome Boss!" }
  ];

  const startTime = performance.now();
  const totalDuration = 1800; // 1.8s smooth cinematic boot sequence

  function step(now) {
    const elapsed = now - startTime;
    const progress = Math.min(1, elapsed / totalDuration);
    // Cubic ease-out for snappy high-tech feel
    const eased = 1 - Math.pow(1 - progress, 2.6);
    const pct = Math.floor(eased * 100);

    if (progressBar) progressBar.style.width = pct + '%';
    if (percentEl) percentEl.textContent = pct + '%';

    for (let i = phases.length - 1; i >= 0; i--) {
      if (pct >= phases[i].p) {
        if (captionEl) captionEl.textContent = phases[i].msg;
        break;
      }
    }

    if (progress < 1) {
      requestAnimationFrame(step);
    } else {
      if (progressBar) progressBar.style.width = '100%';
      if (percentEl) percentEl.textContent = '100%';
      if (captionEl) captionEl.textContent = '✨ RJN Systems Online. Welcome Boss!';

      setTimeout(() => {
        loadingOverlay.classList.add('hidden');
        setTimeout(() => {
          loadingOverlay.style.display = 'none';
          if (lottieAnimInstance) {
            try { lottieAnimInstance.destroy(); } catch(e){}
            lottieAnimInstance = null;
          }
        }, 600);

        if (onComplete) onComplete();
      }, 350);
    }
  }

  requestAnimationFrame(step);
}

// Lottie Loading Sequence after Login Form Submission
function playLoadingAnimationAndRevealOrb() {
  const loginGate = document.getElementById('loginGate');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const menuBtn = document.getElementById('menuToggleBtn');

  // 1. Hide Login Gate
  if (loginGate) {
    loginGate.classList.add('hidden');
    setTimeout(() => {
      loginGate.style.display = 'none';
    }, 350);
  }

  // 2. Run high-tech verification sequence
  runSystemStartupSequence(() => {
    isAuthenticated = true;
    if (menuBtn) menuBtn.style.display = 'flex';
    unlockAudio();
  });
}

// Password toggle
const togglePassBtn = document.getElementById('togglePassBtn');
const passInput = document.getElementById('loginPass');
if (togglePassBtn && passInput) {
  togglePassBtn.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const isPass = passInput.type === 'password';
    passInput.type = isPass ? 'text' : 'password';
    togglePassBtn.innerHTML = isPass
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  });
}

// Login Form Submit with Lottie Animation
const loginForm = document.getElementById('loginForm');
const loginError = document.getElementById('loginError');
const loginErrorMsg = document.getElementById('loginErrorMsg');
const idInput = document.getElementById('loginId');

if (loginForm) {
  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    e.stopPropagation();

    const enteredId = (idInput.value || '').trim();
    const enteredPass = (passInput.value || '').trim();

    const isIdMatch = enteredId.toLowerCase() === VALID_ID.toLowerCase();
    const isPassMatch = VALID_PASSWORDS.includes(enteredPass);

    if (isIdMatch && isPassMatch) {
      if (loginError) loginError.classList.remove('visible');
      try {
        const loginNow = Date.now();
        localStorage.setItem(AUTH_KEY, JSON.stringify({
          user: VALID_ID,
          userId: VALID_ID,
          timestamp: loginNow,
          expiresAt: loginNow + SESSION_TTL_MS
        }));
      } catch (err) {}

      // Play loading animation from JSON, then transition to 3D orb!
      playLoadingAnimationAndRevealOrb();
    } else {
      if (loginError && loginErrorMsg) {
        if (!isIdMatch && !isPassMatch) {
          loginErrorMsg.textContent = 'Invalid User ID and Password.';
        } else if (!isIdMatch) {
          loginErrorMsg.textContent = 'Invalid User ID. Please check your credentials.';
        } else {
          loginErrorMsg.textContent = 'Incorrect Password. Please try again.';
        }
        loginError.classList.remove('visible');
        void loginError.offsetWidth;
        loginError.classList.add('visible');
      }
      passInput.focus();
      passInput.select();
    }
  });
}

// Global user interaction un-locker for AudioContext & tap-to-interrupt
window.addEventListener('pointerdown', (e) => {
  unlockAudio();
  // DO NOT INTERRUPT ON CANVAS TOUCH! Users touch screen to rotate 3D hologram!
  // Only interrupt if user explicitly taps the HUD or status hint pill:
  if (isCallActive && (isAgentSpeaking || activeAudioSources.length > 0)) {
    if (e.target.closest('#hint, #hud, #menuToggleBtn')) {
      interruptAgentSpeech();
    }
  }
}, { passive: true });

// Boot system with High-Tech Startup Sequence on every page load
runSystemStartupSequence(() => {
  initAuth();
});

requestAnimationFrame(render);
</script>
