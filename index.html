<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>AI Orb</title>
<style>
  html,body{margin:0;height:100%;background:#03040a;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif}
  #glow{position:fixed;left:50%;top:46%;width:88vmin;height:88vmin;margin:-44vmin 0 0 -44vmin;border-radius:50%;
    background:radial-gradient(circle,rgba(70,150,255,.38) 0%,rgba(120,70,255,.15) 40%,rgba(0,0,0,0) 68%);
    pointer-events:none;will-change:transform,opacity}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;bottom:70px;left:0;right:0;text-align:center;color:#4b5362;font-size:12px;transition:opacity .6s;pointer-events:none}
  #ui{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(92vw,470px);display:flex;flex-direction:column;gap:8px}
  #f{display:flex;gap:6px}
  #q{flex:1;min-width:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:11px 14px;font-size:15px;outline:none}
  #q:focus{border-color:rgba(120,150,255,.7)}
  #go{background:rgba(120,150,255,.35);border:1px solid rgba(120,150,255,.7);color:#fff;border-radius:12px;padding:0 14px;font-size:14px;cursor:pointer}
  #up,#aud{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:0 14px;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div id="glow"></div>
<canvas id="c"></canvas>
<div id="hint">orb pe tap = mic ON (bolo, RJN shape morph karegi) · 🎵 = audio file</div>
<div id="ui">
  <form id="f" autocomplete="off">
    <input id="q" placeholder="car, plane, 🐘, 🐉, ya koi bhi text / emoji">
    <button type="button" id="up">📷</button>
    <button type="button" id="aud">🎵</button>
    <button type="submit" id="go">▶ Bolo</button>
    <input type="file" id="audFile" accept="audio/*" hidden>
    <input type="file" id="file" accept="image/*" hidden>
  </form>
</div>
<script>
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', {antialias:false, alpha:true, premultipliedAlpha:true});
const glowEl = document.getElementById('glow');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W = 1, H = 1;
function resize(){
  W = cv.width = Math.floor(innerWidth * DPR);
  H = cv.height = Math.floor(innerHeight * DPR);
  gl.viewport(0, 0, W, H);
}
addEventListener('resize', resize);

const VS = `
precision highp float;
attribute vec3 aFrom;
attribute vec3 aTo;
attribute float aSeed;
attribute vec4 aCol;
attribute vec2 aArm;
uniform float uTime,uLevel,uBass,uMid,uHigh,uRotY,uRotX,uDPR,uMorph,uImg,uPx;
uniform vec2 uScale;
uniform vec3 uTouch;
uniform float uChar;
uniform vec2 uMouth;
uniform vec2 uArm;
uniform vec4 uExpr;
varying vec3 vColor;
varying float vA;
varying float vImg;

vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;
  vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}

const vec2 NECK=vec2(0.0812,0.6224);
const vec2 EYE_R=vec2(0.1136,0.7567);
const vec2 EYE_L=vec2(0.0323,0.7298);
const vec2 EYE_RAD=vec2(0.0342,0.0220);
const vec2 MOUTH=vec2(0.0934,0.6884);
const vec2 MOUTH_RAD=vec2(0.0269,0.0134);
const vec2 SHO=vec2(0.2459,0.5712);
const vec2 ELB=vec2(0.2459,0.2929);
vec2 R2(vec2 v,float a){float c=cos(a),s=sin(a);return vec2(c*v.x-s*v.y,s*v.x+c*v.y);}

void main(){
  float t=uTime;
  float isFill=step(0.001,aCol.a)*(1.0-step(0.05,aCol.a));
  float k0=1.0-uImg;
  float m=clamp((uMorph-aSeed*0.45)/0.55,0.0,1.0);
  m=m*m*(3.0-2.0*m);
  vec3 pos=mix(aFrom,aTo,m);
  float mid=sin(3.14159265*m);

  float ang=mid*(1.2+aSeed*2.5);
  float ca=cos(ang),sa=sin(ang);
  pos=vec3(pos.x*ca+pos.z*sa,pos.y,-pos.x*sa+pos.z*ca);
  pos+=vec3(sin(aSeed*127.1),sin(aSeed*311.7),sin(aSeed*74.7))*0.45*mid;

  vec3 dir=normalize(pos+vec3(0.0001));
  float n=snoise(pos*1.5+vec3(0.0,t*0.15,t*0.10));
  float n2=snoise(pos*4.5+vec3(t*0.3,0.0,-t*0.2));
  float d=(n*(0.012+uLevel*0.05+uBass*0.03)+n2*(0.004+uMid*0.015+uHigh*0.008))*k0;
  pos+=dir*d;
  pos*=1.0+uBass*0.05*k0;

  // ---- character animation (built-in girl only) + touch ----
  float ck=uImg*uChar;
  vec3 mv=vec3(0.0);
  float side=smoothstep(0.08,0.30,abs(pos.x));
  float legGate=smoothstep(-0.20,-0.08,pos.y);
  float hairAmp=side*(0.3+0.7*(1.0-smoothstep(-0.1,0.55,pos.y)))*legGate;
  float w1=sin(t*1.6+pos.y*4.0+aSeed*0.6);
  float w2=sin(t*2.3+pos.y*7.0+pos.x*5.0);
  mv+=vec3(w1*0.02+w2*0.01,w2*0.006,w1*0.03)*hairAmp*(1.0+uLevel*2.0);
  mv.x+=sin(t*0.6)*0.02*(pos.y+0.93);
  mv.y+=sin(t*1.25)*0.004*smoothstep(-0.2,0.4,pos.y);
  mv.xy+=vec2(sin(aSeed*91.7+t*3.0),sin(aSeed*53.3+t*2.7))*0.0025*(0.3+uLevel*2.5+uHigh*2.0);
  float hw=smoothstep(NECK.y-0.02,NECK.y+0.07,pos.y);
  float ha=sin(t*0.7)*0.06+sin(t*0.37+1.0)*0.035+uMouth.x*0.035*sin(t*2.3)+uExpr.w*0.03*sin(t*3.1);
  float nod=sin(t*1.1)*0.005-uExpr.w*0.014+uMouth.x*0.003*sin(t*9.0);
  vec2 hp=pos.xy-NECK;
  mv.xy+=hw*(R2(hp,ha)-hp);
  mv.y+=hw*nod;
  float bt=fract(t/4.3);
  float bl=bt<0.07?sin(bt/0.07*3.14159):0.0;
  float bt2=fract(t/7.1+0.3);
  bl=max(bl,bt2<0.06?sin(bt2/0.06*3.14159):0.0);
  bl=max(bl,uExpr.z*0.4);
  vec2 p2=pos.xy+mv.xy;
  vec2 eR=NECK+R2(EYE_R-NECK,ha)+vec2(0.0,nod);
  vec2 eL=NECK+R2(EYE_L-NECK,ha)+vec2(0.0,nod);
  vec2 d1=(p2-eR)/EYE_RAD; vec2 d2=(p2-eL)/EYE_RAD;
  float m1=exp(-dot(d1,d1)*2.5); float m2=exp(-dot(d2,d2)*2.5);
  mv.y+=((eR.y+0.010-p2.y)*m1+(eL.y+0.010-p2.y)*m2)*bl*0.85;
  vec2 mC=NECK+R2(MOUTH-NECK,ha)+vec2(0.0,nod);
  vec2 mq=(p2-mC)/MOUTH_RAD;
  float mm=exp(-dot(mq,mq)*1.4);
  float gap=uMouth.x*0.022;
  float sg=smoothstep(-0.25,0.25,mq.y)*2.0-1.0;
  mv.y+=(sg>0.0?sg*0.25:sg*0.75)*gap*mm;
  mv.x+=(p2.x-mC.x)*(uMouth.y-1.0)*mm;
  {
    vec2 sq=(p2-mC)/vec2(MOUTH_RAD.x*1.9,MOUTH_RAD.y*2.6);
    float mw=exp(-dot(sq,sq)*1.3);
    float cs=smoothstep(0.15,0.9,abs(p2.x-mC.x)/MOUTH_RAD.x);
    float sm=uExpr.x>0.0?uExpr.x:uExpr.x*1.6;
    mv.y+=sm*0.011*cs*mw;
    mv.x+=(p2.x-mC.x)*uExpr.x*0.06*mw;
    vec2 bR=(p2-(eR+vec2(0.0,0.050)))/vec2(0.050,0.018);
    vec2 bL=(p2-(eL+vec2(0.0,0.050)))/vec2(0.050,0.018);
    mv.y+=uExpr.y*0.014*(exp(-dot(bR,bR))+exp(-dot(bL,bL)));
  }
  vec3 tm=vec3(0.0);
  vec2 dv=pos.xy-uTouch.xy;
  float dd=length(dv);
  float fall=exp(-dd*dd*24.0)*uTouch.z;
  tm.xy+=normalize(dv+vec2(0.0001))*fall*0.16+vec2(-dv.y,dv.x)/(dd+0.06)*fall*0.04;
  tm.z+=fall*0.12;
  pos+=mv*ck+tm*uImg;
  {
    vec2 aq=pos.xy;
    aq=ELB+R2(aq-ELB,aArm.y*uArm.y);
    aq=SHO+R2(aq-SHO,aArm.x*uArm.x);
    pos.xy=mix(pos.xy,aq,ck);
  }
  if(isFill>0.5){
    vec2 uvf=aCol.rg*2.0-1.0;
    vec2 fc=mC+vec2(0.0,-0.25*gap);
    pos=vec3(fc.x+uvf.x*MOUTH_RAD.x*0.55*uMouth.y,fc.y+uvf.y*gap*0.5,0.035);
  }
  pos*=1.0+uBass*0.02*uImg;

  float cy=cos(uRotY),sy=sin(uRotY),cx=cos(uRotX),sx=sin(uRotX);
  vec3 r1=vec3(pos.x*cy+pos.z*sy,pos.y,-pos.x*sy+pos.z*cy);
  vec3 r2=vec3(r1.x,r1.y*cx-r1.z*sx,r1.y*sx+r1.z*cx);
  float f=1.0/(2.6-r2.z*0.8);
  gl_Position=vec4(r2.x*f*uScale.x*2.6,r2.y*f*uScale.y*2.6,0.0,1.0);

  float depth=clamp((r2.z/1.6)*0.5+0.5,0.0,1.0);
  float sizeTheme=(0.9+depth*2.0+aSeed*0.6)*uDPR*(1.0+uLevel*0.5);
  gl_PointSize=mix(sizeTheme,uPx,uImg);

  float cmix=n*0.5+0.5+mid*0.4;
  vec3 c1=vec3(0.10,0.65,1.00);
  vec3 c2=vec3(0.55,0.35,1.00);
  vec3 c3=vec3(1.00,0.35,0.75);
  vec3 col=mix(c1,c2,clamp(cmix+depth*0.3-0.2,0.0,1.0));
  col=mix(col,c3,clamp(uLevel*1.2*cmix,0.0,0.7));
  vec3 themeCol=col*(0.4+depth*0.6);
  float themeA=(0.26+mid*0.14)*(0.2+depth*0.7);
  vColor=mix(themeCol,aCol.rgb,uImg);
  vA=mix(themeA,aCol.a,uImg);
  if(isFill>0.5){
    vec2 uvc=aCol.rg*2.0-1.0;
    float teeth=smoothstep(0.35,0.7,uvc.y);
    vec3 inner=mix(vec3(0.30,0.04,0.08),vec3(0.78,0.26,0.32),smoothstep(0.0,0.9,-uvc.y));
    vColor=mix(inner,vec3(0.96,0.93,0.90),teeth*0.9);
    vA=uImg*uChar*smoothstep(0.06,0.25,uMouth.x);
  }
  vImg=uImg;
}`;

const FS = `
precision mediump float;
varying vec3 vColor;
varying float vA;
varying float vImg;
void main(){
  float circ=1.0-smoothstep(0.05,0.5,length(gl_PointCoord-0.5));
  float s=mix(circ,1.0,vImg);
  float al=s*vA;
  gl_FragColor=vec4(vColor*al,al*mix(0.5,1.0,vImg));
}`;

function sh(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);

// ================= SHAPES =================
const N = 90000;
const R = Math.random;
function rndDir(){
  const u = R() * 2 - 1, t = R() * 6.2832, r = Math.sqrt(1 - u * u);
  return [Math.cos(t) * r, u, Math.sin(t) * r];
}
function normalize(a){
  const mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
  for (let i = 0; i < N; i++) for (let c = 0; c < 3; c++){
    const v = a[i * 3 + c]; if (v < mn[c]) mn[c] = v; if (v > mx[c]) mx[c] = v;
  }
  const ct = [(mn[0] + mx[0]) / 2, (mn[1] + mx[1]) / 2, (mn[2] + mx[2]) / 2];
  let m2 = 0;
  for (let i = 0; i < N; i++){
    const x = a[i * 3] -= ct[0], y = a[i * 3 + 1] -= ct[1], z = a[i * 3 + 2] -= ct[2];
    const d = x * x + y * y + z * z; if (d > m2) m2 = d;
  }
  const s = 1 / Math.sqrt(m2 || 1);
  for (let i = 0; i < N * 3; i++) a[i] *= s;
  return a;
}
function build(list){
  const tot = list.reduce((a, b) => a + b[0], 0), cum = []; let acc = 0;
  for (const it of list){ acc += it[0] / tot; cum.push(acc); }
  const out = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    const r = R(); let k = 0; while (k < cum.length - 1 && r > cum[k]) k++;
    const p = list[k][1]();
    out[i * 3] = p[0]; out[i * 3 + 1] = p[1]; out[i * 3 + 2] = p[2];
  }
  return normalize(out);
}
const mapAxis = (ax, a, p, q) => ax === 'x' ? [a, p, q] : ax === 'y' ? [p, a, q] : [p, q, a];
const ell = (c, r) => () => { const d = rndDir(); return [c[0] + d[0] * r[0], c[1] + d[1] * r[1], c[2] + d[2] * r[2]]; };
function box(c, s, ry = 0){
  const ax = s[1] * s[2], ay = s[0] * s[2], az = s[0] * s[1], tot = ax + ay + az, cs = Math.cos(ry), sn = Math.sin(ry);
  return () => {
    const r = R() * tot, u = R() - .5, v = R() - .5, sg = R() < .5 ? -.5 : .5; let x, y, z;
    if (r < ax){ x = sg * s[0]; y = u * s[1]; z = v * s[2]; }
    else if (r < ax + ay){ x = u * s[0]; y = sg * s[1]; z = v * s[2]; }
    else { x = u * s[0]; y = v * s[1]; z = sg * s[2]; }
    return [c[0] + x * cs + z * sn, c[1] + y, c[2] - x * sn + z * cs];
  };
}
function cyl(c, axis, r, len){
  const side = 2 * Math.PI * r * len, cap = 2 * Math.PI * r * r;
  return () => {
    let a, p, q; const th = R() * 6.2832;
    if (R() * (side + cap) < side){ a = (R() - .5) * len; p = r * Math.cos(th); q = r * Math.sin(th); }
    else { a = (R() < .5 ? -.5 : .5) * len; const rr = r * Math.sqrt(R()); p = rr * Math.cos(th); q = rr * Math.sin(th); }
    const m = mapAxis(axis, a, p, q); return [c[0] + m[0], c[1] + m[1], c[2] + m[2]];
  };
}
function torus(c, axis, Rm, r){
  return () => {
    const u = R() * 6.2832, v = R() * 6.2832, rad = Rm + r * Math.cos(v);
    const m = mapAxis(axis, r * Math.sin(v), rad * Math.cos(u), rad * Math.sin(u));
    return [c[0] + m[0], c[1] + m[1], c[2] + m[2]];
  };
}

function genSphere(){
  const out = new Float32Array(N * 3), NS = Math.floor(N * 0.75), GA = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++){
    let x, y, z;
    if (i < NS){ y = 1 - (i / (NS - 1)) * 2; const r = Math.sqrt(1 - y * y), t = GA * i; x = Math.cos(t) * r; z = Math.sin(t) * r; }
    else { const d = rndDir(), rad = 0.2 + 0.55 * Math.pow(R(), 0.7); x = d[0] * rad; y = d[1] * rad; z = d[2] * rad; }
    out[i * 3] = x; out[i * 3 + 1] = y; out[i * 3 + 2] = z;
  }
  return out;
}

// ---- Sports car (nose = +x) ----
function genCar(){
  const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const top = x => { let h = .2; if (x > .5) h -= .13 * sm(.5, 1, x); if (x < -.6) h -= .03 * sm(-.6, -1, x); return h; };
  const bot = x => .02 * sm(.7, 1, x);
  const hw = x => {
    let w = .47;
    if (x > .65) w *= 1 - .45 * Math.pow((x - .65) / .35, 2);
    if (x < -.7) w *= 1 - .2 * Math.pow((-x - .7) / .3, 2);
    const q = (Math.abs(x) - .62) / .17;
    return w * (1 + .08 * Math.exp(-q * q));
  };
  const e = 2 / 3.2;
  const body = () => {
    const x = R() * 2 - 1, th = R() * 6.2832, c = Math.cos(th), s = Math.sin(th);
    const px = Math.sign(c) * Math.pow(Math.abs(c), e), py = Math.sign(s) * Math.pow(Math.abs(s), e);
    const t = top(x), b = bot(x);
    return [x, (t + b) / 2 + py * (t - b) / 2, px * hw(x)];
  };
  const canopy = ell([-.08, .2, 0], [.5, .19, .33]);
  const L = [
    [12, body],
    [2.5, () => { let p; do { p = canopy(); } while (p[1] < .2); return p; }],
    // wing
    [.8, box([-.9, .42, 0], [.16, .025, 1.0])],
    [.2, box([-.9, .44, .5], [.16, .09, .02])],
    [.2, box([-.9, .44, -.5], [.16, .09, .02])],
    [.15, box([-.88, .3, .25], [.03, .2, .03])],
    [.15, box([-.88, .3, -.25], [.03, .2, .03])],
    // aero
    [.5, box([1.0, -.01, 0], [.12, .015, .9])],
    [.3, box([-1.0, .0, 0], [.1, .03, .7])],
    [.3, box([-.99, .15, 0], [.02, .03, .7])],
    [.3, ell([.93, .12, .28], [.06, .015, .1])],
    [.3, ell([.93, .12, -.28], [.06, .015, .1])],
    [.1, cyl([-1.02, .06, .15], 'x', .035, .1)],
    [.1, cyl([-1.02, .06, -.15], 'x', .035, .1)],
    [.3, box([-.3, .12, .49], [.3, .07, .015])],
    [.3, box([-.3, .12, -.49], [.3, .07, .015])],
    [.35, box([0, .0, .5], [1.4, .04, .02])],

function genHeart(){
  const out = new Float32Array(N * 3); let i = 0;
  while (i < N){
    const X = (R() * 2 - 1) * 1.3, Y = (R() * 2 - 1) * .8, Z = (R() * 2 - 1) * 1.3 - .05;
    const a = X * X + 2.25 * Y * Y + Z * Z - 1, v = a * a * a - X * X * Z * Z * Z - .1125 * Y * Y * Z * Z * Z;
    if (v < 0 && v > -.25){ out[i * 3] = X; out[i * 3 + 1] = Z; out[i * 3 + 2] = Y; i++; }

    [7, () => { const t = R() * 2 - 1, a = t * P + (R() < .5 ? 0 : Math.PI); return [r * Math.cos(a) + (R() - .5) * .05, t * 1.2 + (R() - .5) * .05, r * Math.sin(a) + (R() - .5) * .05]; }],
    [3, () => { const t = ((R() * 28) | 0) / 28 * 2 - 1, a = t * P, u = R() * 2 - 1; return [r * Math.cos(a) * u, t * 1.2, r * Math.sin(a) * u]; }],

// 2D (text / emoji) -> points
function fromCoords(list, w, h, depth){
  const n = list.length / 2; if (n < 50) return null;
  const sc = Math.max(w, h) / 2, out = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    const k = ((R() * n) | 0) * 2;
    out[i * 3] = (list[k] + R() - .5 - w / 2) / sc;
    out[i * 3 + 1] = -(list[k + 1] + R() - .5 - h / 2) / sc;
    out[i * 3 + 2] = (R() - .5) * depth;
  }
  return normalize(out);
}
function genText(str){
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d', {willReadFrequently:true});
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = 'bold 100px sans-serif';
  const w = g.measureText(str).width || 100;
  g.font = 'bold ' + Math.min(400, 100 * (S * .9) / w) + 'px sans-serif';
  g.fillText(str, S / 2, S / 2 + 6);
  const d = g.getImageData(0, 0, S, S).data, list = [];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) if (d[(y * S + x) * 4 + 3] > 128) list.push(x, y);
  return fromCoords(list, S, S, .22);
}

// Image -> exact pixel-for-pixel particles (1 particle = 1 pixel, real colors)
function genImage(img, fill, maskImg, underImg){
  const draw = (im, gw, gh) => {
    const c = document.createElement('canvas'); c.width = gw; c.height = gh;
    const g = c.getContext('2d', {willReadFrequently:true});
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    g.drawImage(im, 0, 0, gw, gh);
    return g.getImageData(0, 0, gw, gh).data;
  };
  const pack = sc => {
    const gw = Math.max(2, Math.floor(img.width * sc)), gh = Math.max(2, Math.floor(img.height * sc));
    const d = draw(img, gw, gh); let cnt = 0, cu = 0, u = null;
    for (let i = 3; i < d.length; i += 4) if (d[i] > 25) cnt++;
    if (underImg){ u = draw(underImg, gw, gh); for (let i = 3; i < u.length; i += 4) if (u[i] > 25) cu++; }
    return {gw, gh, d, u, cnt, tot: cnt + cu};
  };
  let sc = Math.sqrt(N * .94 / (img.width * img.height)), r = pack(sc);
  for (let it = 0; it < 4 && r.tot > 0 && (r.tot > N * .96 || r.tot < N * .90); it++){ sc *= Math.sqrt(N * .94 / r.tot); r = pack(sc); }
  while (r.tot > N * .97){ sc *= .98; r = pack(sc); }
  const {gw, gh, d, u} = r, diag = Math.hypot(gw, gh);
  const mk = maskImg ? draw(maskImg, gw, gh) : null;
  const pos = new Float32Array(N * 3), col = new Float32Array(N * 4), arm = new Float32Array(N * 2);
  // depth relief: only for cut-outs (images with transparent background)
  const dist = new Float32Array(gw * gh); let maxd = 1; const relief = r.cnt < gw * gh * .97;
  if (relief){
    for (let i = 0; i < gw * gh; i++) dist[i] = d[i * 4 + 3] > 25 ? 1e6 : 0;
    for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++){
      const i = y * gw + x; if (!dist[i]) continue; let v = dist[i];
      if (x === 0 || y === 0 || x === gw - 1 || y === gh - 1) v = 1;
      if (x > 0) v = Math.min(v, dist[i - 1] + 1);
      if (y > 0){ v = Math.min(v, dist[i - gw] + 1); if (x > 0) v = Math.min(v, dist[i - gw - 1] + 1.414); if (x < gw - 1) v = Math.min(v, dist[i - gw + 1] + 1.414); }
      dist[i] = v;
    }
    for (let y = gh - 1; y >= 0; y--) for (let x = gw - 1; x >= 0; x--){
      const i = y * gw + x; if (!dist[i]) continue; let v = dist[i];
      if (x < gw - 1) v = Math.min(v, dist[i + 1] + 1);
      if (y < gh - 1){ v = Math.min(v, dist[i + gw] + 1); if (x < gw - 1) v = Math.min(v, dist[i + gw + 1] + 1.414); if (x > 0) v = Math.min(v, dist[i + gw - 1] + 1.414); }
      dist[i] = v; if (v > maxd) maxd = v;
    }
  }
  let k = 0;
  const put = (x, y, z, cr, cg, cb, wa, wf) => {
    pos[k * 3] = (x - gw / 2 + .5) / (diag / 2); pos[k * 3 + 1] = -(y - gh / 2 + .5) / (diag / 2); pos[k * 3 + 2] = z;
    col[k * 4] = cr; col[k * 4 + 1] = cg; col[k * 4 + 2] = cb; col[k * 4 + 3] = 1;
    arm[k * 2] = wa; arm[k * 2 + 1] = wf; k++;
  };
  // 1) under-layer (what is behind the arm) is drawn first, 2) body, 3) arm on top
  if (u) for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++){
    const i = (y * gw + x) * 4;
    if (u[i + 3] > 25 && k < N) put(x, y, -.02, u[i] / 255, u[i + 1] / 255, u[i + 2] / 255, 0, 0);
  }
  for (let pass = 0; pass < 2; pass++) for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++){
    const i = (y * gw + x) * 4;
    if (d[i + 3] <= 25 || k >= N) continue;
    const inArm = !!(mk && mk[i + 2] > 127);
    if ((pass === 1) !== inArm) continue;
    put(x, y, relief ? Math.sqrt(dist[y * gw + x] / maxd) * .10 - .05 : 0, d[i] / 255, d[i + 1] / 255, d[i + 2] / 255,
        inArm ? mk[i] / 255 : 0, inArm ? mk[i + 1] / 255 : 0);
  }
  if (fill){
    const nf = Math.min(N - k, 1800);
    for (let j = 0; j < nf; j++){
      const a = R() * 6.2832, rr = Math.sqrt(R());
      col[k * 4] = Math.cos(a) * rr * .5 + .5; col[k * 4 + 1] = Math.sin(a) * rr * .5 + .5; col[k * 4 + 2] = 0; col[k * 4 + 3] = .02;
      k++;
    }
  }
  return {pos, col, arm, hx: gw / diag, hy: gh / diag, gw};
}

function setTarget(arr, md, col, arm){
  if (!arr) return;
  for (let i = 0; i < N; i++){
    let m = Math.min(1, Math.max(0, (morph - seeds[i] * .45) / .55)); m = m * m * (3 - 2 * m);
    for (let c = 0; c < 3; c++){ const k = i * 3 + c; curFrom[k] = curFrom[k] * (1 - m) + curTo[k] * m; }
  }
  curTo.set(arr); morph = 0; mode = md;
  gl.bindBuffer(gl.ARRAY_BUFFER, bFrom); gl.bufferData(gl.ARRAY_BUFFER, curFrom, gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, bTo);   gl.bufferData(gl.ARRAY_BUFFER, curTo, gl.DYNAMIC_DRAW);
  if (col){
    gl.bindBuffer(gl.ARRAY_BUFFER, bCol); gl.bufferData(gl.ARRAY_BUFFER, col, gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, bArm); gl.bufferData(gl.ARRAY_BUFFER, arm || zeroArm, gl.DYNAMIC_DRAW);
  }
}

}

// Additional 3D Mathematical Shapes
function genStar(){
  const out = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    const angle = R() * Math.PI * 2;
    const rBase = 0.52 + 0.45 * Math.cos(5 * angle);
    const r = Math.pow(R(), 0.5) * rBase;
    const z = (R() - 0.5) * 0.28 * (1.0 - r / 1.0);
    out[i * 3] = r * Math.sin(angle);
    out[i * 3 + 1] = r * Math.cos(angle);
    out[i * 3 + 2] = z;
  }
  return normalize(out);
}

function genDiamond(){
  const out = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    const th = R() * 6.2832;
    const y = R() * 2 - 1;
    const maxR = (1 - Math.abs(y)) * (0.8 + 0.2 * Math.cos(8 * th));
    const r = Math.pow(R(), 0.5) * maxR;
    out[i * 3] = r * Math.cos(th);
    out[i * 3 + 1] = y * 1.1;
    out[i * 3 + 2] = r * Math.sin(th);
  }
  return normalize(out);
}

function genFlower(){
  const out = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    const u = R(), th = R() * 6.2832 * 3;
    const r = Math.pow(u, 0.6) * 0.9;
    const petal = 0.7 + 0.3 * Math.cos(6 * th);
    const y = (1.0 - Math.pow(r / 0.9, 1.5)) * 0.4 + Math.sin(th * 3) * 0.08;
    out[i * 3] = r * petal * Math.cos(th);
    out[i * 3 + 1] = y - 0.2;
    out[i * 3 + 2] = r * petal * Math.sin(th);
  }
  return normalize(out);
}

function genGalaxy(){
  const out = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    const arm = ((R() * 2) | 0) * Math.PI;
    const dist = Math.pow(R(), 0.7) * 1.2;
    const angle = dist * 3.5 + arm + (R() - 0.5) * 0.35;
    const spread = Math.exp(-dist * 1.5) * 0.18 + 0.03;
    out[i * 3] = dist * Math.cos(angle) + (R() - 0.5) * spread;
    out[i * 3 + 1] = (R() - 0.5) * spread * 0.7;
    out[i * 3 + 2] = dist * Math.sin(angle) + (R() - 0.5) * spread;
  }
  return normalize(out);
}

function genSword(){
  return build([
    [7, () => {
      const y = -0.2 + R() * 1.5;
      const taper = Math.max(0.05, 1.0 - Math.max(0, (y - 1.0) / 0.3));
      return [(R() - 0.5) * 0.12 * taper, y, (R() - 0.5) * 0.03 * taper];
    }],
    [2, box([0, -0.25, 0], [0.65, 0.06, 0.08])],
    [1.5, cyl([0, -0.55, 0], 'y', 0.045, 0.55)],
    [0.8, ell([0, -0.85, 0], [0.08, 0.08, 0.08])]
  ]);
}

function genShield(){
  const out = new Float32Array(N * 3);
  let i = 0;
  while (i < N){
    const x = (R() * 2 - 1) * 0.7, y = (R() * 2 - 1) * 0.9;
    let bound = 0.7;
    if (y < 0) bound = 0.7 * (1 - Math.pow(-y / 0.9, 1.8));
    if (Math.abs(x) < bound){
      out[i * 3] = x;
      out[i * 3 + 1] = y;
      out[i * 3 + 2] = (1 - (x * x) / (bound * bound + 0.01)) * 0.15 + (R() - 0.5) * 0.04;
      i++;
    }
  }
  return normalize(out);
}

  if (name === 'girl' || name === 'ladki' || name === 'rjn'){
    showGirl();

  const mapped = ALIAS[name] || name;
  if (SHAPES[mapped]){

    highlightActiveChip(mapped);

    setTarget(genText(name), 1);
    highlightActiveChip('');
  }
}

      model: 'qwen/qwen3.8-27b',
      messages,
      response_format: { type: 'json_object' },
      temperature: 0.5,
      max_tokens: 38
    })
  });

  if (!resp.ok) throw new Error('Groq HTTP ' + resp.status);
  const data = await resp.json();
  const parsed = JSON.parse(data.choices[0].message.content);

  chatHistory.push({ role: 'user', content: userMsg });
  chatHistory.push({ role: 'assistant', content: parsed.reply || '' });
  if (chatHistory.length > 6) chatHistory = chatHistory.slice(-6);

  return parsed;
}

// ================= ULTRA-FAST DEEPGRAM TTS (45ms LATENCY) =================
let activeAudioSource = null;

async function speakRJN(text){
  if (!text) return;
  initAudioContext();
  updateStatus('speaking', '🔊 RJN बोल रही है...');

  try {
    let ttsUrl = '';
    let token = DG_TOKEN;

    if (voiceMode === 'aura') {
      // Deepgram Aura Luna: Blazing fast 45ms TTS!
      ttsUrl = 'https://api.deepgram.com/v1/speak?model=aura-luna-en';
    } else {
      // Deepgram Flux Prachi: Generative Hindi
      ttsUrl = 'https://api.deepgram.com/v2/speak?model=flux-prachi-hi&expressivity=1';
    }

    let resp = await fetch(ttsUrl, {
      method: 'POST',
      headers: {
        'Authorization': `Token ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ text })
    });

    if (!resp.ok && voiceMode !== 'aura') {
      // Fallback to Aura if Flux fails or takes too long
      ttsUrl = 'https://api.deepgram.com/v1/speak?model=aura-luna-en';
      resp = await fetch(ttsUrl, {
        method: 'POST',
        headers: { 'Authorization': `Token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
    }

    if (!resp.ok) throw new Error('TTS HTTP ' + resp.status);

    const audioBuffer = await resp.arrayBuffer();
    const decodedBuffer = await audioCtx.decodeAudioData(audioBuffer);

    if (activeAudioSource) {
      try { activeAudioSource.stop(); } catch(e){}
    }

    const src = audioCtx.createBufferSource();
    src.buffer = decodedBuffer;
    src.connect(analyser);
    analyser.connect(audioCtx.destination);
    activeAudioSource = src;

    src.onended = () => {
      activeAudioSource = null;
      if (isCallActive) {
        updateStatus('listening', '🎙️ RJN सुन रही है... (Boliye)');
      } else {
        updateStatus('idle', '📞 Tap Orb or ▶ Bolo to Talk');
      }
    };

    src.start(0);
  } catch(err) {
    console.warn('TTS playback error:', err);
    if (isCallActive) updateStatus('listening', '🎙️ RJN सुन रही है... (Boliye)');
  }
}

// ================= PRE-EMPTIVE 0ms INTENT MORPHING =================
// Instantly changes the 3D particle shape the exact millisecond the word is spoken!
function checkVoiceIntent(str){
  const s = (str || '').toLowerCase();
  if (/\b(car|gadi|gaadi|sports car)\b/.test(s)) { morphShape('car'); return 'car'; }
  if (/\b(dil|heart|love)\b/.test(s)) { morphShape('heart'); return 'heart'; }
  if (/\b(plane|jahaz|airplane|aeroplane|jet)\b/.test(s)) { morphShape('plane'); return 'plane'; }
  if (/\b(rocket)\b/.test(s)) { morphShape('rocket'); return 'rocket'; }
  if (/\b(star|tara|sitara)\b/.test(s)) { morphShape('star'); return 'star'; }
  if (/\b(diamond|heera|crystal)\b/.test(s)) { morphShape('diamond'); return 'diamond'; }
  if (/\b(flower|phool|gulab|kamal|rose|lotus)\b/.test(s)) { morphShape('flower'); return 'flower'; }
  if (/\b(sword|talwar|talwaar)\b/.test(s)) { morphShape('sword'); return 'sword'; }
  if (/\b(shield|dhal|armor)\b/.test(s)) { morphShape('shield'); return 'shield'; }
  if (/\b(dna|helix)\b/.test(s)) { morphShape('dna'); return 'dna'; }
  if (/\b(cube|box)\b/.test(s)) { morphShape('cube'); return 'cube'; }
  if (/\b(donut|torus)\b/.test(s)) { morphShape('donut'); return 'donut'; }
  if (/\b(galaxy|universe|spiral)\b/.test(s)) { morphShape('galaxy'); return 'galaxy'; }
  if (/\b(girl|ladki|rjn|chehra|avatar|face)\b/.test(s)) { showGirl(); return 'girl'; }
  if (/\b(orb|gola|sphere|ball)\b/.test(s)) { morphShape('orb'); return 'orb'; }
  return null;
}

// ================= PHONE MIC & DEEPGRAM STREAMING STT =================
let isCallActive = false;
let micStream = null;
let mediaRecorder = null;
let dgSocket = null;
let speechDebounceTimer = null;
let transcriptBuffer = '';

function updateStatus(state, msg){
  hintEl.textContent = msg;
}

async function toggleVoiceCall(){
  initAudioContext();
  if (isCallActive) {
    stopVoiceCall();
  } else {
    startVoiceCall();
  }
}

async function startVoiceCall(){
  try {
    isCallActive = true;
    updateStatus('active', '🎙️ Connecting Phone Mic...');

    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });

    connectDeepgramSTT();
  } catch(err) {
    console.error('Mic access error:', err);
    isCallActive = false;
    updateStatus('idle', '⚠️ Mic Permission Allow Karo · Tap to Retry');
  }
}

function stopVoiceCall(){
  isCallActive = false;
  if (speechDebounceTimer) clearTimeout(speechDebounceTimer);
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    try { mediaRecorder.stop(); } catch(e){}
  }
  if (dgSocket) {
    try { dgSocket.close(); } catch(e){}
    dgSocket = null;
  }
  if (micStream) {
    micStream.getTracks().forEach(t => t.stop());
    micStream = null;
  }
  if (activeAudioSource) {
    try { activeAudioSource.stop(); } catch(e){}
    activeAudioSource = null;
  }
  updateStatus('idle', 'orb pe tap = mic ON (bolo, girl lipsync karegi) · 🎵 = audio file');
}

function connectDeepgramSTT(){
  if (!isCallActive) return;

  // Ultra-low latency endpointing: 150ms silence detection
  const wsUrl = 'wss://api.deepgram.com/v1/listen?model=nova-2&language=hi&smart_format=true&interim_results=true&endpointing=150';
  dgSocket = new WebSocket(wsUrl, ['token', DG_TOKEN]);

  dgSocket.onopen = () => {
    console.log('Deepgram STT WebSocket connected');
    updateStatus('listening', '🎙️ RJN सुन रही है... (Boliye)');

    try {
      mediaRecorder = new MediaRecorder(micStream, { mimeType: 'audio/webm;codecs=opus' });
    } catch(e) {
      mediaRecorder = new MediaRecorder(micStream);
    }

    mediaRecorder.ondataavailable = e => {
      // Prevent speaker audio feedback
      if (e.data.size > 0 && dgSocket && dgSocket.readyState === WebSocket.OPEN && !activeAudioSource) {
        dgSocket.send(e.data);
      }
    };

    // 100ms slices for instant streaming
    mediaRecorder.start(100);
  };

  dgSocket.onmessage = event => {
    if (!isCallActive || activeAudioSource) return;
    try {
      const data = JSON.parse(event.data);
      const alt = data.channel && data.channel.alternatives && data.channel.alternatives[0];
      const text = alt && alt.transcript ? alt.transcript.trim() : '';

      if (text) {
        updateStatus('listening', `🎙️ "${text}"`);
        transcriptBuffer = text;

        // 0ms PRE-EMPTIVE SHAPE MORPHING!
        checkVoiceIntent(text);

        if (speechDebounceTimer) clearTimeout(speechDebounceTimer);

        // If speech_final is true, trigger IMMEDIATELY (0ms delay)!
        const delay = data.speech_final ? 0 : 250;
        speechDebounceTimer = setTimeout(() => {
          if (transcriptBuffer && !activeAudioSource) {
            const userSpeech = transcriptBuffer;
            transcriptBuffer = '';
            triggerVoiceQuery(userSpeech);
          }
        }, delay);
      }
    } catch(err) {
      console.warn('DG msg parse err', err);
    }
  };

  dgSocket.onerror = e => console.warn('Deepgram WS error', e);
  dgSocket.onclose = () => {
    if (isCallActive && !activeAudioSource) {
      setTimeout(connectDeepgramSTT, 1000);
    }
  };
}

async function triggerVoiceQuery(userSpeech){
  if (!userSpeech || activeAudioSource) return;
  updateStatus('thinking', '✨ RJN सोच रही है...');

  try {
    const res = await callGroqAI(userSpeech);
    console.log('RJN response:', res);

    if (res.shape && res.shape !== 'none') {
      morphShape(res.shape);
    }

    if (res.reply) {
      await speakRJN(res.reply);
    } else {
      updateStatus('listening', '🎙️ RJN सुन रही है... (Boliye)');
    }
  } catch(err) {
    console.error('Query processing error:', err);
    updateStatus('listening', '🎙️ RJN सुन रही है... (Boliye)');
  }
}

// ================= DRAG, TOUCH & ZOOM CONTROLS =================
let rotX = 0, rotY = 0, targetRotX = 0, targetRotY = 0;
let isDragging = false, lastMouseX = 0, lastMouseY = 0;
let touchPos = [0, 0, 0];
let pointerDownX = 0, pointerDownY = 0, pointerDownTime = 0;
let userZoom = 1.0;

cv.addEventListener('pointerdown', e => {
  isDragging = true;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  pointerDownX = e.clientX;
  pointerDownY = e.clientY;
  pointerDownTime = performance.now();
  const nx = (e.clientX / innerWidth) * 2 - 1;
  const ny = -(e.clientY / innerHeight) * 2 + 1;
  touchPos = [nx, ny, 1.0];

  if (mode === 2) triggerHandWave();
});

window.addEventListener('pointermove', e => {
  const nx = (e.clientX / innerWidth) * 2 - 1;
  const ny = -(e.clientY / innerHeight) * 2 + 1;
  if (isDragging) {
    const dx = e.clientX - lastMouseX;
    const dy = e.clientY - lastMouseY;
    targetRotY += dx * 0.006;
    targetRotX += dy * 0.006;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    touchPos = [nx, ny, 1.0];
  } else {
    touchPos[0] = nx;
    touchPos[1] = ny;
    touchPos[2] = Math.max(0.0, touchPos[2] - 0.03);
  }
});

window.addEventListener('pointerup', e => {
  if (isDragging) {
    isDragging = false;
    const dist = Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY);
    const duration = performance.now() - pointerDownTime;
    if (dist < 12 && duration < 350 && e.target === cv) {
      toggleVoiceCall();
    }
  }
});

window.addEventListener('pointercancel', () => { isDragging = false; });

// Multi-touch pinch-to-zoom
let initialPinchDist = null, initialPinchZoom = 1.0;
window.addEventListener('touchstart', e => {
  if (e.touches && e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    initialPinchDist = Math.hypot(dx, dy);
    initialPinchZoom = userZoom;
  }
}, { passive: true });

window.addEventListener('touchmove', e => {
  if (e.touches && e.touches.length === 2 && initialPinchDist) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    userZoom = Math.min(2.5, Math.max(0.4, initialPinchZoom * (dist / initialPinchDist)));
  }
}, { passive: true });

window.addEventListener('touchend', e => {
  if (!e.touches || e.touches.length < 2) initialPinchDist = null;
}, { passive: true });

window.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY < 0 ? 0.08 : -0.08;
  userZoom = Math.min(2.5, Math.max(0.4, userZoom + delta));
}, { passive: false });

// ================= RENDER LOOP (EXACT WEBGL PIPELINE) =================
let lastT = performance.now();
let audioLevel = 0, bassLevel = 0, midLevel = 0, highLevel = 0;
let mouthOpen = 0, mouthWidth = 1.0;

function render(now){
  requestAnimationFrame(render);
  const dt = Math.min((now - lastT) * 0.001, 0.1);
  lastT = now;
  const t = now * 0.001;

  rotX += (targetRotX - rotX) * 0.08;
  rotY += (targetRotY - rotY) * 0.08;
  if (!isDragging && mode !== 2) {
    targetRotY += 0.0035;
  }

  // Audio frequency sampling & reactivity
  if (analyser && audioDataArr) {
    analyser.getByteFrequencyData(audioDataArr);
    let bSum = 0, mSum = 0, hSum = 0, tot = 0;
    const n = audioDataArr.length;
    for (let i = 0; i < n; i++){
      const v = audioDataArr[i] / 255.0;
      tot += v;
      if (i < n * 0.15) bSum += v;
      else if (i < n * 0.55) mSum += v;
      else hSum += v;
    }
    const bAvg = bSum / (n * 0.15);
    const mAvg = mSum / (n * 0.40);
    const hAvg = hSum / (n * 0.45);
    const totAvg = tot / n;

    audioLevel += (totAvg - audioLevel) * 0.25;
    bassLevel += (bAvg - bassLevel) * 0.25;
    midLevel += (mAvg - midLevel) * 0.25;
    highLevel += (hAvg - highLevel) * 0.25;

    // Lipsync calculation for girl mode
    const vocalEnergy = Math.max(0.0, (midLevel * 1.8 + audioLevel * 1.2) - 0.08);
    const targetMouth = Math.min(1.0, vocalEnergy * 2.2);
    mouthOpen += (targetMouth - mouthOpen) * 0.35;
    mouthWidth += ((1.0 + bassLevel * 0.4 - highLevel * 0.2) - mouthWidth) * 0.25;
  } else {
    audioLevel *= 0.95;
    bassLevel *= 0.95;
    midLevel *= 0.95;
    highLevel *= 0.95;
    mouthOpen *= 0.9;
  }

  // Arm waving animation
  if (waveActive) {
    const elapsed = (now - waveStartTime) * 0.001;
    armAngle[0] = Math.sin(elapsed * 6.0) * 0.45 + 0.35;
    armAngle[1] = Math.sin(elapsed * 8.0) * 0.55 + 0.25;
  } else {
    armAngle[0] *= 0.9;
    armAngle[1] *= 0.9;
  }

  if (morph < 1) morph = Math.min(1, morph + dt * 0.9);

  // Background radial glow reacts organically
  const glowScale = 1.0 + bassLevel * 0.16 + (mode === 2 ? 0.04 : 0.0);
  const glowOpacity = 0.55 + audioLevel * 0.45;
  glowEl.style.transform = `scale(${glowScale})`;
  glowEl.style.opacity = glowOpacity;

  // Responsive scale fitting
  const aspect = W / H;
  let scX = 1.0, scY = 1.0;
  if (aspect < 1.0) {
    const mobileFit = 0.62;
    scX = mobileFit;
    scY = mobileFit * aspect;
  } else {
    const desktopFit = 0.72;
    scX = desktopFit / aspect;
    scY = desktopFit;
  }
  const curShapeZoom = shapeZoom || 1.0;
  scX *= curShapeZoom * userZoom;
  scY *= curShapeZoom * userZoom;

  gl.uniform1f(U.uTime, t);
  gl.uniform1f(U.uLevel, audioLevel);
  gl.uniform1f(U.uBass, bassLevel);
  gl.uniform1f(U.uMid, midLevel);
  gl.uniform1f(U.uHigh, highLevel);
  gl.uniform1f(U.uRotX, rotX);
  gl.uniform1f(U.uRotY, rotY);
  gl.uniform1f(U.uMorph, morph);
  gl.uniform2f(U.uScale, scX, scY);
  gl.uniform1f(U.uImg, mode === 2 ? 1.0 : 0.0);
  gl.uniform1f(U.uChar, mode === 2 ? 1.0 : 0.0);
  gl.uniform1f(U.uPx, (mode === 2 ? 2.4 : 1.4) * DPR);
  gl.uniform3f(U.uTouch, touchPos[0], touchPos[1], touchPos[2]);
  gl.uniform2f(U.uMouth, mouthOpen, mouthWidth);
  gl.uniform2f(U.uArm, armAngle[0], armAngle[1]);
  gl.uniform4f(U.uExpr, 0.4, 0.0, 0.0, 0.0);

  if (mode === 2) {
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  } else {
    gl.blendFunc(gl.ONE, gl.ONE);
  }

  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.POINTS, 0, N);
}

requestAnimationFrame(render);
</script>
